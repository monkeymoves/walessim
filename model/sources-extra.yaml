# Sources cited by rules (model/rules/*.yaml) that model/sources.yaml does not hold.
# Written by the engine lead; model/sources.yaml belongs to the data agent and is never edited here.
# If an id here also appears in sources.yaml, the build keeps the sources.yaml entry and warns.
# Where a source is a body of literature rather than one publication, the title says so and the
# rule's confidence reflects it. "to check" marks a reference that a reviewer should confirm.
