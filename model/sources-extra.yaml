      cy: "Amcan bras. Canfu fod pobl heb drafnidiaeth yn colli neu'n gwrthod gofal iechyd, felly gall bysiau sy'n cyrraedd yr orsaf helpu iechyd. Rheol gêm yw'r maint, ac mae'r cysylltiad i'w wirio eto yn erbyn tystiolaeth o Gymru."
