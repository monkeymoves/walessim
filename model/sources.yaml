- id: ons_hle_local
  title: 'Healthy life expectancy, UK: between 2011 to 2013 and 2022 to 2024'
  publisher: Office for National Statistics
  url: https://www.ons.gov.uk/peoplepopulationandcommunity/healthandsocialcare/healthandlifeexpectancies/datasets/healthstatelifeexpectancyallagesuk
  api_url: https://www.ons.gov.uk/file?uri=/peoplepopulationandcommunity/healthandsocialcare/healthandlifeexpectancies/datasets/healthstatelifeexpectancyallagesuk/current/healthylifeexpectancyuk.xlsx
  licence: Open Government Licence v3.0
  licence_url: https://www.ons.gov.uk/help/termsandconditions
  accessed: '2026-11-27'
  notes: Released 19 February 2026. Sheet 1, period 2022 to 2024, age group under 1, unitary authorities in Wales (area codes
    W06). The indicator is the simple mean of male and female healthy life expectancy, the same rule as life_exp; the Wales
    value is the mean of the published male (59.2) and female (58.5) Wales figures. ONS used a modelled method for good health
    prevalence because the Annual Population Survey sample has shrunk.
- id: ons_suicides_la
  title: Suicides in England and Wales by local authority (2025 registrations)
  publisher: Office for National Statistics
