  licence_url: https://www.ons.gov.uk/help/termsandconditions
  accessed: '2026-11-27'
  notes: Table_2, rolling three year aggregate for deaths registered 2023 to 2025, persons, age-standardised rate per 100,000
    (2013 European Standard Population). Wales value as published (14.6). All 22 authorities have a rate. Based on date of
    registration, so inquest delays differ by area.
