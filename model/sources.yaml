- id: statswales_air_quality
  title: Air quality, population weighted annual mean concentrations (NO2, PM2.5) for local authorities
  publisher: Welsh Government via StatsWales, from Defra Pollution Climate Mapping modelling and ONS small area populations
  url: https://stats.gov.wales/en-GB/36f88bfb-36a3-4b54-9c24-51dcab107a62
  api_url: https://api.stats.gov.wales/v2/36f88bfb-36a3-4b54-9c24-51dcab107a62/data
