      - { id: cheap-fares, name: { en: "Cheap fares for a year", cy: "Prisiau rhad am flwyddyn", cy_review: true }, what: { en: "Cut bus and train fares so people can still get to work.", cy: "Torri prisiau bysiau a threnau fel bod pobl yn dal i gyrraedd y gwaith.", cy_review: true }, cost: 1, effects: [{ kind: measure, measure: climate, points: 0.1 }, { kind: backing, points: 0.2 }], handled_well: true }
    sources: [nomis_census_ts061, desnz_la_ghg]

