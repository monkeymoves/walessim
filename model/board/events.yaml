      - { id: short-courses, name: { en: "Free short courses", cy: "Cyrsiau byr am ddim", cy_review: true }, what: { en: "Short courses for adults in the skills firms now want.", cy: "Cyrsiau byr i oedolion yn y sgiliau mae cwmnïau eu heisiau nawr.", cy_review: true }, cost: 1, effects: [{ kind: measure, measure: work, points: 0.2 }], handled_well: true }
