      - { id: homes-for-locals, name: { en: "Buy homes for local rent", cy: "Prynu cartrefi i'w rhentu'n lleol", cy_review: true }, what: { en: "Buy empty homes and rent them to local people at a fair price.", cy: "Prynu cartrefi gwag a'u rhentu i bobl leol am bris teg.", cy_review: true }, cost: 2, effects: [{ kind: measure, measure: homes, points: 0.3 }, { kind: young_adults, points: 0.1 }], handled_well: true }
