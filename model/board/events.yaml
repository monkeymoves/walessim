    target: { pick: highest_risk, risk: employer }
    warning: { en: "Trade is slowing. Towns that lean on one employer are most at risk: {councils}.", cy: "Mae masnach yn arafu. Trefi sy'n dibynnu ar un cyflogwr sydd fwyaf mewn perygl: {councils}.", cy_review: true }
    landed: { en: "Jobs were lost in {council}. Shops on the high street felt it next.", cy: "Collwyd swyddi yn {council}. Siopau'r stryd fawr oedd nesaf i'w deimlo.", cy_review: true }
    effects:
      - { kind: measure, measure: work, points: -1.2, jobs: true }
      - { kind: young_adults, points: -0.1 }
      - { kind: backing, points: -0.2 }
    size:
      - when: [{ kind: project, project: back-local-firms, where: here }]
        factor: 0.5
      - when: [{ kind: project, project: skills-college, where: here }]
        factor: 0.5
      - when: [{ kind: risk, risk: employer, at_least: 3 }]
        factor: 1.5
    prepared_by: [back-local-firms, skills-college]
    responses:
      - { id: accept, name: { en: "Ride it out", cy: "Dal ati", cy_review: true }, what: { en: "Wait for trade to pick up.", cy: "Aros i fasnach wella.", cy_review: true }, cost: 0, effects: [], handled_well: false }
      - { id: retrain, name: { en: "Help people retrain", cy: "Helpu pobl i ailhyfforddi", cy_review: true }, what: { en: "Pay for courses so people who lost work can find new work.", cy: "Talu am gyrsiau fel bod pobl a gollodd waith yn cael gwaith newydd.", cy_review: true }, cost: 2, effects: [{ kind: measure, measure: work, points: 0.3 }], handled_well: true }
    sources: [plant-closure, nomis_claimant]

