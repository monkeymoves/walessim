    landed: { en: "Fuel costs hit drivers in {council}. Some gave up jobs they could not reach.", cy: "Tarodd costau tanwydd yrwyr yn {council}. Rhoddodd rhai'r gorau i swyddi na allen nhw eu cyrraedd.", cy_review: true }
