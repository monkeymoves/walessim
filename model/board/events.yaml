# Events that grow from the board (docs/design/v2-board.md section 7.1). Owner: package 10.
#
# 24 events: 8 from outside (drawn from the future's weather, economy and prices tracks) and 16
# grown from the state of the board, 5 of them good news. Every event is warned ahead on the time
# line (rule E1 `warn_years`): an outside event about a year and a half ahead, a grown one about a
# year. The warning names a window of two seasons, and the event lands inside it. Grown triggers are
# checked when a year closes.
#
# Honesty: severities, effect sizes, size factors, track thresholds and response costs are all
# GAME RULES (tune). `sources` name the evidence that this kind of thing happens in Wales, not its
# size. Fairness rule 3: every outside event lists two tier 1 projects in `prepared_by`, and its
# `size` halves the effect where one of them stands (first match wins).
# Slots: {council} the target, {councils} the target then those most at risk, {river} on river events.
note: "Severities, sizes, thresholds and response costs are game rules (tune)."
events:
  # ===========================================================================
  # From outside: weather
  - id: storm-winter
    name: { en: "Storm winter", cy: "Gaeaf stormus", cy_review: true }
    origin: outside
    good: false
    track: weather
    severity: 3
    trigger:
      - { kind: track, track: weather, at_least: 0.6 }
      - { kind: feature, feature: river }
    target: { pick: highest_risk, risk: flood }
    travels: downstream
    warning: { en: "Heavy rain is likely over the {river}. {councils} are most at risk.", cy: "Mae glaw trwm yn debygol dros afon {river}. {councils} sydd fwyaf mewn perygl.", cy_review: true }
    landed: { en: "The {river} burst its banks in {council}. Homes and shops were flooded.", cy: "Gorlifodd afon {river} yn {council}. Cafodd cartrefi a siopau eu llifogi.", cy_review: true }
    effects:
      - { kind: measure, measure: homes, points: -0.8 }
      - { kind: measure, measure: nature, points: -0.8 }
      - { kind: measure, measure: health, points: -0.2 }
      - { kind: backing, points: -0.2 }
      # Local truth (playtest 9 should-fix 11): a council the river has just flooded never reads
      # "Flood risk low". The flood shows the risk: a step up where it lands, less where prepared.
      - { kind: risk, risk: flood, steps: 1 }
    size:
      - when: [{ kind: project, project: rivers-room, where: within_link, links: [river] }]
        factor: 0.3
      - when: [{ kind: project, project: slow-the-water, where: within_link, links: [river] }]
        factor: 0.5
      - when: [{ kind: project, project: coal-tips-safe, where: here }]
        factor: 0.5
      - when: [{ kind: risk, risk: flood, at_least: 3 }]
        factor: 1.5
    prepared_by: [slow-the-water, coal-tips-safe]
    responses:
      - { id: accept, name: { en: "Clear up", cy: "Clirio", cy_review: true }, what: { en: "Clear the mud and carry on.", cy: "Clirio'r mwd a bwrw ymlaen.", cy_review: true }, cost: 0, effects: [], handled_well: false }
      - { id: help-families, name: { en: "Help families home", cy: "Helpu teuluoedd adref", cy_review: true }, what: { en: "Pay for drying out and repairs, so families get home sooner.", cy: "Talu am sychu a thrwsio, fel bod teuluoedd yn mynd adref yn gynt.", cy_review: true }, cost: 1, effects: [{ kind: measure, measure: homes, points: 0.2 }, { kind: backing, points: 0.3 }], handled_well: true }
      - { id: repair-defences, name: { en: "Repair and raise the defences", cy: "Trwsio a chodi'r amddiffynfeydd", cy_review: true }, what: { en: "Fix the homes and raise the river walls.", cy: "Trwsio'r cartrefi a chodi waliau'r afon.", cy_review: true }, cost: 2, effects: [{ kind: measure, measure: homes, points: 0.3 }, { kind: risk, risk: flood, steps: -1 }], handled_well: true }
    sources: [statswales_flood, nrw-flood-risk, ukcp18]

  - id: coastal-surge
    name: { en: "A storm surge on the coast", cy: "Ymchwydd storm ar yr arfordir", cy_review: true }
    origin: outside
    good: false
    track: weather
    severity: 2
    trigger:
      - { kind: track, track: weather, at_least: 0.7 }
      - { kind: feature, feature: coast }
    target: { pick: highest_risk, risk: flood }
    warning: { en: "A storm and very high tides are forecast. {councils} have the lowest land by the sea.", cy: "Mae storm a llanw uchel iawn ar y ffordd. {councils} sydd â'r tir isaf wrth y môr.", cy_review: true }
    landed: { en: "The sea came over the banks in {council}.", cy: "Daeth y môr dros y cloddiau yn {council}.", cy_review: true }
    effects:
      - { kind: measure, measure: homes, points: -0.8 }
      - { kind: measure, measure: nature, points: -0.4 }
      - { kind: measure, measure: work, points: -0.4 }
    size:
      - when: [{ kind: project, project: coast-wetlands, where: here }]
        factor: 0.5
      - when: [{ kind: project, project: slow-the-water, where: within_link, links: [river] }]
        factor: 0.5
    prepared_by: [coast-wetlands, slow-the-water]
    visit: gwent-levels
    responses:
      - { id: accept, name: { en: "Clear up", cy: "Clirio", cy_review: true }, what: { en: "Pump out the water and carry on.", cy: "Pwmpio'r dŵr allan a bwrw ymlaen.", cy_review: true }, cost: 0, effects: [], handled_well: false }
      - { id: raise-banks, name: { en: "Raise the sea banks", cy: "Codi cloddiau'r môr", cy_review: true }, what: { en: "Build the banks higher where the sea came over.", cy: "Codi'r cloddiau'n uwch lle daeth y môr drosodd.", cy_review: true }, cost: 2, effects: [{ kind: measure, measure: homes, points: 0.2 }, { kind: risk, risk: flood, steps: -1 }], handled_well: true }
    sources: [nrw-flood-risk, ukcp18, statswales_flood]

  - id: hot-summer
    name: { en: "A long hot summer", cy: "Haf hir a phoeth", cy_review: true }
    origin: outside
    good: false
    track: weather
    severity: 2
    trigger:
      - { kind: track, track: weather, at_least: 0.6 }
      - { kind: measure, measure: health, op: below, value: 5 }
    target: { pick: lowest_measure, measure: health }
    warning: { en: "A long hot summer is likely. Older people in {councils} are most at risk.", cy: "Mae haf hir a phoeth yn debygol. Pobl hŷn yn {councils} sydd fwyaf mewn perygl.", cy_review: true }
    landed: { en: "The heat made people ill in {council}. The hills dried out.", cy: "Gwnaeth y gwres bobl yn sâl yn {council}. Sychodd y bryniau.", cy_review: true }
    effects:
      - { kind: measure, measure: health, points: -0.8 }
      - { kind: measure, measure: nature, points: -0.4 }
      - { kind: backing, points: -0.3, group: older }
    size:
      - when: [{ kind: project, project: warm-terraces, where: here }]
        factor: 0.5
      - when: [{ kind: project, project: buses-meet-trains, where: here }]
        factor: 0.5
    prepared_by: [warm-terraces, buses-meet-trains]
    responses:
      - { id: accept, name: { en: "Ride it out", cy: "Dal ati", cy_review: true }, what: { en: "Wait for the heat to pass.", cy: "Aros i'r gwres basio.", cy_review: true }, cost: 0, effects: [], handled_well: false }
      - { id: cool-rooms, name: { en: "Open cool rooms", cy: "Agor ystafelloedd oer", cy_review: true }, what: { en: "Open cool rooms in libraries and halls, and check on older neighbours.", cy: "Agor ystafelloedd oer mewn llyfrgelloedd a neuaddau, a galw ar gymdogion hŷn.", cy_review: true }, cost: 1, effects: [{ kind: measure, measure: health, points: 0.2 }, { kind: backing, points: 0.2, group: older }], handled_well: true }
    sources: [ukcp18, greenspace-health]

  # ===========================================================================
  # From outside: the economy
  - id: downturn
    name: { en: "A downturn", cy: "Dirwasgiad", cy_review: true }
    origin: outside
    good: false
    track: economy
    severity: 3
    trigger:
      - { kind: track, track: economy, at_least: 0.6 }
