# Letters from 2050 (docs/design/v2-board.md sections 8 and 16.5.3). Owner: package 10.
# 24 letters: two for each of the twelve endings.
# Each is a MADE-UP VOICE from the council that changed most, and says so in its sign-off.
# Two per ending: one for when Life in your years was the weaker of the two scores ("life"), one for when
# Left for 2050 was ("left"). Slots: {council}, {town}, {project}, {year}, {place}.
# People talking: exempt from the plain words list, not from the 18 word and no dash rules.
note: "Every letter is a made-up voice, signed as one."
letters:
  # Two countries
  - id: two-countries-life
    ending: two-countries
    lower: life
    salutation: { en: "To whoever ran Wales from 2026,", cy: "At bwy bynnag oedd yn rhedeg Cymru o 2026,", cy_review: true }
    body: { en: "I'm writing from {town}. I read about the big new things and felt glad for somebody else. Up here, the last bus still leaves early. My grandson works over the bridge now. He rings on Sundays. You did good things. Just not here, and not for us.", cy: "Rwy'n ysgrifennu o {town}. Darllenais am y pethau mawr newydd a theimlo'n falch dros rywun arall. Fan hyn, mae'r bws olaf yn dal i adael yn gynnar. Mae fy ŵyr yn gweithio dros y bont nawr. Mae'n ffonio ar ddydd Sul. Fe wnaethoch bethau da. Ond nid yma, ac nid i ni.", cy_review: true }
    named: { en: "The closest you came was {project}, in {year}. We read about it in the paper.", cy: "Y agosaf daethoch chi oedd {project}, yn {year}. Fe ddarllenon ni amdano yn y papur.", cy_review: true }
    signoff: { en: "A retired nurse in {town} (a made-up voice)", cy: "Nyrs wedi ymddeol yn {town} (llais dychmygol)", cy_review: true }

  - id: two-countries-left
    ending: two-countries
    lower: left
    salutation: { en: "To whoever ran Wales from 2026,", cy: "At bwy bynnag oedd yn rhedeg Cymru o 2026,", cy_review: true }
    body: { en: "Things here look much as they did when you started, only older. The young ones went where the work went. The good things you built will last, somewhere. I hope the next person looks at the map and sees us too.", cy: "Mae pethau yma'n edrych yn debyg i sut oedden nhw pan ddechreuoch chi, ond yn hŷn. Aeth y rhai ifanc lle aeth y gwaith. Bydd y pethau da a adeiladoch chi'n para, yn rhywle. Rwy'n gobeithio y bydd y person nesaf yn edrych ar y map ac yn ein gweld ninnau hefyd.", cy_review: true }
    named: { en: "I know {project} opened in {year}. It was not built with {town} in mind.", cy: "Rwy'n gwybod bod {project} wedi agor yn {year}. Doedd e ddim wedi'i adeiladu gyda {town} mewn golwg.", cy_review: true }
    signoff: { en: "A shopkeeper in {town} (a made-up voice)", cy: "Siopwr yn {town} (llais dychmygol)", cy_review: true }

  # The joined-up valleys
  - id: joined-up-valleys-life
    ending: joined-up-valleys
    lower: life
    salutation: { en: "Dear you, whoever you were,", cy: "Annwyl chi, pwy bynnag oeddech chi,", cy_review: true }
    body: { en: "My daughter catches the early train up the line, not down it. Her office moved here. Last year she bought the house two doors from me. The chip shop has a queue again. It took years, and some of them were hard. It was worth it.", cy: "Mae fy merch yn dal y trên cynnar i fyny'r lein, nid i lawr. Symudodd ei swyddfa yma. Llynedd prynodd y tŷ ddau ddrws oddi wrtha i. Mae ciw yn y siop sglodion eto. Cymerodd flynyddoedd, ac roedd rhai'n galed. Roedd yn werth chweil.", cy_review: true }
    named: { en: "{project} came to {town} in {year}. That is when it turned.", cy: "Daeth {project} i {town} yn {year}. Dyna pryd y trodd pethau.", cy_review: true }
    signoff: { en: "A mother in {town} (a made-up voice)", cy: "Mam yn {town} (llais dychmygol)", cy_review: true }

  - id: joined-up-valleys-left
    ending: joined-up-valleys
    lower: left
    salutation: { en: "To the one who started all this,", cy: "At yr un a ddechreuodd hyn i gyd,", cy_review: true }
    body: { en: "I'm nineteen and I'm staying. Most of my year are too. That never used to happen here. The trains go both ways now, and there is work at our end. I don't know what you were thinking back then. Whatever it was, thanks.", cy: "Rwy'n bedair ar bymtheg ac rwy'n aros. Mae'r rhan fwyaf o fy mlwyddyn yn aros hefyd. Doedd hynny byth yn digwydd yma. Mae'r trenau'n mynd y ddwy ffordd nawr, ac mae gwaith yn ein pen ni. Dwi ddim yn gwybod beth oeddech chi'n ei feddwl bryd hynny. Beth bynnag oedd e, diolch.", cy_review: true }
    named: { en: "My first job was at {project}, in {town}. It opened in {year}.", cy: "Roedd fy swydd gyntaf yn {project}, yn {town}. Agorodd yn {year}.", cy_review: true }
    signoff: { en: "An apprentice in {town} (a made-up voice)", cy: "Prentis yn {town} (llais dychmygol)", cy_review: true }

  # The warm country
  - id: warm-country-life
    ending: warm-country
    lower: life
    salutation: { en: "To whoever ran Wales from 2026,", cy: "At bwy bynnag oedd yn rhedeg Cymru o 2026,", cy_review: true }
    body: { en: "This is the first winter I have not worn a coat indoors. The doctor says my chest is better. Nobody made a fuss about it. The men just came, street by street, and did the walls. My bills are the smallest they have ever been.", cy: "Dyma'r gaeaf cyntaf i mi beidio â gwisgo cot yn y tŷ. Mae'r meddyg yn dweud bod fy mrest yn well. Wnaeth neb ffws. Daeth y dynion, stryd wrth stryd, a gwneud y waliau. Mae fy miliau'n llai nag y buon nhw erioed.", cy_review: true }
    named: { en: "{project} reached {town} in {year}.", cy: "Cyrhaeddodd {project} {town} yn {year}.", cy_review: true }
    signoff: { en: "A pensioner in {town} (a made-up voice)", cy: "Pensiynwr yn {town} (llais dychmygol)", cy_review: true }

  - id: warm-country-left
    ending: warm-country
    lower: left
    salutation: { en: "Dear whoever you were,", cy: "Annwyl bwy bynnag oeddech chi,", cy_review: true }
    body: { en: "We never got a big new factory, and some people moan about that. But no child in my class goes home to a cold house. The gap people talked about has closed a little. It was slow work. It lasts.", cy: "Chawson ni erioed ffatri fawr newydd, ac mae rhai'n cwyno am hynny. Ond does dim plentyn yn fy nosbarth yn mynd adref i dŷ oer. Mae'r bwlch roedd pobl yn sôn amdano wedi cau ychydig. Gwaith araf oedd e. Mae'n para.", cy_review: true }
    named: { en: "I still remember when {project} came to {town}, in {year}.", cy: "Rwy'n dal i gofio pan ddaeth {project} i {town}, yn {year}.", cy_review: true }
    signoff: { en: "A teacher in {town} (a made-up voice)", cy: "Athrawes yn {town} (llais dychmygol)", cy_review: true }

  # The green valleys
  - id: green-valleys-life
    ending: green-valleys
    lower: life
    salutation: { en: "To whoever ran Wales from 2026,", cy: "At bwy bynnag oedd yn rhedeg Cymru o 2026,", cy_review: true }
    body: { en: "It rained for a week in January. I did not carry the furniture upstairs. I did not even go and look at the river. The water went where you gave it room to go. My kids swim in that river in summer. My dad never could.", cy: "Bu'n bwrw glaw am wythnos ym mis Ionawr. Wnes i ddim cario'r dodrefn i fyny'r grisiau. Wnes i ddim hyd yn oed mynd i edrych ar yr afon. Aeth y dŵr lle rhoesoch chi le iddo fynd. Mae fy mhlant yn nofio yn yr afon honno yn yr haf. Allai fy nhad byth.", cy_review: true }
    named: { en: "{project} was finished near {town} in {year}.", cy: "Cafodd {project} ei orffen ger {town} yn {year}.", cy_review: true }
    signoff: { en: "A father in {town} (a made-up voice)", cy: "Tad yn {town} (llais dychmygol)", cy_review: true }

  - id: green-valleys-left
    ending: green-valleys
    lower: left
    salutation: { en: "Dear you,", cy: "Annwyl chi,", cy_review: true }
    body: { en: "The hills above us are green and full of walkers. The work is steady, not grand. Some of my friends still travel a long way for good pay. But the storms pass us by, and the river is alive. My grandchildren will have that.", cy: "Mae'r bryniau uwch ein pennau'n wyrdd ac yn llawn cerddwyr. Mae'r gwaith yn gyson, nid yn fawreddog. Mae rhai o fy ffrindiau'n dal i deithio'n bell am gyflog da. Ond mae'r stormydd yn pasio heibio, ac mae'r afon yn fyw. Bydd hynny gan fy wyrion.", cy_review: true }
    named: { en: "I walk past {project} most days. It opened near {town} in {year}.", cy: "Rwy'n cerdded heibio {project} bron bob dydd. Agorodd ger {town} yn {year}.", cy_review: true }
    signoff: { en: "A park warden in {town} (a made-up voice)", cy: "Warden parc yn {town} (llais dychmygol)", cy_review: true }

  # The workshop
  - id: workshop-life
    ending: workshop
    lower: life
    salutation: { en: "To whoever ran Wales from 2026,", cy: "At bwy bynnag oedd yn rhedeg Cymru o 2026,", cy_review: true }
    body: { en: "I make parts that end up all over the world. My dad was laid off twice. I never have been. The pay is good and the work is here. I do miss the field where the factory stands. You can't have everything, I suppose.", cy: "Rwy'n gwneud darnau sy'n mynd i bob cwr o'r byd. Collodd fy nhad ei waith ddwywaith. Dydw i erioed wedi. Mae'r cyflog yn dda ac mae'r gwaith yma. Rwy'n gweld eisiau'r cae lle mae'r ffatri'n sefyll. Allwch chi ddim cael popeth, mae'n debyg.", cy_review: true }
    named: { en: "I started at {project} in {year}, in {town}.", cy: "Dechreuais yn {project} yn {year}, yn {town}.", cy_review: true }
    signoff: { en: "A machinist in {town} (a made-up voice)", cy: "Peiriannydd yn {town} (llais dychmygol)", cy_review: true }

  - id: workshop-left
    ending: workshop
    lower: left
    salutation: { en: "Dear whoever you were,", cy: "Annwyl bwy bynnag oeddech chi,", cy_review: true }
    body: { en: "The jobs are good and they stayed. That matters more than people outside know. But the lorries never stop, and the marsh by the river is mostly car park now. I hope whoever comes next looks after the land as well as the work.", cy: "Mae'r swyddi'n dda ac fe arhoson nhw. Mae hynny'n bwysicach nag y mae pobl o'r tu allan yn ei wybod. Ond dydy'r lorïau byth yn stopio, ac maes parcio yw'r gors wrth yr afon nawr gan fwyaf. Gobeithio bydd pwy bynnag ddaw nesaf yn gofalu am y tir yn ogystal â'r gwaith.", cy_review: true }
    named: { en: "{project} opened in {town} in {year}.", cy: "Agorodd {project} yn {town} yn {year}.", cy_review: true }
    signoff: { en: "A union rep in {town} (a made-up voice)", cy: "Cynrychiolydd undeb yn {town} (llais dychmygol)", cy_review: true }

  # The city and its bedrooms
  - id: city-bedrooms-life
    ending: city-bedrooms
    lower: life
    salutation: { en: "To whoever ran Wales from 2026,", cy: "At bwy bynnag oedd yn rhedeg Cymru o 2026,", cy_review: true }
    body: { en: "The train to the city is quick now, I'll give you that. I'm on it every day. So is everyone. The town is quiet in the daytime, like a dormitory. The pub shut. The young ones rent in the city and visit their mams on Sundays.", cy: "Mae'r trên i'r ddinas yn gyflym nawr, rhaid cyfaddef. Rwy arno bob dydd. Felly pawb arall. Mae'r dref yn dawel yn ystod y dydd, fel ystafell gysgu. Caeodd y dafarn. Mae'r rhai ifanc yn rhentu yn y ddinas ac yn ymweld â'u mamau ar ddydd Sul.", cy_review: true }
    named: { en: "{project} came through {town} in {year}. It carried more people out than in.", cy: "Daeth {project} drwy {town} yn {year}. Cariodd fwy o bobl allan nag i mewn.", cy_review: true }
    signoff: { en: "A commuter in {town} (a made-up voice)", cy: "Cymudwr yn {town} (llais dychmygol)", cy_review: true }

  - id: city-bedrooms-left
    ending: city-bedrooms
    lower: left
    salutation: { en: "Dear you,", cy: "Annwyl chi,", cy_review: true }
    body: { en: "Houses here are cheap, which is the only reason my son could buy one. He works in the city and sleeps here. There is nobody his age on the street in the day. The line is good. I wish there were something at our end of it.", cy: "Mae tai yma'n rhad, a dyna'r unig reswm y gallai fy mab brynu un. Mae'n gweithio yn y ddinas ac yn cysgu yma. Does neb o'i oed ar y stryd yn ystod y dydd. Mae'r lein yn dda. Hoffwn pe bai rhywbeth yn ein pen ni ohoni.", cy_review: true }
    named: { en: "{project} opened in {year}. It brought the city closer and left {town} emptier.", cy: "Agorodd {project} yn {year}. Daeth â'r ddinas yn nes a gadael {town} yn wacach.", cy_review: true }
    signoff: { en: "A widow in {town} (a made-up voice)", cy: "Gwraig weddw yn {town} (llais dychmygol)", cy_review: true }

  # The patchwork
  - id: patchwork-life
    ending: patchwork
    lower: life
    salutation: { en: "To whoever ran Wales from 2026,", cy: "At bwy bynnag oedd yn rhedeg Cymru o 2026,", cy_review: true }
    body: { en: "Nothing big happened here. A bus that turns up. A warmer school. A path up the mountain. Each one small. Added up, the place feels looked after. That counts for something, after the years when nobody looked at all.", cy: "Ddigwyddodd dim byd mawr yma. Bws sy'n cyrraedd. Ysgol gynhesach. Llwybr i fyny'r mynydd. Pob un yn fach. Gyda'i gilydd, mae'r lle'n teimlo bod rhywun yn gofalu. Mae hynny'n cyfrif, ar ôl y blynyddoedd pan nad oedd neb yn edrych o gwbl.", cy_review: true }
    named: { en: "The one I noticed most was {project}, in {year}.", cy: "Yr un a sylwais arno fwyaf oedd {project}, yn {year}.", cy_review: true }
    signoff: { en: "A bus driver in {town} (a made-up voice)", cy: "Gyrrwr bws yn {town} (llais dychmygol)", cy_review: true }

  - id: patchwork-left
    ending: patchwork
    lower: left
    salutation: { en: "Dear whoever you were,", cy: "Annwyl bwy bynnag oeddech chi,", cy_review: true }
    body: { en: "You did a bit everywhere, and that was kind. I wonder sometimes what one big thing might have done. The river still worries us in winter. The young still drift off. But we are better off than when you started, and I will say so.", cy: "Fe wnaethoch chi ychydig ym mhobman, ac roedd hynny'n garedig. Rwy'n meddwl weithiau beth allai un peth mawr fod wedi'i wneud. Mae'r afon yn dal i'n poeni yn y gaeaf. Mae'r ifanc yn dal i adael. Ond rydyn ni'n well ein byd na phan ddechreuoch chi, ac fe ddyweda i hynny.", cy_review: true }
    named: { en: "{project} came to {town} in {year}.", cy: "Daeth {project} i {town} yn {year}.", cy_review: true }
    signoff: { en: "A café owner in {town} (a made-up voice)", cy: "Perchennog caffi yn {town} (llais dychmygol)", cy_review: true }

  # The drift
  - id: drift-life
    ending: drift
    lower: life
    salutation: { en: "To whoever ran Wales from 2026,", cy: "At bwy bynnag oedd yn rhedeg Cymru o 2026,", cy_review: true }
    body: { en: "You might think nothing changed here. That is not quite true. We changed it ourselves. The chapel became a food bank, then a café. Neighbours cleared the slip on the mountain road. We would have liked more help. We managed anyway.", cy: "Efallai eich bod yn meddwl na newidiodd dim byd yma. Dydy hynny ddim yn hollol wir. Fe newidion ni bethau ein hunain. Trodd y capel yn fanc bwyd, yna'n gaffi. Cliriodd cymdogion y llithriad ar ffordd y mynydd. Bydden ni wedi hoffi mwy o help. Fe lwyddon ni beth bynnag.", cy_review: true }
    named: { en: "The one thing of yours I remember is {project}, in {year}.", cy: "Yr un peth gennych chi rwy'n ei gofio yw {project}, yn {year}.", cy_review: true }
    signoff: { en: "A volunteer in {town} (a made-up voice)", cy: "Gwirfoddolwr yn {town} (llais dychmygol)", cy_review: true }

  - id: drift-left
    ending: drift
    lower: left
    salutation: { en: "Dear you,", cy: "Annwyl chi,", cy_review: true }
    body: { en: "The storms and the bills did most of the deciding, these years. We held on. The town is still here, still stubborn, still singing on a Saturday. Next time, I hope someone with a plan comes and asks us first.", cy: "Y stormydd a'r biliau oedd yn penderfynu fwyaf, y blynyddoedd hyn. Fe ddalion ni ati. Mae'r dref yma o hyd, yn dal yn styfnig, yn dal i ganu ar nos Sadwrn. Y tro nesaf, gobeithio daw rhywun â chynllun a gofyn i ni gyntaf.", cy_review: true }
    named: { en: "I remember {project}, in {year}. I wish there had been more like it.", cy: "Rwy'n cofio {project}, yn {year}. Hoffwn pe bai mwy tebyg iddo wedi bod.", cy_review: true }
    signoff: { en: "A choir member in {town} (a made-up voice)", cy: "Aelod o'r côr yn {town} (llais dychmygol)", cy_review: true }

  # The long game
  - id: long-game-life
    ending: long-game
    lower: life
    salutation: { en: "To whoever ran Wales from 2026,", cy: "At bwy bynnag oedd yn rhedeg Cymru o 2026,", cy_review: true }
    body: { en: "For years we heard about it and saw nothing but fences. People here gave up asking. Then it opened, all at once. My son says it will be good for his children. I hope he is right. I wish it had come sooner.", cy: "Am flynyddoedd clywson ni amdano a gweld dim ond ffensys. Rhoddodd pobl yma'r gorau i ofyn. Yna agorodd, i gyd ar unwaith. Mae fy mab yn dweud y bydd yn dda i'w blant. Gobeithio ei fod yn iawn. Hoffwn petai wedi dod yn gynt.", cy_review: true }
    named: { en: "{project} opened in {town} in {year}. We had waited a long time.", cy: "Agorodd {project} yn {town} yn {year}. Roedden ni wedi aros yn hir.", cy_review: true }
    signoff: { en: "A grandmother in {town} (a made-up voice)", cy: "Mam-gu yn {town} (llais dychmygol)", cy_review: true }

  - id: long-game-left
    ending: long-game
    lower: left
    salutation: { en: "Dear you,", cy: "Annwyl chi,", cy_review: true }
    body: { en: "I started work the year it opened. Everyone older says the town was hard going for a long time. It does not feel like that now. There are new faces on the platform every week. I think the best part is still coming.", cy: "Dechreuais weithio'r flwyddyn yr agorodd. Mae pawb hŷn yn dweud bod y dref yn anodd am amser hir. Dydy hi ddim yn teimlo felly nawr. Mae wynebau newydd ar y platfform bob wythnos. Rwy'n credu bod y rhan orau eto i ddod.", cy_review: true }
    named: { en: "My first job was at {project}, in {town}. It opened in {year}.", cy: "Roedd fy swydd gyntaf yn {project}, yn {town}. Agorodd yn {year}.", cy_review: true }
    signoff: { en: "A young worker in {town} (a made-up voice)", cy: "Gweithiwr ifanc yn {town} (llais dychmygol)", cy_review: true }

  # The comeback
  - id: comeback-life
    ending: comeback
    lower: life
    salutation: { en: "To the one who came back,", cy: "At yr un a ddaeth yn ôl,", cy_review: true }
    body: { en: "We did not vote for you. I will be honest about that. Then you sat down with our council and made a deal. You kept it, which surprised us. The street looks different now. I still grumble, but not about that.", cy: "Wnaethon ni ddim pleidleisio drosoch chi. Rwy'n onest am hynny. Yna eisteddoch chi gyda'n cyngor a gwneud bargen. Fe wnaethoch ei chadw, ac fe synnodd hynny ni. Mae'r stryd yn edrych yn wahanol nawr. Rwy'n dal i gwyno, ond nid am hynny.", cy_review: true }
    named: { en: "{project} came to {town} in {year}, as you promised.", cy: "Daeth {project} i {town} yn {year}, fel y gwnaethoch addo.", cy_review: true }
    signoff: { en: "A bus driver in {town} (a made-up voice)", cy: "Gyrrwr bws yn {town} (llais dychmygol)", cy_review: true }

  - id: comeback-left
    ending: comeback
    lower: left
    salutation: { en: "To whoever ran Wales from 2026,", cy: "At bwy bynnag oedd yn rhedeg Cymru o 2026,", cy_review: true }
    body: { en: "People write off places like ours. You nearly did, and then you did not. I remember the year it turned. Shops opened instead of closing. My daughter came home from Bristol. That is the whole story, really.", cy: "Mae pobl yn anghofio am lefydd fel ein lle ni. Bu bron i chi wneud hynny, ac yna wnaethoch chi ddim. Rwy'n cofio'r flwyddyn y trodd pethau. Agorodd siopau yn lle cau. Daeth fy merch adref o Fryste. Dyna'r stori i gyd, a dweud y gwir.", cy_review: true }
    named: { en: "It started with {project} in {town}, in {year}.", cy: "Dechreuodd gyda {project} yn {town}, yn {year}.", cy_review: true }
    signoff: { en: "A café owner in {town} (a made-up voice)", cy: "Perchennog caffi yn {town} (llais dychmygol)", cy_review: true }

  # The gamble
  - id: gamble-life
    ending: gamble
    lower: life
    salutation: { en: "To whoever ran Wales from 2026,", cy: "At bwy bynnag oedd yn rhedeg Cymru o 2026,", cy_review: true }
    body: { en: "When the big firm came, the whole town cheered. I got a job there, and so did my brother. When it went, it went fast. Nothing else had grown up around it. We are still picking up the pieces.", cy: "Pan ddaeth y cwmni mawr, roedd y dref gyfan yn bloeddio. Ces i swydd yno, a fy mrawd hefyd. Pan aeth, aeth yn gyflym. Doedd dim byd arall wedi tyfu o'i gwmpas. Rydyn ni'n dal i godi'r darnau.", cy_review: true }
    named: { en: "The site in {town} has been quiet since {year}.", cy: "Mae'r safle yn {town} wedi bod yn dawel ers {year}.", cy_review: true }
    signoff: { en: "A former machine operator in {town} (a made-up voice)", cy: "Cyn-weithredwr peiriannau yn {town} (llais dychmygol)", cy_review: true }

  - id: gamble-left
    ending: gamble
    lower: left
    salutation: { en: "To the one who took the chance,", cy: "At yr un a fentrodd,", cy_review: true }
    body: { en: "I understand why you did it. Jobs now are easier to promise than skills later. But my children learned a lesson from it. Do not lean on one firm. They are building something smaller and slower, and it is theirs.", cy: "Rwy'n deall pam y gwnaethoch hynny. Mae'n haws addo swyddi nawr na sgiliau wedyn. Ond dysgodd fy mhlant wers. Peidiwch â dibynnu ar un cwmni. Maen nhw'n adeiladu rhywbeth llai ac arafach, a nhw sydd biau fe.", cy_review: true }
    named: { en: "The big firm left {town} in {year}. We remember the date.", cy: "Gadawodd y cwmni mawr {town} yn {year}. Rydyn ni'n cofio'r dyddiad.", cy_review: true }
    signoff: { en: "A teacher in {town} (a made-up voice)", cy: "Athro yn {town} (llais dychmygol)", cy_review: true }

  # Holding the line
  - id: holding-line-life
    ending: holding-line
    lower: life
    salutation: { en: "To whoever ran Wales from 2026,", cy: "At bwy bynnag oedd yn rhedeg Cymru o 2026,", cy_review: true }
    body: { en: "Nobody will write a song about these years. Nothing big opened here. But the river stayed out of my kitchen. The bus still comes. In a hard time, that counts for more than people think.", cy: "Fydd neb yn ysgrifennu cân am y blynyddoedd hyn. Agorodd dim byd mawr yma. Ond arhosodd yr afon allan o fy nghegin. Mae'r bws yn dal i ddod. Mewn cyfnod caled, mae hynny'n cyfrif mwy nag y mae pobl yn ei feddwl.", cy_review: true }
    named: { en: "{project} has kept {town} safe since {year}.", cy: "Mae {project} wedi cadw {town} yn ddiogel ers {year}.", cy_review: true }
    signoff: { en: "A pensioner in {town} (a made-up voice)", cy: "Pensiynwr yn {town} (llais dychmygol)", cy_review: true }

  - id: holding-line-left
    ending: holding-line
    lower: left
    salutation: { en: "Dear you, whoever you were,", cy: "Annwyl chi, pwy bynnag oeddech chi,", cy_review: true }
    body: { en: "You did not change the world. You kept it standing, which is harder than it sounds. Every storm, I watched the water and waited. It never came in. The next person can build on that.", cy: "Wnaethoch chi ddim newid y byd. Fe wnaethoch ei gadw ar ei draed, sy'n anoddach nag mae'n swnio. Gyda phob storm, roeddwn i'n gwylio'r dŵr ac yn aros. Ddaeth e byth i mewn. Gall y person nesaf adeiladu ar hynny.", cy_review: true }
    named: { en: "We were glad of {project} in {town}, built in {year}.", cy: "Roedden ni'n falch o {project} yn {town}, wedi'i adeiladu yn {year}.", cy_review: true }
    signoff: { en: "A shop worker in {town} (a made-up voice)", cy: "Gweithiwr siop yn {town} (llais dychmygol)", cy_review: true }
