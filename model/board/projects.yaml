  # ---------------------------------------------------------------------------
  # Legacy projects (16.3.5): each opens only once its keystone is working. 5 coins, three years.
  # Each region wide part is a special the engine acts on: links_up (every upgraded link rises a
  # step), colleges_up (every skills college works a level higher), storm_no_coins (answers to
  # storms cost nothing) and running_halved (running costs cut, B1 running_share).
  - id: firms-train-own
    branch: made_here
    tier: 2
    keystone: false
    legacy_of: cluster-roots
    site: council
    cost: 5
    build_years: 3
    name: { en: "Firms that train their own", cy: "Cwmnïau sy'n hyfforddi eu pobl eu hunain", cy_review: true }
    what: { en: "Firms in the cluster train their own workers with every skills college. Each college does more.", cy: "Mae cwmnïau yn y clwstwr yn hyfforddi eu gweithwyr eu hunain gyda phob coleg sgiliau. Mae pob coleg yn gwneud mwy.", cy_review: true }
    example: { en: "Apprentices from colleges in Merthyr Tydfil and Ebbw Vale join firms around Newport and Caerphilly.", cy: "Mae prentisiaid o golegau ym Merthyr Tudful a Glynebwy yn ymuno â chwmnïau o gwmpas Casnewydd a Chaerffili.", cy_review: true }
    catch: { en: "It only helps where a skills college already stands.", cy: "Dim ond lle mae coleg sgiliau'n sefyll yn barod y mae'n helpu.", cy_review: true }
