# The board's projects (docs/design/v2-board.md sections 5.3, 16.3 and 16.4). Owner: package 10
# (content and words).
#
# Honesty: every cost, build time, running cost, level factor and effect size here is a GAME RULE
# (a starting value marked "tune" in the design, set by the balance bots in section 16.6). None is a
# real figure. `sources` name the evidence for the direction of each effect, not its size.
# Examples name real places and real kinds of thing. No project claims any real body has agreed to it.
# Every Welsh string is a fresh draft for a fluent reviewer (cy_review: true).
#
# Phase 2 (section 16): build times are in years. Quick projects (`quick: true`, the small wins of
# 16.4) cost 2 coins and open within a year; other tier 1 projects take two years, tier 2 three,
# keystones six (8 coins). Measure effects began as the phase 1 sizes times 1.25 for tier 1, 1.5 for
# tier 2 and 2 for keystones (16.3.2); the balance rounds moved them since (playtest 8: quick
# projects 1.75 times their first size, with shallow roots, R1 `quick_max_factor`; tier 2, legacy
# projects and keystones 1.3 times), all logged in docs/design/board-balance-log.md. Each keystone
# unlocks one legacy project (`legacy_of`, 5 coins, three years, 16.3.5). Running costs are coins a
# year, charged a little every step.
# Branch 1 is each board's own, with its projects, in model/board/boards/<id>/branch.yaml (ADR 0009).
# The build puts each branch's projects together in tree order, legacy projects last.
projects:
  # ---------------------------------------------------------------------------
  # Branch 2: Made here (skills and firms that stay)
  - id: skills-college
    branch: made_here
    tier: 1
    keystone: false
    site: council
    cost: 3
    build_years: 2
    name: { en: "Skills college and apprenticeships", cy: "Coleg sgiliau a phrentisiaethau", cy_review: true }
    what: { en: "Courses and apprenticeships for the work nearby. People gain skills they can use locally.", cy: "Cyrsiau a phrentisiaethau ar gyfer y gwaith gerllaw. Mae pobl yn ennill sgiliau y gallan nhw eu defnyddio'n lleol.", cy_review: true }
    example: { en: "Merthyr Tydfil, Nantgarw, Ebbw Vale or Newport.", cy: "Merthyr Tudful, Nantgarw, Glynebwy neu Gasnewydd.", cy_review: true }
    catch: { en: "Skills need jobs within reach. Without them, young people qualify and leave.", cy: "Mae angen swyddi o fewn cyrraedd ar sgiliau. Hebddyn nhw, mae pobl ifanc yn cymhwyso ac yn gadael.", cy_review: true }
    needs: []
    effects:
      - { kind: measure, measure: work, points: 0.75, after_years: 4, ramp_years: 4 }
      - { kind: risk, risk: employer, steps: -1, after_years: 4 }
    upgrade_costs: [3, 4]
    level_factor: [1, 2.2, 3.5]
    tags: [college]
    sources: [apprenticeship-outcomes, returns-qualifications]

