# The South East's starts: what you were elected on (docs/design/v2-board.md section 7.2, v3-wales.md
# section 3). Owner: content (package 17). A start every board offers goes in model/board/starts.yaml;
# one here with the same id takes its place on this board (ADR 0009).
# `area: core` and `area: edge` are this board's (board.yaml): the cities, and the valleys.
# The start is always the real South East Wales of 2026. A start sets one promise to keep by 2034,
# one free tier 1 project (the player places it at any time) and which councils back you first.
# Backing nudges and the promise year are GAME RULES (tune).
note: "Backing nudges and the promise year are game rules (tune). The 2026 board is never changed."
starts:
  - id: work-valleys
    name: { en: "Work in the valleys", cy: "Gwaith yn y cymoedd", cy_review: true }
    pitch: { en: "You promised work people can reach without leaving home.", cy: "Fe wnaethoch addo gwaith y gall pobl ei gyrraedd heb adael cartref.", cy_review: true }
    promise:
      text: { en: "Work and pay goes up in the valley councils by 2034.", cy: "Gwaith a chyflog yn codi yng nghynghorau'r cymoedd erbyn 2034.", cy_review: true }
      by_year: 2034
      kept_when:
        - { kind: measure, measure: work, area: edge, vs_2026: up }
    free_project: skills-college
    backing:
      - { area: edge, points: 1 }
      - { area: core, points: -0.5 }

  - id: warm-homes
    name: { en: "Warm, safe homes", cy: "Cartrefi cynnes, diogel", cy_review: true }
    pitch: { en: "You promised warm homes that people can afford.", cy: "Fe wnaethoch addo cartrefi cynnes y gall pobl eu fforddio.", cy_review: true }
    promise:
      text: { en: "Homes and community goes up across the region by 2034.", cy: "Cartrefi a chymuned yn codi ar draws y rhanbarth erbyn 2034.", cy_review: true }
      by_year: 2034
      kept_when:
        - { kind: measure, measure: homes, vs_2026: up }
    free_project: warm-terraces
    backing:
      - { area: core, points: 1 }
      - { flag: coal_valley, points: 0.5 }
      - { flag: rural, points: -0.5 }

  - id: ready-weather
    name: { en: "Ready for the weather", cy: "Yn barod am y tywydd", cy_review: true }
    pitch: { en: "You promised to keep homes safe from floods and slipping tips.", cy: "Fe wnaethoch addo cadw cartrefi'n ddiogel rhag llifogydd a thomenni'n llithro.", cy_review: true }
    promise:
      text: { en: "Nature and floods goes up across the region by 2034.", cy: "Natur a llifogydd yn codi ar draws y rhanbarth erbyn 2034.", cy_review: true }
      by_year: 2034
      kept_when:
        - { kind: measure, measure: nature, vs_2026: up }
    free_project: slow-the-water
    backing:
      - { flag: coal_valley, points: 0.5 }
      - { flag: coast, points: 0.5 }
      - { flag: rural, points: 0.5 }
      - { area: core, points: -0.5 }
