# The tree: four branches, three tiers each (docs/design/v2-board.md section 5.3). Owner: package 10.
#
# Tier gates are GAME RULES (tune). Tier 2 (bigger projects) opens when three tier 1 projects of the
# branch are working anywhere on the board (the same one in two councils counts twice). Tier 3, the
# keystone, opens when the branch's one bigger project is working in two councils: the gate names
# it (`project`), so the screen can say "Station quarter working in 2 councils: 1 of 2". This is
# intended (playtest 9 must-fix 1): depth in one bigger project, not a second kind of project. The
# legacy project (projects.yaml `legacy_of`) sits on tier 2 but comes after the keystone, and never
# counts for a gate (conditions.ts). A keystone takes six years, so it must start by 2044
# (game.yaml). Each working keystone opens its legacy project. The build turns each gate into a
# `requires` rule card `need:<branch>:<tier>` and sets `rule` (src/board/NEEDS.md, package 1), so
# `rule` is left out here.
note: "Tier gates are game rules (tune). The build compiles each gate to a requires card."
# The note on each gate's rule card, by tier (fixture.ts gateRules reads it).
gate_notes:
  "2":
    en: "Bigger projects open when three starter projects of this branch are working, anywhere. The same one in two councils counts twice."
    cy: "Mae prosiectau mwy yn agor pan fydd tri phrosiect cychwynnol o'r gangen hon yn gweithio, unrhyw le. Mae'r un prosiect mewn dau gyngor yn cyfrif ddwywaith."
    cy_review: true
  "3":
    en: "The keystone opens when this branch's bigger project is working in two councils. The project that comes after the keystone does not count."
    cy: "Mae'r maen clo yn agor pan fydd prosiect mwy'r gangen hon yn gweithio mewn dau gyngor. Dydy'r prosiect sy'n dod ar ôl y maen clo ddim yn cyfrif."
    cy_review: true
branches:
  - id: valleys
    name: { en: "Joined-up valleys", cy: "Cymoedd cysylltiedig", cy_review: true }
    note: { en: "Rail, towns and reach. Trains carry people both ways, so what waits at the valley end matters.", cy: "Rheilffyrdd, trefi a chyrraedd. Mae trenau'n cario pobl y ddwy ffordd, felly mae pen y cwm yn bwysig.", cy_review: true }
    tiers:
      - { tier: 1, opens: [] }
      - tier: 2
        opens:
          - { kind: project, branch: valleys, tier: 1, where: anywhere, at_least: 3 }
      - tier: 3
        opens:
          - { kind: project, project: station-quarter, branch: valleys, tier: 2, where: anywhere, at_least: 2 }

  - id: made_here
    name: { en: "Made here", cy: "Diwydiant lleol", cy_review: true }
    note: { en: "Skills and firms that stay. Quick wins are on offer, but some of them leave.", cy: "Sgiliau a chwmnïau sy'n aros. Mae enillion cyflym ar gael, ond mae rhai ohonyn nhw'n gadael.", cy_review: true }
    tiers:
      - { tier: 1, opens: [] }
      - tier: 2
        opens:
          - { kind: project, branch: made_here, tier: 1, where: anywhere, at_least: 3 }
      - tier: 3
        opens:
          - { kind: project, project: community-energy, branch: made_here, tier: 2, where: anywhere, at_least: 2 }

  - id: landscape
    name: { en: "Living landscape", cy: "Tirwedd fyw", cy_review: true }
    note: { en: "Tips, water and woods. What you do upstream is felt downstream.", cy: "Tomenni, dŵr a choed. Mae'r hyn a wnewch i fyny'r afon i'w deimlo i lawr yr afon.", cy_review: true }
    tiers:
      - { tier: 1, opens: [] }
      - tier: 2
        opens:
          - { kind: project, branch: landscape, tier: 1, where: anywhere, at_least: 3 }
      - tier: 3
        opens:
          - { kind: project, project: valleys-park, branch: landscape, tier: 2, where: anywhere, at_least: 2 }

  - id: homes
    name: { en: "Good homes, strong communities", cy: "Cartrefi da, cymunedau cryf", cy_review: true }
    note: { en: "Homes, health and Welsh. Slow to show, and the gap between places closes fastest here.", cy: "Cartrefi, iechyd a'r Gymraeg. Araf i'w weld, ac yma mae'r bwlch rhwng llefydd yn cau gyflymaf.", cy_review: true }
    tiers:
      - { tier: 1, opens: [] }
      - tier: 2
        opens:
          - { kind: project, branch: homes, tier: 1, where: anywhere, at_least: 3 }
      - tier: 3
        opens:
          - { kind: project, project: health-hub, branch: homes, tier: 2, where: anywhere, at_least: 2 }
