note: >
  Rule cards for effects that travel along real links (S1 to S4, docs/design/v2-board.md section
  4.3, ADR 0005). One hop only: an effect reaches a direct neighbour on a link and stops. The links
  themselves are real (commuting shares from the 2021 Census, rail lines, river order), and S3's
  floor and ceiling are set against the real 2026 young adult share. How strongly
  an effect travels is a rough guess with no evidence behind its size, so every card is a game rule
  and its params are marked tune. The engine reads them by id (RULE_IDS in
  src/board/engine/types-model.ts) in src/board/engine/spread.ts.
rules:
  - id: S1
    theme: spread
    kind: spread
    name: { en: Jobs travel home, cy: Mae swyddi'n teithio adref, cy_review: true }
    note:
      en: New work in a place also lifts Work and pay in the places its workers come from.
      cy: Mae gwaith newydd mewn lle yn codi Gwaith a chyflog yn llefydd ei weithwyr.
      cy_review: true
    params:
      coef: { default: 1, min: 0.5, max: 2, unit: { en: times the commuting share, cy: gwaith y gyfran sy'n cymudo, cy_review: true }, adjustable: true, tune: true }
      quality_step: { default: 0.5, min: 0, max: 1, unit: { en: extra for each step of rail quality above 1, cy: ychwanegol am bob cam o ansawdd rheilffordd uwchben 1, cy_review: true }, adjustable: true, tune: true }
      strength_share: { default: 0.05, min: 0.01, max: 0.1, unit: { en: commuting share for each strength step where the real share is missing, cy: cyfran sy'n cymudo am bob cam cryfder lle mae'r gyfran go iawn ar goll, cy_review: true }, adjustable: true, tune: true }
    lag_years: 0
    spread:
      links: [commute]
      travel: to_home
      input: work
      output: work
      sign: 1
      weight: share
      quality_multiplies: true
      lag_years: 0
      only_from_projects: true
    sources: [nomis_census_odwp01ew]
    confidence: low
    evidence: placeholder
    game_rule: true
  - id: S2
    theme: spread
    kind: spread
    name: { en: Prices travel up the line, cy: Mae prisiau'n teithio i fyny'r lein, cy_review: true }
    note:
      en: When a place booms, homes get dearer along the lines into it. Homes built there hold prices back.
      cy: Pan mae lle'n ffynnu, mae cartrefi'n mynd yn ddrutach ar hyd y llinellau iddo. Mae cartrefi sydd wedi'u hadeiladu yno yn dal prisiau'n ôl.
      cy_review: true
    params:
      coef: { default: 0.4, min: 0.1, max: 1, unit: { en: times the commuting share, cy: gwaith y gyfran sy'n cymudo, cy_review: true }, adjustable: true, tune: true }
      tag_block: { default: 0.5, min: 0, max: 1, unit: { en: share blocked by each homes project in the place, cy: cyfran sy'n cael ei rhwystro gan bob prosiect cartrefi yn y lle, cy_review: true }, adjustable: true, tune: true }
      strength_share: { default: 0.05, min: 0.01, max: 0.1, unit: { en: commuting share for each strength step where the real share is missing, cy: cyfran sy'n cymudo am bob cam cryfder lle mae'r gyfran go iawn ar goll, cy_review: true }, adjustable: true, tune: true }
    lag_years: 0
    spread:
      links: [commute]
      travel: to_home
      input: work
      output: homes
      sign: -1
      weight: share
      quality_multiplies: true
      lag_years: 0
      blocked_by_tags: [homes]
    sources: [nomis_census_odwp01ew]
    confidence: low
    evidence: placeholder
    game_rule: true
  - id: S3
    theme: spread
    kind: spread
    name: { en: Young people follow work and homes, cy: Mae pobl ifanc yn dilyn gwaith a chartrefi, cy_review: true }
    note:
      en: Young adults move towards places with work and homes they can afford. What one place loses, another gains.
      cy: Mae oedolion ifanc yn symud at lefydd gyda gwaith a chartrefi fforddiadwy. Mae'r hyn y mae un lle yn ei golli, lle arall yn ei ennill.
      cy_review: true
    params:
      max_per_year: { default: 0.3, min: 0.05, max: 0.5, unit: { en: most percentage points that can move on one link in a year, cy: y mwyaf o bwyntiau canran sy'n gallu symud ar un cyswllt mewn blwyddyn, cy_review: true }, adjustable: true, tune: true }
      pull_per_year: { default: 0.06, min: 0, max: 0.25, unit: { en: percentage points a year for each point of gap, cy: pwyntiau canran y flwyddyn am bob pwynt o fwlch, cy_review: true }, adjustable: true, tune: true }
      quality_step: { default: 0.5, min: 0, max: 1, unit: { en: extra for each step of rail quality above 1, cy: ychwanegol am bob cam o ansawdd rheilffordd uwchben 1, cy_review: true }, adjustable: true, tune: true }
      links_per_council: { default: 3, min: 1, max: 6, unit: { en: strongest commuting links from each council that people move along, cy: cysylltiadau cymudo cryfaf o bob cyngor y mae pobl yn symud ar eu hyd, cy_review: true }, adjustable: false }
      floor_share: { default: 0.85, min: 0.3, max: 0.9, unit: { en: times the real 2026 young adult share at least, cy: gwaith cyfran go iawn oedolion ifanc 2026 o leiaf, cy_review: true }, adjustable: true, tune: true }
      ceiling_share: { default: 1.5, min: 1.1, max: 2, unit: { en: times the real 2026 young adult share at most, cy: gwaith cyfran go iawn oedolion ifanc 2026 ar y mwyaf, cy_review: true }, adjustable: true, tune: true }
      work_per_point: { default: 0.15, min: 0, max: 0.5, unit: { en: Work and pay points lost for each percentage point of young adults lost, cy: pwyntiau Gwaith a chyflog a gollir am bob pwynt canran o oedolion ifanc a gollir, cy_review: true }, adjustable: true, tune: true }
      work_gain_per_point: { default: 0.15, min: 0, max: 0.5, unit: { en: Work and pay points gained for each percentage point of young adults gained, cy: pwyntiau Gwaith a chyflog a enillir am bob pwynt canran o oedolion ifanc a enillir, cy_review: true }, adjustable: true, tune: true }
      welsh_per_point: { default: 0.1, min: 0, max: 0.5, unit: { en: Welsh and culture points lost for each percentage point of young adults lost, cy: pwyntiau'r Gymraeg a diwylliant a gollir am bob pwynt canran o oedolion ifanc a gollir, cy_review: true }, adjustable: true, tune: true }
      welsh_gain_per_point: { default: 0.1, min: 0, max: 0.5, unit: { en: Welsh and culture points gained for each percentage point of young adults gained, cy: pwyntiau'r Gymraeg a diwylliant a enillir am bob pwynt canran o oedolion ifanc a enillir, cy_review: true }, adjustable: true, tune: true }
      homes_per_point: { default: 0.05, min: 0, max: 0.5, unit: { en: Homes and community points lost for each percentage point of young adults gained, cy: pwyntiau Cartrefi a chymuned a gollir am bob pwynt canran o oedolion ifanc a enillir, cy_review: true }, adjustable: true, tune: true }
      tag_block: { default: 0.5, min: 0, max: 1, unit: { en: share of that loss blocked by each homes project in the place, cy: cyfran o'r golled honno sy'n cael ei rhwystro gan bob prosiect cartrefi yn y lle, cy_review: true }, adjustable: true, tune: true }
      reverse_pull_points: { default: 2, min: 0, max: 4, unit: { en: points better at the valley end of an upgraded line once work comes up the line, cy: pwyntiau yn well ym mhen y cwm o lein wedi'i huwchraddio unwaith y daw gwaith i fyny'r lein, cy_review: true }, adjustable: true, tune: true }
    lag_years: 0
    spread:
      links: [commute, rail]
      travel: towards_better
      input: work
      output: young_adults
      sign: 1
      weight: one
      quality_multiplies: true
      lag_years: 0
      blocked_by_tags: [homes]
    sources: [nomis_census_odwp01ew, nomis_mye]
    confidence: low
    evidence: placeholder
    game_rule: true
  - id: S4
    theme: spread
    kind: spread
    name: { en: Water runs downhill, cy: Mae dŵr yn rhedeg i lawr y bryn, cy_review: true }
    note:
      en: What is done upstream is felt downstream. Slowing the water cuts flood risk below it a year or two later. Storms pass down the river.
      cy: Mae'r hyn sy'n cael ei wneud i fyny'r afon yn cael ei deimlo i lawr yr afon. Mae arafu'r dŵr yn torri'r perygl o lifogydd islaw flwyddyn neu ddwy yn ddiweddarach. Mae stormydd yn pasio i lawr yr afon.
      cy_review: true
    params:
      steps: { default: 1, min: 0, max: 2, unit: { en: flood risk steps cut downstream, cy: camau perygl llifogydd sy'n cael eu torri i lawr yr afon, cy_review: true }, adjustable: true, tune: true }
      storm_weaken: { default: 0.25, min: 0, max: 0.5, unit: { en: share of a storm cut by each flood project in the way, cy: cyfran o storm sy'n cael ei thorri gan bob prosiect llifogydd yn y ffordd, cy_review: true }, adjustable: true, tune: true }
    lag_years: 2
    spread:
      links: [river]
      travel: downstream
      input: risk_flood
      output: risk_flood
      sign: 1
      weight: one
      quality_multiplies: false
      lag_years: 2
    sources: [os_open_rivers, nrw_catchments]
    confidence: low
    evidence: placeholder
    game_rule: true
