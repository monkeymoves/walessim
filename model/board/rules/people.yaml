note: >
  Rule cards for people, backing, elections, deals and what councils ask for (P1 to P7), and, because the board has no other
  file for them, the two scores (G1), the weight of outside trouble (E1), rebuilding after it (E2) and place visits (V1).
  The engine reads them by id (RULE_IDS in src/board/engine/types-model.ts, and
  src/board/engine/rule-defaults.ts for the extra params). Every size here is a design choice
  with no evidence behind it, so every card is a game rule. Params marked tune are set by the
  balance bots (docs/design/v2-board.md section 13.2).
rules:
  - id: P1
    theme: people
    kind: stock
    name: { en: Moods move slowly, cy: Mae hwyliau'n symud yn araf, cy_review: true }
    note:
      en: Each group compares what it cares about with four years ago, in its own council. People expect things to get better. Each election you win, they expect more. A lost election eases it. Moods remember where they were.
      cy: Mae pob grŵp yn cymharu'r hyn sy'n bwysig iddo yn ei gyngor â phedair blynedd yn ôl. Mae pobl yn disgwyl i bethau wella. Bob tro y byddwch yn ennill etholiad, maen nhw'n disgwyl mwy. Mae colli etholiad yn lleddfu hynny. Mae hwyliau'n cofio lle'r oedden nhw.
      cy_review: true
    params:
      memory_per_year: { default: 0.7746, min: 0.5, max: 0.95, unit: { en: share kept each year, cy: cyfran sy'n aros bob blwyddyn, cy_review: true }, adjustable: true, tune: true }
      compare_years: { default: 4, min: 2, max: 8, unit: { en: years, cy: blynyddoedd, cy_review: true }, adjustable: false }
      pull: { default: 0.8, min: 0.2, max: 2, unit: { en: points of mood per point better or worse, cy: pwyntiau o hwyliau am bob pwynt yn well neu'n waeth, cy_review: true }, adjustable: true, tune: true }
      middle_share: { default: 0, min: 0, max: 0.5, unit: { en: share of the judgement made against the middle council, cy: cyfran o'r farn sy'n cymharu â'r cyngor canol, cy_review: true }, adjustable: false }
      promise_points: { default: 1, min: 0, max: 3, unit: { en: points, cy: pwyntiau, cy_review: true }, adjustable: true, tune: true }
      crisis_points: { default: 0.5, min: 0, max: 2, unit: { en: points for each crisis, cy: pwyntiau am bob argyfwng, cy_review: true }, adjustable: true, tune: true }
      presence_points: { default: 0.5, min: 0, max: 2, unit: { en: points, cy: pwyntiau, cy_review: true }, adjustable: true, tune: true }
      expect_points: { default: 0, min: 0, max: 0.5, unit: { en: points better than four years ago that people expect in your first term, cy: pwyntiau yn well na phedair blynedd yn ôl y mae pobl yn eu disgwyl yn eich tymor cyntaf, cy_review: true }, adjustable: true, tune: true }
      expect_rise: { default: 0.16, min: 0, max: 0.3, unit: { en: points more that people expect for each election you have won, cy: pwyntiau yn fwy y mae pobl yn eu disgwyl am bob etholiad rydych chi wedi'i ennill, cy_review: true }, adjustable: true, tune: true }
      loss_eases: { default: 1, min: 0, max: 2, unit: { en: elections' worth of that expectation a lost election takes back, cy: "faint o etholiadau o'r disgwyl hwnnw y mae colli etholiad yn ei dynnu'n ôl", cy_review: true }, adjustable: true, tune: true }
    sources: []
    confidence: low
    evidence: placeholder
    game_rule: true
  - id: P2
    theme: people
    kind: linear
    name: { en: Backing at the start, cy: Cefnogaeth ar y dechrau, cy_review: true }
    note:
      en: Every council starts at 5 out of 10. What you were elected on nudges some councils up and some down. That fades as moods move.
      cy: Mae pob cyngor yn dechrau ar 5 allan o 10. Mae'r hyn y cawsoch eich ethol arno yn codi rhai cynghorau ac yn gostwng eraill. Mae hynny'n pylu wrth i hwyliau symud.
      cy_review: true
    params:
      start: { default: 5, min: 5, max: 5, unit: { en: points out of 10, cy: pwyntiau allan o 10, cy_review: true }, adjustable: false }
      start_nudge: { default: 1, min: 0, max: 2, unit: { en: times the start's points, cy: gwaith pwyntiau'r dechrau, cy_review: true }, adjustable: true, tune: true }
    sources: []
    confidence: high
    evidence: placeholder
    game_rule: true
  - id: P3
    theme: people
    kind: threshold
    name: { en: Passed over, cy: Wedi'u hanwybyddu, cy_review: true }
    note:
      en: A place with nothing built in or near it for 8 years backs you a little less. The loss stops at 1 point.
      cy: Mae lle heb ddim wedi'i adeiladu gerllaw am 8 mlynedd yn eich cefnogi llai. Mae'r golled yn stopio ar 1 pwynt.
      cy_review: true
    params:
      years: { default: 8, min: 4, max: 12, unit: { en: years, cy: blynyddoedd, cy_review: true }, adjustable: true, tune: true }
      loss_per_year: { default: 0.1, min: 0.05, max: 0.5, unit: { en: points a year, cy: pwyntiau y flwyddyn, cy_review: true }, adjustable: true, tune: true }
      max_loss: { default: 1, min: 0, max: 3, unit: { en: points in all, cy: pwyntiau i gyd, cy_review: true }, adjustable: true, tune: true }
    sources: []
    confidence: low
    evidence: placeholder
    game_rule: true
  - id: P4
    theme: people
    kind: threshold
    name: { en: Elections, cy: Etholiadau, cy_review: true }
    note:
      en: A council backs you at 5 out of 10 or more. You win if they hold more than half the people.
      cy: Mae cyngor yn eich cefnogi ar 5 allan o 10 neu fwy. Rydych chi'n ennill os oes ganddyn nhw fwy na hanner y bobl.
      cy_review: true
    params:
      backs_at: { default: 5, min: 5, max: 5, unit: { en: points out of 10, cy: pwyntiau allan o 10, cy_review: true }, adjustable: false }
      win_share: { default: 0.5, min: 0.5, max: 0.5, unit: { en: share of people, cy: cyfran o'r bobl, cy_review: true }, adjustable: false }
      strong_share: { default: 0.667, min: 0.6, max: 0.75, unit: { en: share of people, cy: cyfran o'r bobl, cy_review: true }, adjustable: true, tune: true }
    sources: []
    confidence: high
    evidence: placeholder
    game_rule: true
  - id: P5
    theme: people
    kind: linear
    name: { en: Everyone, cy: Pawb, cy_review: true }
    note:
      en: Everyone counts for a fixed weight in every council. It is a game rule with no figure behind it.
      cy: Mae Pawb yn cyfrif am bwysau sefydlog ym mhob cyngor. Rheol gêm yw hi heb ffigur y tu ôl iddi.
      cy_review: true
    params:
      base_weight: { default: 0.3, min: 0.1, max: 0.5, unit: { en: weight beside the real shares, cy: pwysau wrth ymyl y cyfrannau go iawn, cy_review: true }, adjustable: true, tune: true }
    sources: []
    confidence: low
    evidence: placeholder
    game_rule: true
  - id: P6
    theme: people
    kind: threshold
    name: { en: Governing with others, cy: Llywodraethu gydag eraill, cy_review: true }
    note:
      en: After a lost election you make a deal with a council that backs you least. Keep it and that place warms to you. Break it and that council backs you less, and the anger fades over four years.
      cy: Ar ôl colli etholiad rydych chi'n taro bargen â chyngor sy'n eich cefnogi leiaf. Cadwch hi ac mae'r lle hwnnw'n closio atoch chi. Torrwch hi ac mae'r cyngor hwnnw'n eich cefnogi llai, ac mae'r dicter yn pylu dros bedair blynedd.
      cy_review: true
    params:
      choices: { default: 2, min: 1, max: 3, unit: { en: deals on offer, cy: bargeinion ar gael, cy_review: true }, adjustable: false }
      deal_years: { default: 4, min: 2, max: 6, unit: { en: years to keep it, cy: blynyddoedd i'w chadw, cy_review: true }, adjustable: true, tune: true }
      deal_discount: { default: 1, min: 0, max: 2, unit: { en: coins off the project that keeps it, cy: darnau arian oddi ar y prosiect sy'n ei chadw, cy_review: true }, adjustable: true, tune: true }
      kept_here: { default: 1.5, min: 0, max: 3, unit: { en: points of backing in that council, cy: pwyntiau o gefnogaeth yn y cyngor hwnnw, cy_review: true }, adjustable: true, tune: true }
      kept_near: { default: 0.5, min: 0, max: 1.5, unit: { en: points of backing one link away, cy: pwyntiau o gefnogaeth un cysylltiad i ffwrdd, cy_review: true }, adjustable: true, tune: true }
      broken_here: { default: 1.5, min: 0, max: 3, unit: { en: points of backing lost in that council when a deal is broken, cy: pwyntiau o gefnogaeth a gollir yn y cyngor hwnnw pan fydd bargen yn cael ei thorri, cy_review: true }, adjustable: true, tune: true }
      broken_years: { default: 4, min: 1, max: 8, unit: { en: years for that loss to fade evenly to nothing, cy: blynyddoedd i'r golled honno bylu'n gyfartal i ddim, cy_review: true }, adjustable: true, tune: true }
    sources: []
    confidence: low
    evidence: placeholder
    game_rule: true
  - id: P7
    theme: people
    kind: threshold
    name: { en: Asked and answered, cy: Gofyn a chael ateb, cy_review: true }
    note:
      en: Each council asks for its two weakest measures. Where a council does not back you, start a project that lifts one. Backing there rises once it works. The thanks fade over four years.
      cy: Mae pob cyngor eisiau gweld ei ddau fesur gwannaf yn gwella. Lle nad yw cyngor yn eich cefnogi, dechreuwch brosiect sy'n codi un ohonyn nhw. Mae'r gefnogaeth yno'n codi unwaith y bydd yn gweithio. Mae'r diolch yn pylu dros bedair blynedd.
      cy_review: true
    params:
      points: { default: 0.6, min: 0, max: 1.5, unit: { en: points of backing in that council once the project works, cy: pwyntiau o gefnogaeth yn y cyngor hwnnw unwaith mae'r prosiect yn gweithio, cy_review: true }, adjustable: true, tune: true }
      years: { default: 4, min: 1, max: 8, unit: { en: years for the thanks to fade evenly to nothing, cy: blynyddoedd i'r diolch bylu'n gyfartal i ddim, cy_review: true }, adjustable: true, tune: true }
      only_below: { default: 1, min: 0, max: 1, unit: { en: "1 when only a council that does not back you answers. 0 when every council does.", cy: "1 pan mai dim ond cyngor nad yw'n eich cefnogi sy'n ymateb. 0 pan fydd pob cyngor yn ymateb.", cy_review: true }, adjustable: false }
      asked_count: { default: 2, min: 1, max: 3, unit: { en: weakest measures a council asks for, cy: mesurau gwannaf y mae cyngor eisiau eu gweld yn gwella, cy_review: true }, adjustable: false }
    sources: []
    confidence: low
    evidence: placeholder
    game_rule: true
  - id: E2
    theme: events
    kind: threshold
    name: { en: Rebuild better, cy: Ailadeiladu'n well, cy_review: true }
    note:
      en: After hard trouble lands on a place, new builds there take half the time for two years.
      cy: Ar ôl i drafferth galed daro lle, mae adeiladau newydd yno'n cymryd hanner yr amser am ddwy flynedd.
      cy_review: true
    params:
      severity_at_least: { default: 2, min: 1, max: 3, unit: { en: severity points, cy: pwyntiau difrifoldeb, cy_review: true }, adjustable: true, tune: true }
      years: { default: 2, min: 1, max: 4, unit: { en: years, cy: blynyddoedd, cy_review: true }, adjustable: true, tune: true }
      time_share: { default: 0.5, min: 0.25, max: 1, unit: { en: share of the build time, cy: cyfran o'r amser adeiladu, cy_review: true }, adjustable: true, tune: true }
    sources: []
    confidence: low
    evidence: placeholder
    game_rule: true
  - id: G1
    theme: score
    kind: linear
    name: { en: The two scores, cy: Y ddwy sgôr, cy_review: true }
    note:
      en: Both scores weigh councils by their people. Two fifths of each comes from the three lowest councils alone. Your result is the Wales you leave in 2050.
      cy: Mae'r ddwy sgôr yn pwyso cynghorau yn ôl eu pobl. Daw dwy ran o bump o bob un o'r tri chyngor isaf yn unig. Eich canlyniad yw'r Gymru rydych chi'n ei gadael yn 2050.
      cy_review: true
    params:
      fairness_share: { default: 0.4, min: 0.1, max: 0.5, unit: { en: share of each score, cy: cyfran o bob sgôr, cy_review: true }, adjustable: true, tune: true }
      lowest_count: { default: 3, min: 1, max: 3, unit: { en: councils, cy: cynghorau, cy_review: true }, adjustable: false }
      future_years: { default: 8, min: 0, max: 8, unit: { en: years after 2050, cy: blynyddoedd ar ôl 2050, cy_review: true }, adjustable: false }
      band_little: { default: 1.5, min: 1, max: 4, unit: { en: points out of 100, cy: pwyntiau allan o 100, cy_review: true }, adjustable: true, tune: true }
      band_some: { default: 5, min: 3, max: 8, unit: { en: "points out of 100 for plainly better or worse, between a little and much", cy: "pwyntiau allan o 100 am well neu waeth yn amlwg, rhwng ychydig a llawer", cy_review: true }, adjustable: true, tune: true }
      band_much: { default: 10, min: 4, max: 12, unit: { en: points out of 100, cy: pwyntiau allan o 100, cy_review: true }, adjustable: true, tune: true }
      risk_left_points: { default: 0.3, min: 0, max: 1, unit: { en: points out of 10 for each risk left high, cy: pwyntiau allan o 10 am bob perygl sy'n uchel, cy_review: true }, adjustable: true, tune: true }
    sources: []
    confidence: medium
    evidence: placeholder
    game_rule: true
  - id: E1
    theme: events
    kind: threshold
    name: { en: The same weight of trouble, cy: Yr un pwysau o drafferth, cy_review: true }
    note:
      en: Every game brings the same amount of trouble from outside. Only the kind and the timing differ.
      cy: Mae pob gêm yn dod â'r un faint o drafferth o'r tu allan. Dim ond y math a'r amseru sy'n wahanol.
      cy_review: true
    params:
      min: { default: 9, min: 9, max: 9, unit: { en: severity points, cy: pwyntiau difrifoldeb, cy_review: true }, adjustable: false }
      max: { default: 11, min: 11, max: 11, unit: { en: severity points, cy: pwyntiau difrifoldeb, cy_review: true }, adjustable: false }
      first_year: { default: 2030, min: 2026, max: 2032, unit: { en: year, cy: blwyddyn, cy_review: true }, adjustable: false }
      warn_years: { default: 1.5, min: 1, max: 3, unit: { en: years of warning before outside trouble lands, cy: blynyddoedd o rybudd cyn i drafferth o'r tu allan gyrraedd, cy_review: true }, adjustable: true, tune: true }
      grown_warn_years: { default: 1, min: 1, max: 3, unit: { en: years of warning before trouble the board grows lands, cy: blynyddoedd o rybudd cyn i drafferth y bwrdd gyrraedd, cy_review: true }, adjustable: true, tune: true }
      grown_at_once: { default: 1, min: 0, max: 2, unit: { en: events at once, cy: digwyddiadau ar unwaith, cy_review: true }, adjustable: true, tune: true }
      grown_gap_years: { default: 2, min: 1, max: 4, unit: { en: years between them at least, cy: blynyddoedd rhyngddynt o leiaf, cy_review: true }, adjustable: true, tune: true }
      grown_first_years: { default: 2, min: 0, max: 4, unit: { en: "years at most before the board's first trouble, drawn from the game number", cy: "blynyddoedd ar y mwyaf cyn trafferth gyntaf y bwrdd, wedi'u tynnu o rif y gêm", cy_review: true }, adjustable: true, tune: true }
      grown_jitter_years: { default: 0, min: 0, max: 2, unit: { en: "years more at most between them, drawn from the game number", cy: "blynyddoedd yn fwy ar y mwyaf rhyngddynt, wedi'u tynnu o rif y gêm", cy_review: true }, adjustable: true, tune: true }
      repeat_max: { default: 2, min: 1, max: 4, unit: { en: times one event can come in a game, cy: gwaith y gall un digwyddiad ddod mewn gêm, cy_review: true }, adjustable: true, tune: true }
      repeat_gap_years: { default: 8, min: 2, max: 12, unit: { en: years before the same event can come again, cy: blynyddoedd cyn y gall yr un digwyddiad ddod eto, cy_review: true }, adjustable: true, tune: true }
      prepared_cut: { default: 0.5, min: 0.25, max: 0.5, unit: { en: share left for each project ready for it, cy: cyfran sy'n weddill am bob prosiect sy'n barod amdano, cy_review: true }, adjustable: true, tune: true }
      downturn_cut: { default: 0.5, min: 0.25, max: 0.75, unit: { en: share of a downturn left where a college stands once a cluster has roots, cy: cyfran o ddirwasgiad sy'n weddill lle mae coleg unwaith mae gan glwstwr wreiddiau, cy_review: true }, adjustable: true, tune: true }
      storm_step: { default: 0.5, min: 0.25, max: 0.75, unit: { en: share of a storm left when rivers have room, cy: cyfran o storm sy'n weddill pan fo lle i afonydd, cy_review: true }, adjustable: true, tune: true }
    sources: []
    confidence: high
    evidence: placeholder
    game_rule: true
  - id: V1
    theme: projects
    kind: threshold
    name: { en: Place visits, cy: Ymweld â lle, cy_review: true }
    note:
      en: How well a visit goes makes its project stronger or weaker there. It also moves backing in that council.
      cy: Mae pa mor dda mae ymweliad yn mynd yn gwneud ei brosiect yn gryfach neu'n wannach yno. Mae hefyd yn symud cefnogaeth yn y cyngor hwnnw.
      cy_review: true
    params:
      factor_poorly: { default: 0.5, min: 0.25, max: 1, unit: { en: times the project, cy: gwaith y prosiect, cy_review: true }, adjustable: true, tune: true }
      factor_adequately: { default: 1, min: 1, max: 1, unit: { en: times the project, cy: gwaith y prosiect, cy_review: true }, adjustable: false }
      factor_well: { default: 1.25, min: 1, max: 1.5, unit: { en: times the project, cy: gwaith y prosiect, cy_review: true }, adjustable: true, tune: true }
      factor_very_well: { default: 1.5, min: 1, max: 2, unit: { en: times the project, cy: gwaith y prosiect, cy_review: true }, adjustable: true, tune: true }
      backing_poorly: { default: -0.5, min: -1, max: 0, unit: { en: points of backing, cy: pwyntiau o gefnogaeth, cy_review: true }, adjustable: true, tune: true }
      backing_adequately: { default: 0, min: 0, max: 0, unit: { en: points of backing, cy: pwyntiau o gefnogaeth, cy_review: true }, adjustable: false }
      backing_well: { default: 0.3, min: 0, max: 1, unit: { en: points of backing, cy: pwyntiau o gefnogaeth, cy_review: true }, adjustable: true, tune: true }
      backing_very_well: { default: 0.5, min: 0, max: 1, unit: { en: points of backing, cy: pwyntiau o gefnogaeth, cy_review: true }, adjustable: true, tune: true }
      wet_track: { default: 0.5, min: 0.3, max: 0.8, unit: { en: weather pressure, cy: pwysau tywydd, cy_review: true }, adjustable: true, tune: true }
    sources: []
    confidence: low
    evidence: placeholder
    game_rule: true
