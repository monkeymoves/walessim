note: >
  Rule cards for growth (R1 to R4, docs/design/v2-board.md sections 16.3.2, 16.3.3 and 16.4).
  Roots, tipping points, fresh starts and need are game estimates: no figure stands behind any
  size here, so every card is a game rule and every param is a starting value for the balance
  bots (tune). R4 reads the real 2026 score of each measure, and says so. Rates are per year and
  are applied a step's share at a time. The engine reads these cards by id (RULE_IDS in
  src/board/engine/types-model.ts) in src/board/engine/roots.ts and momentum.ts. A model without a
  card behaves as before it.
rules:
  - id: R1
    theme: growth
    kind: stock
    name: { en: Roots, cy: Gwreiddiau, cy_review: true }
    note:
      en: A project is worth more every year it stands, and much more when it has company. A quick project helps at once, but its roots stay shallow.
      cy: Mae prosiect yn werth mwy bob blwyddyn y mae'n sefyll, a llawer mwy pan fydd ganddo gwmni. Mae prosiect cyflym yn helpu ar unwaith, ond mae ei wreiddiau'n aros yn fas.
      cy_review: true
    params:
      grow_alone_per_year: { default: 0.01, min: 0, max: 0.1, unit: { en: share more each year for a project on its own, cy: cyfran yn fwy bob blwyddyn i brosiect ar ei ben ei hun, cy_review: true }, adjustable: true, tune: true }
      grow_joined_per_year: { default: 0.08, min: 0, max: 0.2, unit: { en: share more each year for a project with company, cy: cyfran yn fwy bob blwyddyn i brosiect gyda chwmni, cy_review: true }, adjustable: true, tune: true }
      max_factor: { default: 7, min: 1, max: 8, unit: { en: times its starting size at most, cy: gwaith ei faint cychwynnol ar y mwyaf, cy_review: true }, adjustable: true, tune: true }
      quick_max_factor: { default: 1.5, min: 1, max: 8, unit: { en: times its starting size at most for a quick project, cy: gwaith ei faint cychwynnol ar y mwyaf i brosiect cyflym, cy_review: true }, adjustable: true, tune: true }
    sources: []
    confidence: low
    evidence: placeholder
    game_rule: true
  - id: R2
    theme: growth
    kind: threshold
    name: { en: On the rise or slipping, cy: Ar i fyny neu'n llithro, cy_review: true }
    note:
      en: A place that has got better for four years pulls people and work in. A place that has got worse loses them.
      cy: Mae lle sydd wedi gwella am bedair blynedd yn denu pobl a gwaith. Mae lle sydd wedi gwaethygu yn eu colli.
      cy_review: true
    params:
      over_years: { default: 4, min: 2, max: 8, unit: { en: years compared, cy: blynyddoedd yn cael eu cymharu, cy_review: true }, adjustable: false }
      rise_at: { default: 0.6, min: 0.1, max: 1, unit: { en: points better on the mean of the six measures, cy: pwyntiau yn well ar gyfartaledd y chwe mesur, cy_review: true }, adjustable: true, tune: true }
      slip_at: { default: -0.6, min: -1, max: -0.1, unit: { en: points worse on the mean of the six measures, cy: pwyntiau yn waeth ar gyfartaledd y chwe mesur, cy_review: true }, adjustable: true, tune: true }
      settle_band: { default: 0.1, min: 0, max: 0.3, unit: { en: points either side that count as steady again, cy: pwyntiau bob ochr sy'n cyfrif yn gyson eto, cy_review: true }, adjustable: true, tune: true }
      pull_points: { default: 1, min: 0, max: 3, unit: { en: points better or worse when young adults choose where to go, cy: pwyntiau yn well neu'n waeth pan fydd oedolion ifanc yn dewis ble i fynd, cy_review: true }, adjustable: true, tune: true }
      roots_bonus: { default: 0.02, min: 0, max: 0.05, unit: { en: share faster or slower that roots grow each year, cy: cyfran yn gyflymach neu'n arafach y mae gwreiddiau'n tyfu bob blwyddyn, cy_review: true }, adjustable: true, tune: true }
      backing_per_year: { default: 0.15, min: 0, max: 0.5, unit: { en: points of backing a year, cy: pwyntiau o gefnogaeth y flwyddyn, cy_review: true }, adjustable: true, tune: true }
      coins_per_year: { default: 0.5, min: 0, max: 1, unit: { en: coins a year from each council on the rise, cy: darnau arian y flwyddyn o bob cyngor sydd ar i fyny, cy_review: true }, adjustable: true, tune: true }
      region_turn_councils: { default: 5, min: 3, max: 8, unit: { en: councils on the rise at once, cy: cynghorau ar i fyny ar yr un pryd, cy_review: true }, adjustable: true, tune: true }
      region_turn_coins_per_year: { default: 1, min: 0, max: 2, unit: { en: more coins a year once the region turns, cy: mwy o ddarnau arian y flwyddyn ar ôl i'r rhanbarth droi, cy_review: true }, adjustable: true, tune: true }
    sources: []
    confidence: low
    evidence: placeholder
    game_rule: true
  - id: R3
    theme: growth
    kind: threshold
    name: { en: A fresh start, cy: Dechrau newydd, cy_review: true }
    note:
      en: People rally round the first new thing. It costs less, but not a keystone. It counts as having company for eight years.
      cy: Mae pobl yn cefnogi'r peth newydd cyntaf. Mae'n costio llai, ond nid maen clo. Mae'n cyfrif fel bod ganddo gwmni am wyth mlynedd.
      cy_review: true
    params:
      discount: { default: 2, min: 0, max: 3, unit: { en: coins off the first project, cy: darnau arian oddi ar y prosiect cyntaf, cy_review: true }, adjustable: true, tune: true }
      min_cost: { default: 1, min: 0, max: 2, unit: { en: coins it costs at least, cy: darnau arian y mae'n eu costio o leiaf, cy_review: true }, adjustable: false }
      joined_years: { default: 8, min: 0, max: 12, unit: { en: years it counts as having company, cy: blynyddoedd y mae'n cyfrif fel bod ganddo gwmni, cy_review: true }, adjustable: true, tune: true }
      lowest_count: { default: 3, min: 1, max: 5, unit: { en: lowest councils that also get a fresh start, cy: cynghorau isaf sydd hefyd yn cael dechrau newydd, cy_review: true }, adjustable: true, tune: true }
      max_tier: { default: 2, min: 1, max: 3, unit: { en: "highest tier it takes coins off (2: never a keystone)", cy: "yr haen uchaf y mae'n tynnu darnau arian oddi arni (2: byth maen clo)", cy_review: true }, adjustable: false }
    sources: []
    confidence: low
    evidence: placeholder
    game_rule: true
  - id: R4
    theme: growth
    kind: linear
    name: { en: Need, cy: Angen, cy_review: true }
    note:
      en: A project does most where the real 2026 figure is worst. It does less where things are already good.
      cy: Mae prosiect yn gwneud fwyaf lle mae ffigur go iawn 2026 waethaf. Mae'n gwneud llai lle mae pethau eisoes yn dda.
      cy_review: true
    params:
      base: { default: 1.6, min: 1, max: 1.6, unit: { en: times the lift where the 2026 score is 0, cy: gwaith y codiad lle mae sgôr 2026 yn 0, cy_review: true }, adjustable: true, tune: true }
      per_point: { default: 0.15, min: 0, max: 0.15, unit: { en: less for each point of the real 2026 score, cy: llai am bob pwynt o sgôr go iawn 2026, cy_review: true }, adjustable: true, tune: true }
      min_factor: { default: 0.25, min: 0.25, max: 1, unit: { en: times the lift at least, cy: gwaith y codiad o leiaf, cy_review: true }, adjustable: true, tune: true }
      max_factor: { default: 1.5, min: 1, max: 1.5, unit: { en: times the lift at most, cy: gwaith y codiad ar y mwyaf, cy_review: true }, adjustable: true, tune: true }
    sources: []
    confidence: low
    evidence: placeholder
    game_rule: true
