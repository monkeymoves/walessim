note: >
  Rule cards for coins (B1 and B2, docs/design/v2-board.md sections 5.1 and 16.2.4). Coins are a game
  rule, not money: no pound figure stands behind any of these numbers. Rates are per year and are
  paid a step's share at a time. Params marked tune are set by the balance bots (section 13.2).
  The engine reads them by id (RULE_IDS in src/board/engine/types-model.ts) in
  src/board/engine/budget.ts. The purse (B1 purse_max, section 16.2.4) replaces phase 1's carry
  over: coins above it are not paid. Councils on the rise pay coins too (rule R2 in growth.yaml).
  Phase 1's weak hand (B3) is gone: a lost election is a deal now (rule P6 in people.yaml, section 16.4).
rules:
  - id: B1
    theme: budget
    kind: linear
    name: { en: Coins each year, cy: Darnau arian bob blwyddyn, cy_review: true }
    note:
      en: Coins come in all through the year, and more as Work and pay grows. Your purse holds 24 coins at most.
      cy: Mae darnau arian yn dod i mewn drwy'r flwyddyn, a mwy wrth i Waith a chyflog dyfu. Mae eich pwrs yn dal 24 darn arian ar y mwyaf.
      cy_review: true
    params:
      base_per_year: { default: 4, min: 2, max: 4, unit: { en: coins a year, cy: darnau arian y flwyddyn, cy_review: true }, adjustable: true, tune: true }
      growth_per_year: { default: 0.35, min: 0.25, max: 1, unit: { en: more coins a year for each step of Work and pay gained, cy: mwy o ddarnau arian y flwyddyn am bob cam o Waith a chyflog a enillwyd, cy_review: true }, adjustable: true, tune: true }
      per_work_points: { default: 4, min: 2, max: 8, unit: { en: points of Work and pay gained for each step of growth, cy: pwyntiau Gwaith a chyflog a enillwyd am bob cam o dwf, cy_review: true }, adjustable: true, tune: true }
      purse_max: { default: 24, min: 8, max: 24, unit: { en: coins you can hold at most, cy: darnau arian y gallwch eu dal ar y mwyaf, cy_review: true }, adjustable: true, tune: true }
      running_share: { default: 0.5, min: 0.25, max: 0.75, unit: { en: share of running costs paid once homes pay their own bills, cy: cyfran o gostau rhedeg a delir unwaith mae cartrefi'n talu eu biliau eu hunain, cy_review: true }, adjustable: true, tune: true }
      opening: { default: 8, min: 4, max: 8, unit: { en: coins in May 2026, cy: darnau arian ym mis Mai 2026, cy_review: true }, adjustable: true, tune: true }
    sources: []
    confidence: high
    evidence: placeholder
    game_rule: true
  - id: B2
    theme: budget
    kind: stock
    name: { en: The care bill, cy: Y bil gofal, cy_review: true }
    note:
      en: From 2038 care costs half a coin a year, unless health hubs stand in enough places.
      cy: O 2038 mae gofal yn costio hanner darn arian y flwyddyn. Nid felly os oes canolfannau iechyd mewn digon o lefydd.
      cy_review: true
    params:
      care_bill_per_year: { default: 0.5, min: 0, max: 1, unit: { en: coins a year, cy: darnau arian y flwyddyn, cy_review: true }, adjustable: true, tune: true }
      from_year: { default: 2038, min: 2034, max: 2042, unit: { en: year, cy: blwyddyn, cy_review: true }, adjustable: false }
      hubs_needed: { default: 4, min: 1, max: 6, unit: { en: councils with a health hub, cy: cynghorau gyda chanolfan iechyd, cy_review: true }, adjustable: true, tune: true }
    sources: []
    confidence: high
    evidence: placeholder
    game_rule: true
