# The twelve named endings (docs/design/v2-board.md sections 5.4, 8 and 16.5.3). Owner: package 10.
#
# The first ending by `priority` (lowest first) whose `when` conditions all hold is the player's.
# An ending is a name worth having, win or lose: not a grade. Every keystone ending needs only its
# keystone, so a game with a keystone never falls through to The drift or The patchwork.
# The joined-up valleys also needs young adults held in the valleys; without that, upgraded lines
# fall through to The city and its bedrooms, which is the honest story.
# Four endings tell a hard game (16.5.3): The comeback, The long game, Holding the line and The
# gamble. The drift is kept for a game with fewer than six projects. The patchwork is the
# fallback: many small things and no keystone, better or worse.
# Each ending has three evidence lines read from the board, and a `not_built` line used when it is
# the nearest Wales the player did not build. Conditions and priorities are GAME RULES (tune with
# the bots: "Many endings are real" and "No ending swallows the rest" in section 16.6).
# Evidence slots: {council}, {town}, {year}, {project}, {river}.
# Truth rules (src/board/engine/endings.ts, checked on many bot games by endings-truth.test.ts):
# - A summary claims only what the ending's own conditions make true, so no evidence line can
#   contradict it. Evidence lines claim only what the board shows ("higher than in 2026", never
#   "the strongest it has been" or "more than on any other route").
# - project_standing names a project that is working, in its own council, with the year it
#   opened (the ending's own project first). Its down line is for a board where nothing you built
#   is working in those councils, so it names only {council} or {town}.
# - no_event_since names a river and the council on it, never a town the river may not reach.
#   {year} is the year of the last flood there, or the first year when it never flooded.
note: "Ending conditions are game rules (tune). Evidence lines are filled from the board at the end."
endings:
  - id: two-countries
    priority: 1
    name: { en: "Two countries", cy: "Dwy wlad", cy_review: true }
    summary: { en: "Something big was built, but the places furthest behind fell further back.", cy: "Cafodd rhywbeth mawr ei adeiladu, ond llithrodd y llefydd pellaf ar ôl yn ôl ymhellach.", cy_review: true }
    route: { en: "Any route that builds big but passes over the places furthest behind.", cy: "Unrhyw lwybr sy'n adeiladu'n fawr ond yn anwybyddu'r llefydd pellaf ar ôl.", cy_review: true }
    when:
      - { kind: keystones, at_least: 1 }
      - { kind: lowest_three, vs_2026: lower }
    evidence:
      - kind: gap_change
        up: { en: "The gap between places closed a little, but not for everyone.", cy: "Caeodd y bwlch rhwng llefydd ychydig, ond nid i bawb.", cy_review: true }
        down: { en: "The gap between the best and worst off places is wider than in 2026.", cy: "Mae'r bwlch rhwng y llefydd gorau a gwaethaf eu byd yn lletach nag yn 2026.", cy_review: true }
      - kind: measure_change
        measure: work
        flag: valley
        up: { en: "Work and pay in {council} rose a little.", cy: "Cododd Gwaith a chyflog yn {council} ychydig.", cy_review: true }
        down: { en: "Work and pay in {council} is lower than in 2026.", cy: "Mae Gwaith a chyflog yn {council} yn is nag yn 2026.", cy_review: true }
      - kind: project_standing
        up: { en: "{project} stands in {council}, built in {year}.", cy: "Mae {project} yn sefyll yn {council}, wedi'i adeiladu yn {year}.", cy_review: true }
        down: { en: "Nothing you built reached {town}.", cy: "Ni chyrhaeddodd dim byd a adeiladoch chi mor bell â {town}.", cy_review: true }
    not_built: { en: "Leave the places furthest behind out, and you might have had: Two countries.", cy: "Pe baech wedi gadael y llefydd pellaf ar ôl allan, Dwy wlad fyddai hon.", cy_review: true }

  - id: joined-up-valleys
    priority: 4
    name: { en: "The joined-up valleys", cy: "Y cymoedd cysylltiedig", cy_review: true }
    summary: { en: "Work came up the line. The valley towns are busy, and young people stayed.", cy: "Daeth gwaith i fyny'r lein. Mae trefi'r cymoedd yn brysur, ac arhosodd pobl ifanc.", cy_review: true }
    route: { en: "Joined-up valleys, with Good homes or with Made here.", cy: "Cymoedd cysylltiedig, gyda Chartrefi da neu gyda Wedi'i wneud yma.", cy_review: true }
    when:
      - { kind: keystone, project: work-up-the-line }
      - { kind: young_adults, flag: valley, vs_2026: held }
    evidence:
      - kind: young_adults_change
        flag: valley
        up: { en: "{council} has more young adults than in 2026.", cy: "Mae gan {council} fwy o oedolion ifanc nag yn 2026.", cy_review: true }
        down: { en: "{council} still lost some young adults.", cy: "Collodd {council} rai oedolion ifanc o hyd.", cy_review: true }
      - kind: project_standing
        up: { en: "Offices opened in {town} in {year}. The morning trains now fill both ways.", cy: "Agorodd swyddfeydd yn {town} yn {year}. Mae trenau'r bore'n llenwi'r ddwy ffordd nawr.", cy_review: true }
        down: { en: "Nothing you built is working in {council}.", cy: "Does dim byd a adeiladwyd gennych yn gweithio yn {council}.", cy_review: true }
      - kind: gap_change
        up: { en: "The gap between the valleys and the cities has closed a little.", cy: "Mae'r bwlch rhwng y cymoedd a'r dinasoedd wedi cau ychydig.", cy_review: true }
        down: { en: "The gap between places is still wider than in 2026.", cy: "Mae'r bwlch rhwng llefydd yn dal yn lletach nag yn 2026.", cy_review: true }
    not_built: { en: "With homes and work at the valley end of your lines, you might have had: The joined-up valleys.", cy: "Gyda chartrefi a gwaith ym mhen y cwm, Y cymoedd cysylltiedig fyddai hon.", cy_review: true }

  - id: warm-country
    priority: 5
    name: { en: "The warm country", cy: "Y wlad gynnes", cy_review: true }
    summary: { en: "Cold homes were made warm, street by street, and the bills came down.", cy: "Cafodd cartrefi oer eu gwneud yn gynnes, stryd wrth stryd, a daeth y biliau i lawr.", cy_review: true }
    route: { en: "Good homes, strong communities taken all the way, with a little Living landscape.", cy: "Cartrefi da, cymunedau cryf yr holl ffordd, gydag ychydig o Dirwedd fyw.", cy_review: true }
    when:
      - { kind: keystone, project: heat-and-homes }
    evidence:
      - kind: measure_change
        measure: health
        up: { en: "People in {council} are healthier than in 2026. Fewer fall ill in winter.", cy: "Mae pobl yn {council} yn iachach nag yn 2026. Mae llai'n mynd yn sâl yn y gaeaf.", cy_review: true }
        down: { en: "Health in {council} has not caught up yet.", cy: "Dydy iechyd yn {council} ddim wedi dal i fyny eto.", cy_review: true }
      - kind: gap_change
        up: { en: "The gap between places has closed since 2026.", cy: "Mae'r bwlch rhwng llefydd wedi cau ers 2026.", cy_review: true }
        down: { en: "Homes are warmer, but the gap between places is wider than in 2026.", cy: "Mae cartrefi'n gynhesach, ond mae'r bwlch rhwng llefydd yn lletach nag yn 2026.", cy_review: true }
      - kind: measure_change
        measure: climate
        up: { en: "Homes in {council} burn far less gas than in 2026.", cy: "Mae cartrefi yn {council} yn llosgi llawer llai o nwy nag yn 2026.", cy_review: true }
        down: { en: "Climate in {council} is lower than in 2026.", cy: "Mae Hinsawdd yn {council} yn is nag yn 2026.", cy_review: true }
    not_built: { en: "With warm homes taken all the way, you might have had: The warm country.", cy: "Gyda chartrefi cynnes yr holl ffordd, Y wlad gynnes fyddai hon.", cy_review: true }

  - id: green-valleys
    priority: 6
    name: { en: "The green valleys", cy: "Y cymoedd gwyrdd", cy_review: true }
    summary: { en: "The rivers got room. Floods do less harm, and the hills are greener.", cy: "Cafodd yr afonydd le. Mae llifogydd yn gwneud llai o ddrwg, ac mae'r bryniau'n wyrddach.", cy_review: true }
    route: { en: "Living landscape, with Good homes, strong communities.", cy: "Tirwedd fyw, gyda Chartrefi da, cymunedau cryf.", cy_review: true }
    when:
      - { kind: keystone, project: rivers-room }
    evidence:
      - kind: no_event_since
        up: { en: "The {river} has not flooded homes in {council} since {year}.", cy: "Dydy afon {river} ddim wedi gorlifo cartrefi yn {council} ers {year}.", cy_review: true }
        down: { en: "The {river} still flooded homes in {council} in {year}, but the water went down faster.", cy: "Gorlifodd afon {river} gartrefi yn {council} o hyd yn {year}, ond aeth y dŵr i lawr yn gynt.", cy_review: true }
      - kind: measure_change
        measure: health
        up: { en: "People in {council} are healthier than in 2026.", cy: "Mae pobl yn {council} yn iachach nag yn 2026.", cy_review: true }
        down: { en: "Health in {council} has slipped since 2026.", cy: "Mae iechyd yn {council} wedi llithro ers 2026.", cy_review: true }
      - kind: measure_change
        measure: work
        up: { en: "Work and pay in {council} is higher than in 2026.", cy: "Mae Gwaith a chyflog yn {council} yn uwch nag yn 2026.", cy_review: true }
        down: { en: "Work and pay in {council} is lower than in 2026.", cy: "Mae Gwaith a chyflog yn {council} yn is nag yn 2026.", cy_review: true }
    not_built: { en: "With room for the rivers, you might have had: The green valleys.", cy: "Gyda lle i'r afonydd, Y cymoedd gwyrdd fyddai hon.", cy_review: true }

  - id: workshop
    priority: 7
    name: { en: "The workshop", cy: "Y gweithdy", cy_review: true }
    summary: { en: "A cluster of firms took root, and it trains its own people.", cy: "Gwreiddiodd clwstwr o gwmnïau, ac mae'n hyfforddi ei bobl ei hun.", cy_review: true }
    route: { en: "Made here, with Joined-up valleys.", cy: "Wedi'i wneud yma, gyda Chymoedd cysylltiedig.", cy_review: true }
    when:
      - { kind: keystone, project: cluster-roots }
    evidence:
      - kind: measure_change
        measure: work
        up: { en: "Work and pay in {council} is higher than in 2026.", cy: "Mae Gwaith a chyflog yn {council} yn uwch nag yn 2026.", cy_review: true }
        down: { en: "Even with the cluster, Work and pay in {council} slipped.", cy: "Hyd yn oed gyda'r clwstwr, llithrodd Gwaith a chyflog yn {council}.", cy_review: true }
      - kind: project_standing
        up: { en: "{project} has stood in {town} since {year}. It did not leave in the hard years.", cy: "Mae {project} wedi sefyll yn {town} ers {year}. Wnaeth e ddim gadael yn y blynyddoedd caled.", cy_review: true }
        down: { en: "Nothing you built is working in {council}.", cy: "Does dim byd a adeiladwyd gennych yn gweithio yn {council}.", cy_review: true }
      - kind: measure_change
        measure: nature
        up: { en: "Nature in {council} held up beside the factories.", cy: "Daliodd natur yn {council} ei thir wrth ymyl y ffatrïoedd.", cy_review: true }
        down: { en: "Nature in {council} paid for the factories.", cy: "Talodd natur yn {council} am y ffatrïoedd.", cy_review: true }
    not_built: { en: "With a college feeding a cluster, you might have had: The workshop.", cy: "Gyda choleg yn bwydo clwstwr, Y gweithdy fyddai hon.", cy_review: true }

  - id: city-bedrooms
    priority: 9
    name: { en: "The city and its bedrooms", cy: "Y ddinas a'i llofftydd", cy_review: true }
    summary: { en: "The lines got faster. Young people left the valleys to live near work in the cities.", cy: "Aeth y llinellau'n gyflymach. Gadawodd pobl ifanc y cymoedd i fyw ger gwaith yn y dinasoedd.", cy_review: true }
    route: { en: "Faster trains, with no homes or work at the valley end.", cy: "Trenau cyflymach, heb gartrefi na gwaith ym mhen y cwm.", cy_review: true }
    when:
      - { kind: links_upgraded, at_least: 1 }
      - { kind: young_adults, flag: valley, vs_2026: fell }
    evidence:
      - kind: young_adults_change
        flag: valley
        up: { en: "{council} kept its young adults, against the tide.", cy: "Cadwodd {council} ei oedolion ifanc, yn erbyn y llif.", cy_review: true }
        down: { en: "{council} has fewer young adults than in 2026.", cy: "Mae gan {council} lai o oedolion ifanc nag yn 2026.", cy_review: true }
      - kind: measure_change
        measure: homes
        flag: city
        up: { en: "Homes in {council} are easier to find than in 2026.", cy: "Mae'n haws dod o hyd i gartref yn {council} nag yn 2026.", cy_review: true }
        down: { en: "Homes in {council} are dearer and harder to find than in 2026.", cy: "Mae cartrefi yn {council} yn ddrutach ac yn anoddach dod o hyd iddyn nhw nag yn 2026.", cy_review: true }
      - kind: gap_change
        up: { en: "The gap between places closed a little, all the same.", cy: "Caeodd y bwlch rhwng llefydd ychydig, er hynny.", cy_review: true }
        down: { en: "The gap between the cities and the valleys has grown.", cy: "Mae'r bwlch rhwng y dinasoedd a'r cymoedd wedi tyfu.", cy_review: true }
    not_built: { en: "With faster lines and nothing at the valley end, you might have had: The city and its bedrooms.", cy: "Gyda llinellau cyflymach a dim ym mhen y cwm, Y ddinas a'i llofftydd fyddai hon.", cy_review: true }

  - id: patchwork
    priority: 12
    name: { en: "The patchwork", cy: "Y clytwaith", cy_review: true }
    summary: { en: "Lots of small things in lots of places. Nothing big tied them together.", cy: "Llawer o bethau bach mewn llawer o lefydd. Doedd dim byd mawr yn eu clymu at ei gilydd.", cy_review: true }
    route: { en: "Going broad: many small projects and no keystone.", cy: "Mynd yn eang: llawer o brosiectau bach a dim carreg glo.", cy_review: true }
    when: []
    evidence:
      - kind: measure_change
        up: { en: "{council} is better off than in 2026.", cy: "Mae {council} yn well ei byd nag yn 2026.", cy_review: true }
        down: { en: "{council} is worse off than in 2026, even so.", cy: "Mae {council} yn waeth ei byd nag yn 2026, er hynny.", cy_review: true }
      - kind: project_standing
        up: { en: "{project} has worked in {town} since {year}.", cy: "Mae {project} wedi gweithio yn {town} ers {year}.", cy_review: true }
        down: { en: "Nothing you built is working in {council}.", cy: "Does dim byd a adeiladwyd gennych yn gweithio yn {council}.", cy_review: true }
      - kind: gap_change
        up: { en: "The gap between places has closed a little.", cy: "Mae'r bwlch rhwng llefydd wedi cau ychydig.", cy_review: true }
        down: { en: "The gap between places has grown a little.", cy: "Mae'r bwlch rhwng llefydd wedi tyfu ychydig.", cy_review: true }
    not_built: { en: "Spread across every council, you might have had: The patchwork.", cy: "Gyda'r cyfan wedi'i wasgaru ar draws pob cyngor, Y clytwaith fyddai hon.", cy_review: true }

  - id: drift
    priority: 11
    name: { en: "The drift", cy: "Y drifft", cy_review: true }
    summary: { en: "Little was built to last, so the weather and the markets did the steering. Places held on.", cy: "Ychydig a adeiladwyd i bara, felly'r tywydd a'r farchnad oedd yn llywio. Daliodd llefydd eu tir.", cy_review: true }
    route: { en: "Autopilot, or only answering events as they came.", cy: "Awtobeilot, neu ateb digwyddiadau wrth iddyn nhw ddod yn unig.", cy_review: true }
    when:
      - { kind: projects, at_most: 5 }
    evidence:
      - kind: no_event_since
        up: { en: "The {river} has stayed in its banks in {council} since {year}.", cy: "Mae afon {river} wedi aros o fewn ei glannau yn {council} ers {year}.", cy_review: true }
        down: { en: "The {river} flooded homes in {council} in {year}, and little had changed to stop it.", cy: "Gorlifodd afon {river} gartrefi yn {council} yn {year}, a phrin fod dim wedi newid i'w atal.", cy_review: true }
      - kind: young_adults_change
        up: { en: "{council} kept its young adults, mostly on its own.", cy: "Cadwodd {council} ei oedolion ifanc, ar ei ben ei hun gan fwyaf.", cy_review: true }
        down: { en: "{council} has fewer young adults than in 2026.", cy: "Mae gan {council} lai o oedolion ifanc nag yn 2026.", cy_review: true }
      - kind: measure_change
        up: { en: "{council} is a little better off than in 2026, mostly through its own efforts.", cy: "Mae {council} ychydig yn well ei byd nag yn 2026, drwy ei ymdrech ei hun gan fwyaf.", cy_review: true }
        down: { en: "{council} is worse off than in 2026.", cy: "Mae {council} yn waeth ei byd nag yn 2026.", cy_review: true }
    not_built: { en: "Without a plan of your own, you might have had: The drift.", cy: "Heb gynllun eich hun, Y drifft fyddai hon.", cy_review: true }

  # ---------------------------------------------------------------------------
  # Four endings for a hard game (16.5.3): each is a story worth having.
  - id: long-game
    priority: 2
    name: { en: "The long game", cy: "Y gêm hir", cy_review: true }
    summary: { en: "Two big projects opened late. The years were hard, but the Wales you leave is about to change.", cy: "Agorodd dau brosiect mawr yn hwyr. Roedd y blynyddoedd yn galed, ond mae'r Gymru a adewch ar fin newid.", cy_review: true }
    route: { en: "Two keystones, both started late and finished after 2044.", cy: "Dwy garreg glo, y ddwy wedi'u dechrau'n hwyr a'u gorffen ar ôl 2044.", cy_review: true }
    when:
      - { kind: keystone_finished_after, year: 2044, at_least: 2 }
    evidence:
      - kind: project_standing
        up: { en: "{project} opened in {town} in {year}. Its best years are still to come.", cy: "Agorodd {project} yn {town} yn {year}. Mae ei flynyddoedd gorau i ddod.", cy_review: true }
        down: { en: "Nothing you built is working in {council}.", cy: "Does dim byd a adeiladwyd gennych yn gweithio yn {council}.", cy_review: true }
      - kind: measure_change
        up: { en: "{council} is better off than in 2026, and still rising.", cy: "Mae {council} yn well ei byd nag yn 2026, ac yn dal i godi.", cy_review: true }
        down: { en: "{council} waited a long time. It is still behind 2026.", cy: "Bu {council} yn aros am amser hir. Mae'n dal ar ei hôl hi o'i gymharu â 2026.", cy_review: true }
      - kind: gap_change
        up: { en: "The gap between places has started to close.", cy: "Mae'r bwlch rhwng llefydd wedi dechrau cau.", cy_review: true }
        down: { en: "The gap between places is still wider than in 2026.", cy: "Mae'r bwlch rhwng llefydd yn dal yn lletach nag yn 2026.", cy_review: true }
    not_built: { en: "With two keystones started late, you might have had: The long game.", cy: "Gyda dwy garreg glo wedi'u dechrau'n hwyr, Y gêm hir fyddai hon.", cy_review: true }

  - id: comeback
    priority: 3
    name: { en: "The comeback", cy: "Y ffordd yn ôl", cy_review: true }
    summary: { en: "You lost an election, made a deal and kept it. The places furthest behind are better off than in 2026.", cy: "Collwyd etholiad, gwnaethoch fargen a'i chadw. Mae'r llefydd pellaf ar ôl yn well eu byd nag yn 2026.", cy_review: true }
    route: { en: "Lose an election, keep the deal that follows, and lift the places furthest behind.", cy: "Colli etholiad, cadw'r fargen sy'n dilyn, a chodi'r llefydd pellaf ar ôl.", cy_review: true }
    when:
      - { kind: elections_lost, at_least: 1 }
      - { kind: deals_kept, at_least: 1 }
      - { kind: lowest_three, vs_2026: higher }
    evidence:
      - kind: measure_change
        up: { en: "{council} is better off than in 2026, after some hard years.", cy: "Mae {council} yn well ei byd nag yn 2026, ar ôl rhai blynyddoedd caled.", cy_review: true }
        down: { en: "{council} has not come back yet.", cy: "Dydy {council} ddim wedi dod yn ôl eto.", cy_review: true }
      - kind: project_standing
        up: { en: "{project} has stood in {town} since {year}. It was part of the way back.", cy: "Mae {project} wedi sefyll yn {town} ers {year}. Roedd yn rhan o'r ffordd yn ôl.", cy_review: true }
        down: { en: "Nothing you built is working in {council}.", cy: "Does dim byd a adeiladwyd gennych yn gweithio yn {council}.", cy_review: true }
      - kind: gap_change
        up: { en: "The gap between places has closed since 2026.", cy: "Mae'r bwlch rhwng llefydd wedi cau ers 2026.", cy_review: true }
        down: { en: "The places furthest behind are better off, but the gap is wider than in 2026.", cy: "Mae'r llefydd pellaf ar ôl yn well eu byd, ond mae'r bwlch yn lletach nag yn 2026.", cy_review: true }
    not_built: { en: "Had you kept a deal after a lost election, you might have had: The comeback.", cy: "Petaech wedi cadw bargen ar ôl colli etholiad, Y ffordd yn ôl fyddai hon.", cy_review: true }

  - id: gamble
    priority: 8
    name: { en: "The gamble", cy: "Y gambl", cy_review: true }
    summary: { en: "A big employer came and then left. Work and pay fell where it had stood.", cy: "Daeth cyflogwr mawr ac yna gadael. Syrthiodd Gwaith a chyflog lle'r oedd wedi sefyll.", cy_review: true }
    route: { en: "Land a big employer with no college or local firms around it, then meet a downturn.", cy: "Denu cyflogwr mawr heb goleg na chwmnïau lleol o'i gwmpas, yna wynebu dirwasgiad.", cy_review: true }
