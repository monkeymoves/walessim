    evidence:
      - kind: measure_change
        measure: work
        up: { en: "{council} found new work after the big employer left.", cy: "Daeth {council} o hyd i waith newydd ar ôl i'r cyflogwr mawr adael.", cy_review: true }
        down: { en: "Work and pay in {council} is lower than in 2026.", cy: "Mae Gwaith a chyflog yn {council} yn is nag yn 2026.", cy_review: true }
      - kind: project_standing
        up: { en: "The big employer opened in {town} in {year}, and later left.", cy: "Agorodd y cyflogwr mawr yn {town} yn {year}, ac yna gadael.", cy_review: true }
        down: { en: "Nothing you built is working in {council}.", cy: "Does dim byd a adeiladwyd gennych yn gweithio yn {council}.", cy_review: true }
      - kind: young_adults_change
        up: { en: "{council} kept its young adults, even after the jobs went.", cy: "Cadwodd {council} ei oedolion ifanc, hyd yn oed ar ôl i'r swyddi fynd.", cy_review: true }
