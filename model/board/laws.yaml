# Laws for the whole region (docs/design/v2-board.md section 5.1). Owner: package 10.
# Generic policy levers only: no current named schemes. One law change per election term, and none in a hung term (rule P6).
# Laws cost backing somewhere, never coins. All sizes are GAME RULES (tune).
# A law's backing points are LASTING (playtest 9 must-fix 2): they fall at once in the councils named
# (a flag: the whole council; a group: that group's share of it) and stand for as long as the law
# does. Repealing the law gives them back. They never fade (src/board/engine/standing.ts), so the laws
# sheet can show each council's cost before you pass it, and it stays true.
# Group ids (young, older, low_income, welsh_speakers, everyone) are package 3's groups.yaml.
note: "Effect and backing sizes are game rules (tune). Generic levers, not real schemes."
laws:
  - id: local-homes-rule
    name: { en: "A local homes rule", cy: "Rheol cartrefi lleol", cy_review: true }
    what: { en: "New homes go first to people who live or work nearby. Prices rise more slowly along busy lines.", cy: "Mae cartrefi newydd yn mynd yn gyntaf i bobl sy'n byw neu'n gweithio gerllaw. Mae prisiau'n codi'n arafach ar hyd llinellau prysur.", cy_review: true }
    catch: { en: "Builders build a little less, and the city wants more homes, not fewer.", cy: "Mae adeiladwyr yn adeiladu ychydig yn llai, ac mae'r ddinas eisiau mwy o gartrefi, nid llai.", cy_review: true }
    effects:
      - { kind: block, spread: S2, share: 0.3, where: everywhere }
      - { kind: measure, measure: homes, points: -0.1, where: flagged, flag: city }
    backing:
      - { flag: city, points: -0.7 }
      - { group: young, points: 0.3 }
      - { group: welsh_speakers, points: 0.3 }

  - id: flood-plain-rule
    name: { en: "No new homes on flood plains", cy: "Dim cartrefi newydd ar orlifdiroedd", cy_review: true }
    what: { en: "No new homes or works where rivers and the sea flood. Fewer people move into harm's way.", cy: "Dim cartrefi na gweithfeydd newydd lle mae afonydd a'r môr yn gorlifo. Llai o bobl yn symud i ffordd niwed.", cy_review: true }
    catch: { en: "Valley floors are flat and handy. Fewer places to build means slower building.", cy: "Mae gwaelod y cwm yn wastad ac yn gyfleus. Llai o lefydd i adeiladu, felly adeiladu arafach.", cy_review: true }
    effects:
      - { kind: risk, risk: flood, steps: -1, where: everywhere, after_years: 4 }
      - { kind: measure, measure: homes, points: -0.1, where: flagged, flag: valley }
    backing:
      - { flag: valley, points: -0.4 }
      - { flag: coast, points: 0.2 }

  - id: visitor-levy
    name: { en: "A small charge on overnight visitors", cy: "Tâl bach ar ymwelwyr dros nos", cy_review: true }
    what: { en: "Visitors pay a little for each night they stay. The money goes back into paths, parks and towns.", cy: "Mae ymwelwyr yn talu ychydig am bob noson maen nhw'n aros. Mae'r arian yn mynd yn ôl i lwybrau, parciau a threfi.", cy_review: true }
    catch: { en: "Hotels, campsites and guest houses do not like it.", cy: "Dydy gwestai, gwersylloedd a thai llety ddim yn ei hoffi.", cy_review: true }
    effects:
      - { kind: coins, coins_per_year: 0.5 }
      - { kind: measure, measure: nature, points: 0.1, where: flagged, flag: coast }
    backing:
      - { flag: coast, points: -0.5 }
      - { flag: rural, points: -0.5 }
