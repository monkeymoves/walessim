# Game tuning: every number marked (tune) in docs/design/game-design.md lives here, not in code.
# Changes made while balancing are recorded in docs/design/balance-log.md.
years: [2026, 2030, 2034, 2038, 2042, 2046]
end_year: 2050
post_counts_until: 2058
budget: 8
contingency_carry: 1
peek_cost: 1
hand_size: 5
first_hand_size: 4
hold_over: 1
sizes: { S: 1.5, M: 2.5, L: 4.0 }
fcm_sizes: { S: 0.1, M: 0.2, L: 0.3 }
regional_size_step: 1
grade_multiplier: { poorly: 0.6, adequately: 1.0, well: 1.3 }
runs: 200
preview_runs: 50
sharp_share: 0.8
hysteresis: 0.1
default_spread: { high: 0.15, medium: 0.3, low: 0.5 }
gap_scale: 1.5
trust:
  start: 55
  clamp: 25
  drift_to: 50
  drift: 0.1
  bands:
    - { id: strong, min: 70, cards: 4, label: { en: "Trust: Strong", cy: "Ymddiriedaeth: Cryf", cy_review: true } }
    - { id: fair, min: 45, cards: 3, label: { en: "Trust: Fair", cy: "Ymddiriedaeth: Gweddol", cy_review: true } }
    - { id: thin, min: 20, cards: 2, label: { en: "Trust: Thin", cy: "Ymddiriedaeth: Tenau", cy_review: true } }
    - { id: collapsed, min: 0, cards: 0, label: { en: "You have lost the seat", cy: "Rydych wedi colli'r sedd", cy_review: true } }
  pip_gained: 4
  pip_gained_cap: 12
  pip_gained_strands: [prosperous, healthier, equal, cohesive, culture]
  pip_lost: -5
  promise_kept: 3
  promise_kept_cap: 6
  pledge_kept: 5
  pledge_broken: -8
  gap_narrowed: 5
  gap_widened: -6
  gap_tolerance: 0.05
  shock_prepared: 5
  shock_responded: 3
  shock_absorbed: -6
  visit: { well: 6, adequately: 2, poorly: -6 }
  neglect: -4
  national_counts_for_neglect: false
  debt_interest: -2
  nothing_visible: -4
curveballs:
  new_trend_chance: 0.6
  shock_chance: 0.3
  ripple_weight: 2
  ripple_shock_bonus: 0.1
  # slow trend effects are applied every term at this fraction of their size
  slow_scale: 0.3
  # shock effects apply at this fraction of their size before the response multiplier
  shock_scale: 0.5
  first_trend: wet-decade
  first_game_order: [wet-decade, price-of-a-home]
  first_game_shock: { term: 3, curveball: downturn }
response_multiplier: { absorb: 1.0, respond1: 0.5, respond2: 0.25, prepared: 0.5 }
fragile_infrastructure: { below: 4, multiplier: 1.25 }
debt: { interest: 1, clear_cost: 3, max_tokens: 3, left_penalty: 0.5, left_penalty_cap: 1.5 }
caretaker: { return_trust: 40, return_budget_penalty: 1, contingency: 2, shadow_pledge_bonus: 5 }
lived: { mean_weight: 0.75, min_weight: 0.25 }
result_bands:
  - { min: 0, name: { en: "Diminished", cy: "Wedi'i leihau", cy_review: true } }
  - { min: 3.0, name: { en: "Held, just", cy: "Wedi'i ddal, prin", cy_review: true } }
  - { min: 4.5, name: { en: "Handed on", cy: "Wedi'i drosglwyddo", cy_review: true } }
  - { min: 6.0, name: { en: "Handed on better", cy: "Wedi'i drosglwyddo'n well", cy_review: true } }
  - { min: 7.5, name: { en: "A gift", cy: "Rhodd", cy_review: true } }
letter_bands: { low: 4.5, high: 6.0 }
