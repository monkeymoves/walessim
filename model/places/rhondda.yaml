# The Rhondda: which tips first (game-design 8.1). Tips are not listed here: the build reads
# model/data/places/rhondda.json and computes each tip's facts with src/engine/place-analysis.ts
# ("below" = within 1,000 m and at least 10 m lower).
id: rhondda
name: { en: The Rhondda, cy: Y Rhondda }
kind: tips_triage
la: W06000016
applies_to_flag: coal_valley
trigger_cards: [make-coal-tips-safe, slow-the-flow, connect-buses-rail]
threads: 3
exposure_share: 0.4
# playtest 4: VERY WELL when every test holds with room to spare: exposure a fifth above what it needs
# (six in ten of the risk-weighted homes for three threads), two deprived neighbourhoods, and every
# top-risk tip above a school or the railway covered
very_well: { exposure_margin: 0.2, fairness_tips: 2, lifelines_all: true }
# trends that change the board, shown on it before the player chooses (playtest 4)
term_notes:
  - { curveball: wet-decade, note: { en: "The wet decade: every tip stands one risk step higher.", cy: "Y degawd gwlyb: mae pob tomen un cam risg yn uwch.", cy_review: true } }
deprived_rank: 191
# Base risk step from open proxies (judgement, low confidence): a tip with a BGS landslide record on it is
# step 2 if it stands at least steep_drop_m above the lowest ground within 1 km with steep_buildings or more
# below, or has many_buildings or more below; otherwise step 1. The wet decade raises every step by one.
risk_rule: { steep_drop_m: 200, steep_buildings: 125, many_buildings: 300 }
prompt: { en: "The money covers three tips this term. There are more tips than thread.", cy: "Mae'r arian yn talu am dair tomen y tymor hwn. Mae mwy o domenni nag o edau.", cy_review: true }
why_hard: { en: "The biggest tips by homes are not the riskiest, the riskiest are not above the poorest streets, and the school and railway sit under others again.", cy: "Nid y tomenni mwyaf o ran cartrefi yw'r rhai mwyaf peryglus, nid yw'r rhai mwyaf peryglus uwchben y strydoedd tlotaf, ac mae'r ysgol a'r rheilffordd o dan eraill eto.", cy_review: true }
tests:
  - id: exposure
    name: { en: Exposure, cy: Amlygiad, cy_review: true }
    description: { en: "Your threads, with tips made safe before, cover at least two fifths of the risk-weighted homes below all the tips (less when the money covers fewer than three tips).", cy: "Mae eich edafedd, gyda thomenni a wnaed yn ddiogel o'r blaen, yn cwmpasu o leiaf dwy ran o bump o'r cartrefi, wedi'u pwysoli yn ôl risg, o dan yr holl domenni (llai pan fo'r arian yn talu am lai na thair tomen).", cy_review: true }
  - id: fairness
    name: { en: Fairness, cy: Tegwch, cy_review: true }
    description: { en: "At least one thread protects a neighbourhood in the most deprived tenth of Wales.", cy: "Mae o leiaf un edau yn diogelu cymdogaeth yn y degfed mwyaf difreintiedig o Gymru.", cy_review: true }
  - id: lifelines
    name: { en: Lifelines, cy: Achubiaeth, cy_review: true }
    description: { en: "At least half of the top-risk tips above a school or the railway are covered.", cy: "Mae o leiaf hanner y tomenni risg uchaf uwchben ysgol neu'r rheilffordd wedi'u cwmpasu.", cy_review: true }
data_note: { en: "Tip locations are open proxies: BGS landslide records that mention a tip and OpenStreetMap spoil heaps. The official disused tips register is not open and is not used. Confidence: low.", cy: "Dirprwyon agored yw lleoliadau'r tomenni: cofnodion tirlithriad BGS sy'n sôn am domen a thomenni rwbel OpenStreetMap. Nid yw cofrestr swyddogol y tomenni segur yn agored ac ni chaiff ei defnyddio. Hyder: isel.", cy_review: true }
data_file: places/rhondda.json
# the place data's small-area ranks are WIMD 2019 (1,909 areas); the atlas uses WIMD 2025 (1,917)
wimd: { edition: WIMD 2019, areas: 1909 }
confidence: low
sources: [bgs-landslide, coal-tip-safety]
