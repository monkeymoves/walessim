# Bethesda and Dyffryn Ogwen: who is the quarry for now (game-design 8.2).
# Ten options, three threads, three tests. Each option's contributions are sampled within +/- spread
# in every run; a test holds if it holds in at least hold_share of runs. Measures: homes and work
# (Aros), iaith (Iaith), pressure and river (Pwysau). All numbers are illustrative board values (tune),
# chosen so that several trios pass and the strongest options each fail a test.
id: bethesda
name: { en: Bethesda and Dyffryn Ogwen, cy: Bethesda a Dyffryn Ogwen }
kind: threads_tests
la: W06000002
applies_to_flag: slate
trigger_cards: [homes-for-locals, community-owned-energy, tourism-pays-its-way, welsh-medium-childcare]
threads: 3
hold_share: 0.6
# playtest 4: VERY WELL when every test holds with room to spare: in 9 runs in 10, against the 6 needed
very_well: { share: 0.9 }
pressure_capacity: 0.3
# Aros needs homes and work at or above these; Iaith needs iaith at or above its threshold; Pwysau needs
# pressure at or below capacity and river at or above zero, after trend penalties.
thresholds: { homes: 0.8, work: 0.7, iaith: 0.8 }
prompt: { en: "Three picks to tie the quarry to the valley.", cy: "Tri dewis i glymu'r chwarel wrth y dyffryn.", cy_review: true }
why_hard: { en: "Ten choices, three picks and three tests. Each of the strongest choices fails one test. Several sets of three pass. The safest depends on the weather and house prices.", cy: "Deg opsiwn, tri dewis i'w gwneud a thri phrawf. Mae pob un o'r opsiynau cryfaf yn methu un prawf. Mae sawl set o dri yn pasio. Mae'r un mwyaf diogel yn dibynnu ar y tywydd a phrisiau tai.", cy_review: true }
tests:
  - id: aros
    name: { en: "Can young people stay?", cy: "Ydy pobl ifanc yn gallu aros?", cy_review: true }
    description: { en: "You need at least one homes pick and one work pick that both work.", cy: "Mae angen o leiaf un dewis cartrefi ac un dewis gwaith sydd ill dau'n gweithio.", cy_review: true }
  - id: iaith
    name: { en: "Is Welsh still heard on the street?", cy: "Ydy'r Gymraeg i'w chlywed ar y stryd o hyd?", cy_review: true }
    description: { en: "Your picks must stop the share of Welsh speakers here from falling.", cy: "Rhaid i'ch dewisiadau atal cyfran y siaradwyr Cymraeg yma rhag cwympo.", cy_review: true }
  - id: pwysau
    name: { en: "Can the valley cope?", cy: "Ydy'r dyffryn yn ymdopi?", cy_review: true }
    description: { en: "Visitor traffic, lorries and the river must not be too much for the valley.", cy: "Rhaid i draffig ymwelwyr, lorïau a'r afon beidio â bod yn ormod i'r dyffryn.", cy_review: true }
trend_penalties:
  - { curveball: price-of-a-home, measure: homes, amount: 0.9, note: { en: "House prices pull away: one homes pick is not enough.", cy: "Mae prisiau tai yn codi'n rhy gyflym: dydy un dewis cartrefi ddim yn ddigon.", cy_review: true } }
  - { curveball: wet-decade, measure: river, amount: 0.8, note: { en: "The Ogwen floods the lower High Street unless it has room.", cy: "Mae'r Ogwen yn gorlifo'r Stryd Fawr isaf oni bai bod ganddi le.", cy_review: true } }
  - { curveball: language-at-the-edge, measure: iaith, amount: 0.4, note: { en: "Fewer homes pass Welsh on.", cy: "Llai o gartrefi'n trosglwyddo'r Gymraeg.", cy_review: true } }
options:
  - id: chapel-homes
    n: 1
    name: { en: "Empty chapel and shops on the High Street turned into homes for local rent", cy: "Capel a siopau gwag ar y Stryd Fawr wedi'u troi'n gartrefi i'w rhentu'n lleol", cy_review: true }
    catch: { en: "Slow: it takes 8 years, and gives only a few homes.", cy: "Araf: mae'n cymryd 8 mlynedd, a dim ond ychydig o gartrefi.", cy_review: true }
    flags: [homes, iaith]
    delay: 2
    homes: 1.1
    work: 0
    iaith: 0.5
    pressure: 0
    river: 0
    spread: 0.25
  - id: quarry-edge-homes
    n: 2
    name: { en: "New homes at the quarry edge with a local-occupancy rule", cy: "Cartrefi newydd ar ymyl y chwarel gyda rheol meddiannaeth leol", cy_review: true }
    catch: { en: "It is inside the World Heritage area, so the valley copes less well.", cy: "Mae y tu mewn i ardal Treftadaeth y Byd, felly mae'r dyffryn yn ymdopi'n waeth.", cy_review: true }
    flags: [homes]
    delay: 1
    homes: 1.6
    work: 0.2
    iaith: 0.2
    pressure: 0.6
    river: 0
    spread: 0.2
  - id: cap-holiday-lets
    n: 3
    name: { en: "A cap on new holiday lets in the upper villages", cy: "Cap ar lety gwyliau newydd yn y pentrefi uchaf", cy_review: true }
    catch: { en: "Visitors spend less, so there is less work.", cy: "Mae ymwelwyr yn gwario llai, felly mae llai o waith.", cy_review: true }
    flags: [homes, iaith]
    delay: 1
    homes: 1.0
    work: -0.3
    iaith: 0.6
    pressure: -0.2
    river: 0
    spread: 0.25
  - id: park-and-ride
    n: 4
    name: { en: "Park and ride from the A55 with a bus up the valley", cy: "Parcio a theithio o'r A55 gyda bws i fyny'r dyffryn", cy_review: true }
    catch: { en: "It helps nothing else.", cy: "Dydy e'n helpu dim byd arall.", cy_review: true }
    flags: [visitors]
    delay: 1
    homes: 0
    work: 0
    iaith: 0
    pressure: -0.7
    river: 0
    spread: 0.2
    pairs_with: { option: rework-tips, pressure: -0.7 }
  - id: levy-trust
    n: 5
    name: { en: "The valley's share of the visitor levy held by a community trust", cy: "Cyfran y dyffryn o'r ardoll ymwelwyr yn cael ei dal gan ymddiriedolaeth gymunedol", cy_review: true }
    catch: { en: "Hard to predict. It only works if Tourism pays its way is active.", cy: "Anodd dweud. Dim ond yn gweithio os yw Twristiaeth yn talu ei ffordd ar waith.", cy_review: true }
    flags: [work, visitors]
    delay: 1
    homes: 0
    work: 1.0
    iaith: 0.2
    pressure: -0.4
    river: 0
    spread: 0.5
    requires_card: tourism-pays-its-way
  - id: second-hydro
    n: 6
    name: { en: "A second community hydro scheme on a tributary", cy: "Ail gynllun hydro cymunedol ar isafon", cy_review: true }
    catch: { en: "Small. In dry summers it hurts the river.", cy: "Bach. Mewn hafau sych mae'n niweidio'r afon.", cy_review: true }
    flags: [work, iaith]
    delay: 1
    homes: 0
    work: 0.8
    iaith: 0.5
    pressure: 0
    river: 0.3
    river_flips_in: hot-summers
    spread: 0.3
  - id: rework-tips
    n: 7
    name: { en: "Rework the slate tips for aggregate", cy: "Ailweithio'r tomenni llechi ar gyfer agreg", cy_review: true }
    catch: { en: "Lorries on the High Street, inside the World Heritage area. The valley cannot cope unless you also pick the park and ride.", cy: "Lorïau ar y Stryd Fawr, y tu mewn i ardal Treftadaeth y Byd. Dydy'r dyffryn ddim yn ymdopi oni bai eich bod hefyd yn dewis y parcio a theithio.", cy_review: true }
    flags: [work]
    delay: 0
    homes: 0
    work: 1.8
    iaith: 0
    pressure: 1.0
    river: 0
    spread: 0.2
  - id: quarry-workshops
    n: 8
    name: { en: "Year-round workshops and apprenticeships at the old quarry buildings", cy: "Gweithdai a phrentisiaethau drwy'r flwyddyn yn hen adeiladau'r chwarel", cy_review: true }
    catch: { en: "Only at full strength if you have played Skills and apprenticeships.", cy: "Dim ond yn gweithio'n llawn os ydych wedi chwarae Sgiliau a phrentisiaethau.", cy_review: true }
    flags: [work, iaith]
    delay: 1
    homes: 0
    work: 1.1
    iaith: 0.5
    pressure: 0.1
    river: 0
    spread: 0.3
    half_without_card: skills-and-apprenticeships
  - id: welsh-youth-centre
    n: 9
    name: { en: "Welsh-medium early years and youth centre", cy: "Canolfan blynyddoedd cynnar ac ieuenctid cyfrwng Cymraeg", cy_review: true }
    catch: { en: "On its own, it does not help young people stay.", cy: "Ar ei ben ei hun, dydy e ddim yn helpu pobl ifanc i aros.", cy_review: true }
    flags: [iaith]
    delay: 1
    homes: 0
    work: 0.1
    iaith: 1.2
    pressure: 0
    river: 0
    spread: 0.2
  - id: room-for-river
    n: 10
    name: { en: "Room for the river: flood works on the lower High Street", cy: "Lle i'r afon: gwaith llifogydd ar y Stryd Fawr isaf", cy_review: true }
    catch: { en: "Uses a pick on something nobody will thank you for, unless it rains.", cy: "Mae'n defnyddio dewis ar rywbeth na fydd neb yn diolch amdano, oni bai ei bod yn bwrw glaw.", cy_review: true }
    flags: [river]
    delay: 1
    homes: 0
    work: 0
    iaith: 0
    pressure: 0
    river: 1.2
    spread: 0.2
data_note: { en: "Sources: Census 2021 Welsh speakers by small area. Second homes and holiday lets from Gwynedd council tax. ONS house prices against pay. NRW flood zones. The World Heritage boundary. OpenStreetMap. Facts say 'to check' until sourced. How strong each choice is, is illustrative.", cy: "Ffynonellau: siaradwyr Cymraeg fesul ardal fach, Cyfrifiad 2021. Ail gartrefi a llety gwyliau o dreth gyngor Gwynedd. Prisiau tai o'u cymharu â chyflog, ONS. Parthau llifogydd CNC. Ffin Treftadaeth y Byd. OpenStreetMap. Mae ffeithiau'n dweud 'i'w wirio' nes cael ffynhonnell. Mae cryfder pob dewis yn enghreifftiol.", cy_review: true }
data_file: places/bethesda.json
# the place data's small-area ranks are WIMD 2019 (1,909 areas); the atlas uses WIMD 2025 (1,917)
wimd: { edition: "2019", areas: 1909 }
confidence: low
sources: [census-2021-welsh, language-housing]
