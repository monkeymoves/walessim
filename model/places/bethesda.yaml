# Bethesda and Dyffryn Ogwen: who is the quarry for now (game-design 8.2).
# Ten options, three threads, three tests. Each option's contributions are sampled within +/- spread
# in every run; a test holds if it holds in at least hold_share of runs. Measures: homes and work
# (Aros), iaith (Iaith), pressure and river (Pwysau). All numbers are illustrative board values (tune),
# chosen so that several trios pass and the strongest options each fail a test.
id: bethesda
name: { en: Bethesda and Dyffryn Ogwen, cy: Bethesda a Dyffryn Ogwen }
kind: threads_tests
la: W06000002
applies_to_flag: slate
trigger_cards: [homes-for-locals, community-owned-energy, tourism-pays-its-way, welsh-medium-childcare]
threads: 3
hold_share: 0.6
pressure_capacity: 0.3
# Aros needs homes and work at or above these; Iaith needs iaith at or above its threshold; Pwysau needs
# pressure at or below capacity and river at or above zero, after trend penalties.
thresholds: { homes: 0.8, work: 0.7, iaith: 0.8 }
prompt: { en: "Three threads to tie the quarry to the valley.", cy: "Tair edau i glymu'r chwarel wrth y dyffryn.", cy_review: true }
why_hard: { en: "Ten options, three threads, three tests, and the strongest options each fail a test. Several trios pass; which is safest depends on the weather and the housing market.", cy: "Deg dewis, tair edau, tri phrawf, ac mae'r dewisiadau cryfaf i gyd yn methu prawf. Mae sawl triawd yn pasio; mae'r mwyaf diogel yn dibynnu ar y tywydd a'r farchnad dai.", cy_review: true }
tests:
  - id: aros
    name: { en: Young people can stay, cy: Gall pobl ifanc aros, cy_review: true }
    description: { en: "Young adults can stay: it needs at least one Homes thread and one Work thread to pay off.", cy: "Gall oedolion ifanc aros: mae angen o leiaf un edau Cartrefi ac un edau Gwaith i dalu.", cy_review: true }
  - id: iaith
    name: { en: Welsh as the street language, cy: Y Gymraeg yn iaith y stryd, cy_review: true }
    description: { en: "Welsh remains the street language: the modelled share of speakers does not fall.", cy: "Mae'r Gymraeg yn parhau'n iaith y stryd: nid yw cyfran fodeledig y siaradwyr yn gostwng.", cy_review: true }
  - id: pwysau
    name: { en: What the valley can carry, cy: Yr hyn y gall y dyffryn ei gario, cy_review: true }
    description: { en: "Visitor traffic and the river stay within what the valley can carry.", cy: "Mae traffig ymwelwyr a'r afon yn aros o fewn yr hyn y gall y dyffryn ei gario.", cy_review: true }
trend_penalties:
  - { curveball: price-of-a-home, measure: homes, amount: 0.9, note: { en: "Prices pull away: one Homes thread is not enough.", cy: "Mae prisiau'n tynnu i ffwrdd: nid yw un edau Cartrefi yn ddigon.", cy_review: true } }
  - { curveball: wet-decade, measure: river, amount: 0.8, note: { en: "The Ogwen floods the lower High Street unless it has room.", cy: "Mae'r Ogwen yn gorlifo'r Stryd Fawr isaf oni bai bod ganddi le.", cy_review: true } }
  - { curveball: language-at-the-edge, measure: iaith, amount: 0.4, note: { en: "Fewer homes pass Welsh on.", cy: "Llai o gartrefi'n trosglwyddo'r Gymraeg.", cy_review: true } }
options:
  - id: chapel-homes
    n: 1
    name: { en: "Empty chapel and shops on the High Street turned into homes for local rent", cy: "Capel a siopau gwag ar y Stryd Fawr wedi'u troi'n gartrefi i'w rhentu'n lleol", cy_review: true }
    catch: { en: "Slow (two terms), few homes.", cy: "Araf (dau dymor), ychydig o gartrefi.", cy_review: true }
    flags: [homes, iaith]
    delay: 2
    homes: 1.1
    work: 0
    iaith: 0.5
    pressure: 0
    river: 0
    spread: 0.25
  - id: quarry-edge-homes
    n: 2
    name: { en: "New homes at the quarry edge with a local-occupancy rule", cy: "Cartrefi newydd ar ymyl y chwarel gyda rheol meddiannaeth leol", cy_review: true }
    catch: { en: "Inside the heritage landscape: pressure is harder to hold.", cy: "Y tu mewn i'r dirwedd dreftadaeth: mae'n anoddach dal y pwysau.", cy_review: true }
    flags: [homes]
    delay: 1
    homes: 1.6
    work: 0.2
    iaith: 0.2
    pressure: 0.6
    river: 0
    spread: 0.2
  - id: cap-holiday-lets
    n: 3
    name: { en: "A cap on new holiday lets in the upper villages", cy: "Cap ar lety gwyliau newydd yn y pentrefi uchaf", cy_review: true }
    catch: { en: "Visitor income falls: work is harder.", cy: "Mae incwm ymwelwyr yn gostwng: mae gwaith yn anoddach.", cy_review: true }
    flags: [homes, iaith]
    delay: 1
    homes: 1.0
    work: -0.3
    iaith: 0.6
    pressure: -0.2
    river: 0
    spread: 0.25
  - id: park-and-ride
    n: 4
    name: { en: "Park and ride from the A55 with a bus up the valley", cy: "Parcio a theithio o'r A55 gyda bws i fyny'r dyffryn", cy_review: true }
    catch: { en: "Helps nothing else.", cy: "Nid yw'n helpu dim arall.", cy_review: true }
    flags: [visitors]
    delay: 1
    homes: 0
    work: 0
    iaith: 0
    pressure: -0.7
    river: 0
    spread: 0.2
    pairs_with: { option: rework-tips, pressure: -0.7 }
  - id: levy-trust
    n: 5
    name: { en: "The valley's share of the visitor levy held by a community trust", cy: "Cyfran y dyffryn o'r ardoll ymwelwyr yn cael ei dal gan ymddiriedolaeth gymunedol", cy_review: true }
    catch: { en: "Fuzzy; works only if tourism pays its way is in play.", cy: "Niwlog; dim ond yn gweithio os yw twristiaeth yn talu ei ffordd ar waith.", cy_review: true }
    flags: [work, visitors]
    delay: 1
    homes: 0
    work: 1.0
    iaith: 0.2
    pressure: -0.4
    river: 0
    spread: 0.5
    requires_card: tourism-pays-its-way
  - id: second-hydro
    n: 6
    name: { en: "A second community hydro scheme on a tributary", cy: "Ail gynllun hydro cymunedol ar isafon", cy_review: true }
    catch: { en: "Small; the river turns against it in dry summers.", cy: "Bach; mae'r afon yn troi yn ei erbyn mewn hafau sych.", cy_review: true }
    flags: [work, iaith]
    delay: 1
    homes: 0
    work: 0.8
    iaith: 0.5
    pressure: 0
    river: 0.3
    river_flips_in: hot-summers
    spread: 0.3
  - id: rework-tips
    n: 7
    name: { en: "Rework the slate tips for aggregate", cy: "Ailweithio'r tomenni llechi ar gyfer agreg", cy_review: true }
    catch: { en: "Lorries through the High Street and inside the heritage landscape: pressure fails unless paired with the park and ride.", cy: "Lorïau drwy'r Stryd Fawr a thu mewn i'r dirwedd dreftadaeth: mae'r pwysau'n methu oni bai ei fod wedi'i baru â'r parcio a theithio.", cy_review: true }
    flags: [work]
    delay: 0
    homes: 0
    work: 1.8
    iaith: 0
    pressure: 1.0
    river: 0
    spread: 0.2
  - id: quarry-workshops
    n: 8
    name: { en: "Year-round workshops and apprenticeships at the old quarry buildings", cy: "Gweithdai a phrentisiaethau drwy'r flwyddyn yn hen adeiladau'r chwarel", cy_review: true }
    catch: { en: "Needs skills and apprenticeships nationally to reach full strength.", cy: "Angen sgiliau a phrentisiaethau yn genedlaethol i gyrraedd cryfder llawn.", cy_review: true }
    flags: [work, iaith]
    delay: 1
    homes: 0
    work: 1.1
    iaith: 0.5
    pressure: 0.1
    river: 0
    spread: 0.3
    half_without_card: skills-and-apprenticeships
  - id: welsh-youth-centre
    n: 9
    name: { en: "Welsh-medium early years and youth centre", cy: "Canolfan blynyddoedd cynnar ac ieuenctid cyfrwng Cymraeg", cy_review: true }
    catch: { en: "No effect on staying on its own.", cy: "Dim effaith ar aros ar ei phen ei hun.", cy_review: true }
    flags: [iaith]
    delay: 1
    homes: 0
    work: 0.1
    iaith: 1.2
    pressure: 0
    river: 0
    spread: 0.2
  - id: room-for-river
    n: 10
    name: { en: "Room for the river: flood works on the lower High Street", cy: "Lle i'r afon: gwaith llifogydd ar y Stryd Fawr isaf", cy_review: true }
    catch: { en: "Uses a thread on something nobody will thank you for unless it rains.", cy: "Mae'n defnyddio edau ar rywbeth na fydd neb yn diolch amdano oni bai ei bod yn bwrw glaw.", cy_review: true }
    flags: [river]
    delay: 1
    homes: 0
    work: 0
    iaith: 0
    pressure: 0
    river: 1.2
    spread: 0.2
data_note: { en: "Census 2021 Welsh language by small area, second homes and holiday lets (Gwynedd council tax, the finest open grain), ONS affordability, NRW flood zones, the World Heritage boundary, OpenStreetMap. Facts on the board carry 'to check' until sourced. Option strengths are illustrative.", cy: "Cyfrifiad 2021 y Gymraeg fesul ardal fach, ail gartrefi a llety gwyliau (treth gyngor Gwynedd, y graen agored manylaf), fforddiadwyedd ONS, parthau llifogydd CNC, ffin Treftadaeth y Byd, OpenStreetMap. Mae ffeithiau ar y bwrdd yn cario 'i'w wirio' nes cael ffynhonnell. Mae cryfderau'r dewisiadau yn enghreifftiol.", cy_review: true }
data_file: places/bethesda.json
# the place data's small-area ranks are WIMD 2019 (1,909 areas); the atlas uses WIMD 2025 (1,917)
wimd: { edition: WIMD 2019, areas: 1909 }
confidence: low
sources: [census-2021-welsh, language-housing]
