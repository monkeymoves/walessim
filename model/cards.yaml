    fact: { indicator: second_homes, pick: highest }
    effects:
      - { target: affordability, size: S, sign: 1, rule: R16 }
      - { target: young_adults, size: S, sign: 1 }
      - { target: heartland, size: S, sign: 1, where: { flags: [heartland] } }
      - { target: gva_head, size: S, sign: -1, side: true }
      - { target: trust, amount: -3, sign: 1, side: true, note: { en: "Second home owners object", cy: "Mae perchnogion ail gartrefi yn gwrthwynebu", cy_review: true } }

  - id: connect-buses-rail
    name: { en: Buses and rail that connect, cy: Bysiau a rheilffyrdd sy'n cysylltu, cy_review: true }
    description: { en: "Frequent buses and trains that link valleys and villages to work.", cy: "Bysiau a threnau mynych sy'n cysylltu cymoedd a phentrefi â gwaith.", cy_review: true }
    scope: region
    cost: 3
    delay: 1
    sector: transport
    visit: rhondda
    visit_thread_fewer: true
    tags: [transport]
    upgraded_by: { en: The lines that closed, cy: Y rheilffyrdd a gaeodd, cy_review: true }
    side_note: { en: "Running cost: 1 coin each turn for the next 8 years. Skip it and the buses stop. That counts as a broken promise.", cy: "Cost cynnal: 1 darn arian bob tro am yr 8 mlynedd nesaf. Os na thalwch, mae'r bysiau'n stopio. Mae hynny'n cyfrif fel addewid wedi'i dorri.", cy_review: true }
    what: { en: "Buses and trains that come often and meet each other.", cy: "Bysiau a threnau sy'n dod yn aml ac yn cwrdd â'i gilydd.", cy_review: true }
    catch: { en: "Pay 1 coin each turn for the next 8 years. Skip it and the buses stop.", cy: "Talwch 1 darn arian bob tro am yr 8 mlynedd nesaf. Os na thalwch, mae'r bysiau'n stopio.", cy_review: true }
    picture: { en: "A school leaver in Treorchy gets to a job in Cardiff without a car.", cy: "Mae person ifanc o Dreorci yn cyrraedd swydd yng Nghaerdydd heb gar.", cy_review: true }
    visit_why: { en: "The railway runs below the old coal tips. Choose which tips to make safe first, so the line is safe.", cy: "Mae'r rheilffordd yn rhedeg o dan yr hen domenni glo. Dewiswch pa domenni i'w gwneud yn ddiogel gyntaf, er mwyn i'r lein fod yn ddiogel.", cy_review: true }
    fact: { indicator: gp_travel_public, pick: highest }
    upkeep:
      pips: 1
      every: 1
      times: 2
      reverses_card: true
      breaks_pledge: true
      lapse: []
      note: { en: "The buses run only on some days", cy: "Mae'r bysiau'n rhedeg ar rai dyddiau yn unig", cy_review: true }
    effects:
      - { target: access, size: M, sign: 1, rule: R24 }
      - { target: employment, size: S, sign: 1 }
