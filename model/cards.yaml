standing:
  - id: borrow-to-invest
    name: { en: Borrow to invest, cy: Benthyg i fuddsoddi, cy_review: true }
    description: { en: "Spend now, repay later.", cy: "Gwario nawr, ad-dalu wedyn.", cy_review: true }
    budget: 3
    effects: []
    clear_cost: 3
    max_tokens: 3
    rule: R35
    side_note: { en: "One debt token: 1 pip of interest every term until cleared for 3 pips. Each token left in 2050 takes from what you hand on. At most three.", cy: "Un tocyn dyled: 1 pip o log bob tymor nes ei glirio am 3 phip. Mae pob tocyn sydd ar ôl yn 2050 yn tynnu o'r hyn a drosglwyddwch. Tri ar y mwyaf.", cy_review: true }
    upgraded_by: { en: The company shop, cy: Siop y cwmni, cy_review: true }
  - id: defer-maintenance
    name: { en: Put off the repairs, cy: Gohirio'r atgyweiriadau, cy_review: true }
    description: { en: "Skip a round of upkeep on roads, pipes and defences.", cy: "Hepgor rownd o gynnal ar ffyrdd, pibellau ac amddiffynfeydd.", cy_review: true }
    budget: 2
    effects:
      - { target: infrastructure_condition, size: M, sign: -1, rule: R10 }
    clear_cost: 3
    rule: R10
    side_note: { en: "Roads, pipes and defences decline. While they are poor, every shock hits a quarter harder. Repair costs 3 pips.", cy: "Mae ffyrdd, pibellau ac amddiffynfeydd yn dirywio. Tra bônt yn wael, mae pob sioc yn taro chwarter yn galetach. Mae atgyweirio'n costio 3 phip.", cy_review: true }
    upgraded_by: { en: The tips nobody owned, cy: Y tomenni nad oedd neb yn berchen arnynt, cy_review: true }
