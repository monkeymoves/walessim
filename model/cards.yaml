    sector: construction
    tags: [housing]
    upgraded_by: { en: Garden villages, cy: Pentrefi gardd, cy_review: true }
    side_note: { en: "Building takes land from nature and adds to climate change.", cy: "Mae adeiladu'n cymryd tir oddi wrth natur ac yn ychwanegu at newid hinsawdd.", cy_review: true }
    what: { en: "New homes to rent that stay affordable for good.", cy: "Cartrefi newydd i'w rhentu sy'n aros yn fforddiadwy am byth.", cy_review: true }
    catch: { en: "Building uses land and makes greenhouse gas. Nature and Climate dip a little.", cy: "Mae adeiladu'n defnyddio tir ac yn creu nwyon tŷ gwydr. Mae Natur a'r Hinsawdd yn gostwng ychydig.", cy_review: true }
    picture: { en: "A young couple rent a flat in the town where they grew up.", cy: "Mae cwpl ifanc yn rhentu fflat yn y dref lle cawson nhw eu magu.", cy_review: true }
