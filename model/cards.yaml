# The deck: twenty cards and two standing tickets (game-design section 6).
# Effects: target is a component id or fcm:<SoNaRR node>; sign +1 helps the score, -1 frays it; size S, M, L.
# Main effects land after the card's delay; side effects (side: true) land at once unless they say otherwise.
# `where` narrows the card's chosen scope; `condition` uses the fixed vocabulary in src/model/schema.ts.
# Welsh titles are drafts for the content agent and a fluent reviewer.

cards:
  - id: restore-upland-peat
    name: { en: Restore upland peat, cy: Adfer mawn yr ucheldir, cy_review: true }
    description: { en: "Block the drains on hill bogs so they fill with water again.", cy: "Cau'r ffosydd ar gorsydd y bryniau fel eu bod yn llenwi â dŵr eto.", cy_review: true }
    scope: region
    cost: 2
    delay: 2
    sector: land
    tags: [prevention, green, nature]
    upgraded_by: { en: Lesson of the drained uplands, cy: Gwers yr ucheldir a ddraeniwyd, cy_review: true }
    side_note: { en: "Hill farms earn a little less for 4 years.", cy: "Mae ffermydd y bryniau'n ennill ychydig llai am 4 blynedd.", cy_review: true }
    what: { en: "Wet bogs on the hills hold back rain and store carbon.", cy: "Mae corsydd gwlyb ar y bryniau'n dal glaw yn ôl ac yn storio carbon.", cy_review: true }
    catch: { en: "It takes 8 years to work. Hill farms earn a little less at first.", cy: "Mae'n cymryd 8 mlynedd i weithio. Mae ffermydd y bryniau'n ennill ychydig llai i ddechrau.", cy_review: true }
    picture: { en: "A stream below the moor rises slowly after a storm, not all at once.", cy: "Mae nant o dan y rhos yn codi'n araf ar ôl storm, nid i gyd ar unwaith.", cy_review: true }
    fact: none
    effects:
      - { target: peat_condition, size: S, sign: 1, rule: R06 }
      - { target: "fcm:pressure:drainage", size: M, sign: -1, rule: R29 }
      - { target: flood_exposure, size: S, sign: 1, rule: R08 }
      - { target: earnings, size: S, sign: -1, side: true, duration: 1, note: { en: "Hill farm income, for 4 years", cy: "Incwm ffermydd y bryniau, am 4 blynedd", cy_review: true } }

  - id: make-coal-tips-safe
    name: { en: Make coal tips safe, cy: Gwneud tomenni glo yn ddiogel, cy_review: true }
    description: { en: "Drain, reshape and keep watch on the old coal tips above the valleys.", cy: "Draenio, ail-siapio a chadw golwg ar yr hen domenni glo uwchben y cymoedd.", cy_review: true }
    scope: region
    regions: [southeast, southwest]
    cost: 4
    delay: 1
    sector: construction
    visit: rhondda
    tags: [prevention, places, safety]
    upgraded_by: { en: "Coal: the tips stayed", cy: "Glo: arhosodd y tomenni", cy_review: true }
    side_note: { en: "The most costly card: it can use up a whole turn. The building jobs do not last.", cy: "Y cerdyn drutaf: gall ddefnyddio tro cyfan. Dydy'r swyddi adeiladu ddim yn para.", cy_review: true }
    what: { en: "Make old coal tips safe, so they cannot slide onto homes.", cy: "Gwneud hen domenni glo yn ddiogel, fel na allan nhw lithro ar gartrefi.", cy_review: true }
    catch: { en: "It costs 4 coins, half your budget. It only works in the coal valleys.", cy: "Mae'n costio 4 darn arian, hanner eich cyllideb. Dim ond yn y cymoedd glo mae'n gweithio.", cy_review: true }
    picture: { en: "Children walk to school under a hill that will not move.", cy: "Mae plant yn cerdded i'r ysgol o dan fryn na fydd yn symud.", cy_review: true }
    visit_why: { en: "The money covers only some of the tips. You choose which are made safe first.", cy: "Dim ond rhai o'r tomenni mae'r arian yn eu talu. Chi sy'n dewis pa rai sy'n cael eu gwneud yn ddiogel gyntaf.", cy_review: true }
    fact: none
    effects:
      - { target: tip_liability, size: M, sign: 1, rule: R11, where: { flags: [coal_valley] } }
      - { target: access, size: S, sign: 1, where: { flags: [coal_valley] } }
      - { target: life_exp, size: S, sign: 1, where: { flags: [coal_valley] } }

  - id: community-owned-energy
    name: { en: Community-owned energy, cy: Ynni dan berchnogaeth gymunedol, cy_review: true }
    description: { en: "Local wind, water and solar power, with the money staying in the village.", cy: "Pŵer gwynt, dŵr a haul lleol, gyda'r arian yn aros yn y pentref.", cy_review: true }
    scope: region
    cost: 1
    delay: 1
    sector: energy
    needs_partners: true
    visit: bethesda
    confidence: low
    tags: [energy, cooperation, green]
    upgraded_by: { en: The miners' institutes, cy: Neuaddau'r glowyr, cy_review: true }
    side_note: { en: "Needs local help: half as strong unless regions work together there, or your visit goes well. Slower than a big company.", cy: "Angen cymorth lleol: hanner mor gryf heb hynny. Mae rhanbarthau sy'n cydweithio, neu ymweliad da, yn helpu. Arafach na chwmni mawr.", cy_review: true }
    what: { en: "Villages own their own turbines, hydro and solar panels.", cy: "Mae pentrefi'n berchen ar eu tyrbinau, eu hydro a'u paneli solar eu hunain.", cy_review: true }
    catch: { en: "It is small and slow. It is half as strong without local help.", cy: "Mae'n fach ac yn araf. Mae'n hanner mor gryf heb gymorth lleol.", cy_review: true }
    picture: { en: "The village hall pays its bills from the hydro on the stream.", cy: "Mae neuadd y pentref yn talu ei biliau o'r hydro ar y nant.", cy_review: true }
    visit_why: { en: "The valley chooses what its new money does first. Your picks there decide how well the card works.", cy: "Mae'r dyffryn yn dewis beth mae ei arian newydd yn ei wneud gyntaf. Eich dewisiadau yno sy'n penderfynu pa mor dda mae'r cerdyn yn gweithio.", cy_review: true }
    fact: { indicator: renewables, pick: highest }
    effects:
      - { target: community_assets, size: S, sign: 1, rule: R33, condition: { needs_partners: true } }
      - { target: renewables, size: S, sign: 1, rule: R27, condition: { needs_partners: true } }
      - { target: earnings, size: S, sign: 1, condition: { needs_partners: true } }
      - { target: heartland, size: S, sign: 1, where: { flags: [heartland] }, condition: { needs_partners: true }, note: { en: "Money that stays in Welsh-speaking villages", cy: "Arian sy'n aros mewn pentrefi Cymraeg", cy_review: true } }

  - id: welsh-medium-childcare
    name: { en: Welsh-medium childcare, cy: Gofal plant cyfrwng Cymraeg, cy_review: true }
    description: { en: "Free nursery places in Welsh from age two.", cy: "Lleoedd meithrin am ddim yn Gymraeg o ddwy oed.", cy_review: true }
    scope: national_or_region
    cost: 2
    delay: 3
    sector: care
    visit: bethesda
    tags: [prevention, language]
    upgraded_by: { en: The Sunday schools, cy: Yr Ysgolion Sul, cy_review: true }
    side_note: { en: "Where staff are short, other work loses people for 4 years. Weaker without Skills and apprenticeships.", cy: "Lle mae prinder staff, mae gwaith arall yn colli pobl am 4 blynedd. Gwannach heb Sgiliau a phrentisiaethau.", cy_review: true }
    what: { en: "Children learn Welsh at nursery, even when nobody speaks it at home.", cy: "Mae plant yn dysgu Cymraeg yn y feithrinfa. Does dim rhaid i neb ei siarad gartref.", cy_review: true }
    catch: { en: "It takes 12 years to show. It needs trained staff, so it is weaker without Skills and apprenticeships.", cy: "Mae'n cymryd 12 mlynedd i'w weld. Mae angen staff wedi'u hyfforddi, felly mae'n wannach heb Sgiliau a phrentisiaethau.", cy_review: true }
    picture: { en: "A girl in Bargoed answers her grandmother in Welsh for the first time.", cy: "Mae merch ym Margod yn ateb ei mam-gu yn Gymraeg am y tro cyntaf.", cy_review: true }
    visit_why: { en: "The new places need homes, work and Welsh around them. Choose what the valley does alongside.", cy: "Mae angen cartrefi, gwaith a'r Gymraeg o gwmpas y lleoedd newydd. Dewiswch beth mae'r dyffryn yn ei wneud ochr yn ochr â nhw.", cy_review: true }
    fact: { indicator: welsh_at_home_pupils, pick: wales }
    effects:
      - { target: speakers_stock, size: S, sign: 1, rule: R19, condition: { half_without_card: skills-and-apprenticeships } }
      - { target: welsh_speakers, size: S, sign: 1, rule: R19, condition: { half_without_card: skills-and-apprenticeships } }
      - { target: early_years_stock, size: S, sign: 1, rule: R32 }
      - { target: employment, size: S, sign: -1, side: true, duration: 1, note: { en: "Staff are short, for 4 years", cy: "Prinder staff, am 4 blynedd", cy_review: true } }

  - id: warm-homes
    name: { en: Warm homes, cy: Cartrefi cynnes, cy_review: true }
    description: { en: "Insulate the coldest homes first and fit better heating.", cy: "Inswleiddio'r cartrefi oeraf yn gyntaf a gosod gwres gwell.", cy_review: true }
    scope: national
    cost: 3
    delay: 2
    sector: construction
    tags: [prevention, energy, health]
    upgraded_by: { en: "The terraces: built fast, built cold", cy: "Y terasau: wedi'u codi'n gyflym, wedi'u codi'n oer", cy_review: true }
    side_note: { en: "Half as strong while Wales is short of trained workers. Nothing to see for 8 years.", cy: "Hanner mor gryf tra bo Cymru'n brin o weithwyr wedi'u hyfforddi. Dim byd i'w weld am 8 mlynedd.", cy_review: true }
    what: { en: "Insulate the coldest homes first.", cy: "Inswleiddio'r cartrefi oeraf yn gyntaf.", cy_review: true }
    catch: { en: "8 years of nothing to show. Trust may dip while you wait. It is half as strong if Wales is short of trained workers.", cy: "8 mlynedd heb ddim i'w ddangos. Gall yr ymddiriedaeth ostwng tra byddwch yn aros. Mae'n hanner mor gryf os yw Cymru'n brin o weithwyr wedi'u hyfforddi.", cy_review: true }
    picture: { en: "A pensioner in a cold terrace turns the heating down and stays warm.", cy: "Mae pensiynwr mewn tŷ teras oer yn troi'r gwres i lawr ac yn aros yn gynnes.", cy_review: true }
    fact: { indicator: home_energy_efficiency, pick: lowest }
    effects:
      - { target: fuel_poverty, size: M, sign: 1, rule: R13, condition: { half_if_below: { component: skills_stock, value: 4 } } }
      - { target: emissions_head, size: M, sign: 1, condition: { half_if_below: { component: skills_stock, value: 4 } } }
      - { target: health_stock, size: S, sign: 1, rule: R15, condition: { half_if_below: { component: skills_stock, value: 4 } } }

  - id: build-social-homes
