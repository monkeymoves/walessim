    side_note: { en: "Emissions rise. Fragile: it may leave if a trade or recession shock lands. Pay rises only a little.", cy: "Mae allyriadau'n codi. Bregus: gall adael os daw sioc masnach neu ddirwasgiad. Mae cyflog yn codi ychydig yn unig.", cy_review: true }
