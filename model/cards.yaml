# The deck: twenty cards and two standing tickets (game-design section 6).
# Effects: target is a component id or fcm:<SoNaRR node>; sign +1 helps the score, -1 frays it; size S, M, L.
# Main effects land after the card's delay; side effects (side: true) land at once unless they say otherwise.
# `where` narrows the card's chosen scope; `condition` uses the fixed vocabulary in src/model/schema.ts.
# Welsh titles are drafts for the content agent and a fluent reviewer.

cards:
  - id: restore-upland-peat
    name: { en: Restore upland peat, cy: Adfer mawn yr ucheldir, cy_review: true }
    description: { en: "Block the drains and re-wet the bog.", cy: "Blocio'r ffosydd ac ail-wlychu'r gors.", cy_review: true }
    scope: region
    cost: 2
    delay: 2
    sector: land
    tags: [prevention, green, nature]
    upgraded_by: { en: Lesson of the drained uplands, cy: Gwers yr ucheldir a ddraeniwyd, cy_review: true }
    side_note: { en: "Upland farm income dips for a term.", cy: "Mae incwm ffermydd yr ucheldir yn gostwng am dymor.", cy_review: true }
    effects:
      - { target: peat_condition, size: S, sign: 1, rule: R06 }
      - { target: "fcm:pressure:drainage", size: M, sign: -1, rule: R29 }
      - { target: flood_exposure, size: S, sign: 1, rule: R08 }
      - { target: earnings, size: S, sign: -1, side: true, duration: 1, note: { en: "Upland farm income, for one term", cy: "Incwm ffermydd yr ucheldir, am un tymor", cy_review: true } }

  - id: make-coal-tips-safe
    name: { en: Make coal tips safe, cy: Gwneud tomenni glo yn ddiogel, cy_review: true }
    description: { en: "Drain, regrade and monitor the tips above the valleys.", cy: "Draenio, ail-raddio a monitro'r tomenni uwchben y cymoedd.", cy_review: true }
    scope: region
    regions: [southeast, southwest]
    cost: 4
    delay: 1
    sector: construction
    visit: rhondda
    tags: [prevention, places, safety]
    upgraded_by: { en: "Coal: the tips stayed", cy: "Glo: arhosodd y tomenni", cy_review: true }
    side_note: { en: "The heaviest ticket: it crowds out a whole hand. The jobs ripple is brief.", cy: "Y tocyn trymaf: mae'n gwthio llaw gyfan allan. Mae'r crychdon swyddi yn fyr.", cy_review: true }
    effects:
      - { target: tip_liability, size: M, sign: 1, rule: R11, where: { flags: [coal_valley] } }
      - { target: access, size: S, sign: 1, where: { flags: [coal_valley] } }
      - { target: life_exp, size: S, sign: 1, where: { flags: [coal_valley] } }

  - id: community-owned-energy
    name: { en: Community-owned energy, cy: Ynni dan berchnogaeth gymunedol, cy_review: true }
    description: { en: "Local turbines, hydro and solar, with the income staying put.", cy: "Tyrbinau, hydro a solar lleol, gyda'r incwm yn aros yn ei unfan.", cy_review: true }
    scope: region
    cost: 1
    delay: 1
    sector: energy
    needs_partners: true
    visit: bethesda
    confidence: low
    tags: [energy, cooperation, green]
    upgraded_by: { en: The miners' institutes, cy: Neuaddau'r glowyr, cy_review: true }
    side_note: { en: "Needs partners: half strength without a regional compact or a well-handled visit. Slower than commercial build.", cy: "Angen partneriaid: hanner cryfder heb gompact rhanbarthol neu ymweliad wedi'i drin yn dda. Arafach nag adeiladu masnachol.", cy_review: true }
    effects:
      - { target: community_assets, size: S, sign: 1, rule: R33, condition: { needs_partners: true } }
      - { target: renewables, size: S, sign: 1, rule: R27, condition: { needs_partners: true } }
      - { target: earnings, size: S, sign: 1, condition: { needs_partners: true } }
      - { target: heartland, size: S, sign: 1, where: { flags: [heartland] }, condition: { needs_partners: true }, note: { en: "Income that stays in Welsh-speaking villages", cy: "Incwm sy'n aros mewn pentrefi Cymraeg", cy_review: true } }

  - id: welsh-medium-childcare
    name: { en: Welsh-medium childcare, cy: Gofal plant cyfrwng Cymraeg, cy_review: true }
    description: { en: "Free Welsh-medium places from age two.", cy: "Lleoedd cyfrwng Cymraeg am ddim o ddwy oed.", cy_review: true }
    scope: national_or_region
    cost: 2
    delay: 3
    sector: care
    visit: bethesda
    tags: [prevention, language]
    upgraded_by: { en: The Sunday schools, cy: Yr Ysgolion Sul, cy_review: true }
    side_note: { en: "Employment dips for a term where staff are short; weaker without skills and apprenticeships.", cy: "Mae cyflogaeth yn gostwng am dymor lle mae prinder staff; gwannach heb sgiliau a phrentisiaethau.", cy_review: true }
    effects:
      - { target: speakers_stock, size: S, sign: 1, rule: R19, condition: { half_without_card: skills-and-apprenticeships } }
      - { target: welsh_speakers, size: S, sign: 1, rule: R19, condition: { half_without_card: skills-and-apprenticeships } }
      - { target: early_years_stock, size: S, sign: 1, rule: R32 }
      - { target: employment, size: S, sign: -1, side: true, duration: 1, note: { en: "Staff are short, for one term", cy: "Prinder staff, am un tymor", cy_review: true } }

  - id: warm-homes
    name: { en: Warm homes, cy: Cartrefi cynnes, cy_review: true }
    description: { en: "Insulate and re-heat the coldest homes first.", cy: "Inswleiddio ac ail-gynhesu'r cartrefi oeraf yn gyntaf.", cy_review: true }
    scope: national
    cost: 3
    delay: 2
    sector: construction
    tags: [prevention, energy, health]
    upgraded_by: { en: "The terraces: built fast, built cold", cy: "Y terasau: wedi'u codi'n gyflym, wedi'u codi'n oer", cy_review: true }
    side_note: { en: "Half strength while skills are below 4. Nothing visible for two terms.", cy: "Hanner cryfder tra bo sgiliau o dan 4. Dim byd i'w weld am ddau dymor.", cy_review: true }
    effects:
      - { target: fuel_poverty, size: M, sign: 1, rule: R13, condition: { half_if_below: { component: skills_stock, value: 4 } } }
      - { target: emissions_head, size: M, sign: 1, condition: { half_if_below: { component: skills_stock, value: 4 } } }
      - { target: health_stock, size: S, sign: 1, rule: R15, condition: { half_if_below: { component: skills_stock, value: 4 } } }

  - id: build-social-homes
    name: { en: Build social homes, cy: Codi cartrefi cymdeithasol, cy_review: true }
    description: { en: "Homes for rent that stay affordable.", cy: "Cartrefi i'w rhentu sy'n aros yn fforddiadwy.", cy_review: true }
    scope: region
    cost: 3
    delay: 1
    sector: construction
    tags: [housing]
    upgraded_by: { en: Garden villages, cy: Pentrefi gardd, cy_review: true }
    side_note: { en: "Land take presses on nature; building spends carbon.", cy: "Mae defnyddio tir yn pwyso ar natur; mae adeiladu'n gwario carbon.", cy_review: true }
    effects:
      - { target: housing_stock, size: S, sign: 1 }
      - { target: affordability, size: S, sign: 1, rule: R16 }
      - { target: young_adults, size: S, sign: 1 }
      - { target: "fcm:pressure:built_development_and_infrastructure", size: S, sign: 1, rule: R29, side: true }
      - { target: carbon_budget, size: S, sign: -1, side: true }

  - id: homes-for-locals
    name: { en: Homes for locals, cy: Cartrefi i bobl leol, cy_review: true }
    description: { en: "Limits on second homes and holiday lets where they crowd people out.", cy: "Cyfyngiadau ar ail gartrefi a llety gwyliau lle maen nhw'n gwthio pobl allan.", cy_review: true }
    scope: region
    regions: [north, mid, southwest]
    cost: 1
    delay: 1
    visit: bethesda
    tags: [housing, language]
    upgraded_by: { en: "Slate: the lockout and the terraces", cy: "Llechi: y cload allan a'r terasau", cy_review: true }
    side_note: { en: "Visitor spend falls in the region; some people are angry that term.", cy: "Mae gwariant ymwelwyr yn gostwng yn y rhanbarth; mae rhai pobl yn ddig y tymor hwnnw.", cy_review: true }
    effects:
      - { target: affordability, size: S, sign: 1, rule: R16 }
      - { target: young_adults, size: S, sign: 1 }
      - { target: heartland, size: S, sign: 1, where: { flags: [heartland] } }
      - { target: gva_head, size: S, sign: -1, side: true }
      - { target: trust, amount: -3, sign: 1, side: true, note: { en: "Second home owners object", cy: "Mae perchnogion ail gartrefi yn gwrthwynebu", cy_review: true } }

  - id: connect-buses-rail
    name: { en: Buses and rail that connect, cy: Bysiau a rheilffyrdd sy'n cysylltu, cy_review: true }
    description: { en: "Frequent services that link valleys and villages to work.", cy: "Gwasanaethau mynych sy'n cysylltu cymoedd a phentrefi â gwaith.", cy_review: true }
    scope: region
    cost: 3
    delay: 1
    sector: transport
    visit: rhondda
    visit_thread_fewer: true
    tags: [transport]
    upgraded_by: { en: The lines that closed, cy: Y rheilffyrdd a gaeodd, cy_review: true }
    side_note: { en: "Upkeep: 1 pip in each of the next two terms, or the service lapses and a pledge counts as broken.", cy: "Cynnal: 1 pip ym mhob un o'r ddau dymor nesaf, neu mae'r gwasanaeth yn dod i ben ac mae addewid yn cyfrif fel un a dorrwyd.", cy_review: true }
    upkeep:
      pips: 1
      every: 1
      times: 2
      reverses_card: true
      breaks_pledge: true
      lapse: []
      note: { en: "The buses run only on some days", cy: "Mae'r bysiau'n rhedeg ar rai dyddiau yn unig", cy_review: true }
    effects:
      - { target: access, size: M, sign: 1, rule: R24 }
      - { target: employment, size: S, sign: 1 }
      - { target: emissions_head, size: S, sign: 1 }

