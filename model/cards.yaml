    description: { en: "Limits on second homes and holiday lets where they push local people out.", cy: "Cyfyngiadau ar ail gartrefi a llety gwyliau lle maen nhw'n gwthio pobl leol allan.", cy_review: true }
    scope: region
    regions: [north, mid, southwest]
    cost: 1
    delay: 1
    visit: bethesda
    tags: [housing, language]
    upgraded_by: { en: "Slate: the lockout and the terraces", cy: "Llechi: y cload allan a'r terasau", cy_review: true }
    side_note: { en: "Visitors spend less in the region. Some people are angry for 4 years.", cy: "Mae ymwelwyr yn gwario llai yn y rhanbarth. Mae rhai pobl yn ddig am 4 blynedd.", cy_review: true }
