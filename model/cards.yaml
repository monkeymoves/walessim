    side_note: { en: "Mints a liability: 1 pip of upkeep every second term, or the condition of what is built falls. Presses on rivers and coast.", cy: "Mae'n bathu atebolrwydd: 1 pip o gynnal bob yn ail dymor, neu mae cyflwr yr hyn a adeiladwyd yn gostwng. Mae'n pwyso ar afonydd a'r arfordir.", cy_review: true }
