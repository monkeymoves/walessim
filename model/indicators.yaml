indicators:
- id: gva_head
  name:
    en: Gross value added per head
    cy: Gwerth ychwanegol gros y pen
  cy_review: true
  unit: GBP per person
  format: gbp
  higher_is_better: true
  strand: prosperous
  national_indicator: null
  source: ons_regional_gdp_la
  notes:
    en: GVA(B), current prices, 2024. Residence-based population denominator; commuting areas distort LAs with large workplace flows.
- id: gdhi_head
  name:
    en: Household income per person
    cy: Incwm aelwydydd y pen
  cy_review: true
  unit: GBP per person
  format: gbp
  higher_is_better: true
  strand: prosperous
  national_indicator: null
  source: sw_gdhi
  notes:
    en: Gross disposable household income per head, 2024 (provisional). This is money households have left to spend or save
      after tax and benefits, counted where people live, so it does not get inflated by commuters the way GVA per head does.
- id: employment
  name:
    en: Employment rate, 16 to 64
    cy: Cyfradd cyflogaeth, 16 i 64
  cy_review: true
  unit: percent
  format: percent
  higher_is_better: true
  strand: prosperous
  national_indicator: null
  source: nomis_aps
  notes:
    en: Annual Population Survey, July 2025 to June 2026. Sample-based, noisy for small LAs.
- id: inactivity
  name:
    en: Adults not working or looking for work
    cy: Oedolion nad ydynt yn gweithio nac yn chwilio am waith
  cy_review: true
  unit: percent of residents aged 16 to 64
  format: percent
  higher_is_better: false
  strand: prosperous
  national_indicator: null
  source: nomis_aps
  notes:
    en: Economic inactivity rate, aged 16 to 64, July 2025 to June 2026 (Annual Population Survey variable 111). Includes
      students, carers, people who are retired early and people who are long-term sick. Sample survey, so small areas have
      wide margins of error.
- id: claimant_rate
  name:
    en: People claiming out-of-work benefits
    cy: Pobl sy'n hawlio budd-daliadau diwaith
  cy_review: true
  unit: percent of residents aged 16 to 64
  format: percent
  higher_is_better: false
  strand: prosperous
  national_indicator: null
  source: nomis_claimant
  notes:
    en: Claimant count (Universal Credit and Jobseeker's Allowance claimants who must look for work) as a share of residents
      aged 16 to 64, mean of the 12 months from November 2025 to October 2026. Not seasonally adjusted at local level, so
      a 12 month mean is used. Some claimants are in work on low pay.
- id: employment_deprivation
  name:
    en: Working-age people in employment deprivation
    cy: Pobl oed gweithio mewn amddifadedd cyflogaeth
  cy_review: true
  unit: percent of working-age people
  format: percent
  higher_is_better: false
  strand: prosperous
  national_indicator: null
  source: statswales_wimd2025_la
  notes:
    en: 'Share of working-age people who are in employment deprivation (WIMD 2025): claiming out-of-work benefits or unable
      to work through ill health. Source years vary by benefit. Benefit-based, so it overlaps the claimant measure.'
- id: earnings
  name:
    en: Median gross weekly earnings, full-time, residence based
    cy: Enillion wythnosol gros canolrifol, llawn amser, yn ôl preswylfa
  cy_review: true
  unit: GBP per week
  format: gbp
  higher_is_better: true
  strand: prosperous
  national_indicator: null
  source: nomis_ashe
  notes:
    en: ASHE 2025, full-time workers by place of residence.
- id: earnings_workplace
  name:
    en: Weekly pay of jobs in the area
    cy: Cyflog wythnosol swyddi yn yr ardal
  cy_review: true
  unit: GBP per week
  format: gbp
  higher_is_better: true
  strand: prosperous
  national_indicator: null
  source: nomis_ashe_workplace
  notes:
    en: 'Median gross weekly earnings of full-time workers by place of work, 2026. Compare with the residence-based earnings
      measure: the gap shows commuting.'
- id: level4
  name:
    en: Working-age adults with a degree-level qualification
    cy: Oedolion oed gweithio a chymhwyster lefel gradd
  cy_review: true
  unit: percent of people aged 18 to 64
  format: percent
  higher_is_better: true
  strand: prosperous
  national_indicator: null
  source: sw_qualifications
  notes:
    en: Adults aged 18 to 64 qualified to level 4 or above (degree level, higher national certificates and similar), 2025.
      From the Annual Population Survey. Definitions changed in 2022, so compare with earlier years with care.
- id: jobs_density
  name:
    en: Jobs per working-age resident
    cy: Swyddi fesul preswylydd oed gweithio
  cy_review: true
  unit: jobs per resident aged 16 to 64
  format: ratio
  higher_is_better: true
  strand: prosperous
  national_indicator: null
  source: nomis_jobs_density
  notes:
    en: Jobs located in the area divided by residents aged 16 to 64, 2024. Low values in commuter areas such as Torfaen and
      Caerphilly do not mean a weak economy, because residents work elsewhere.
- id: enterprises_10k
  name:
    en: Businesses per 10,000 working-age people
    cy: Busnesau fesul 10,000 o bobl oed gweithio
  cy_review: true
  unit: businesses per 10,000 people aged 16 to 64
  format: integer
  higher_is_better: true
  strand: prosperous
  national_indicator: null
  source: sw_business_demography
  notes:
    en: Active enterprises per 10,000 residents aged 16 to 64, 2025. Businesses are counted at their registered address, so
      head offices can inflate some areas.
- id: business_births
  name:
    en: New businesses started
    cy: Busnesau newydd a ddechreuwyd
  cy_review: true
  unit: percent of active businesses
  format: percent
  higher_is_better: true
  strand: prosperous
  national_indicator: null
  source: sw_business_demography
  notes:
    en: 'Business birth rate: new enterprises in 2025 as a share of active enterprises. Volatile from year to year.'
- id: business_survival
  name:
    en: New businesses still going after 3 years
    cy: Busnesau newydd sy'n dal i fynd ar ôl 3 blynedd
  cy_review: true
  unit: percent of businesses started
  format: percent
  higher_is_better: true
  strand: prosperous
  national_indicator: null
  source: sw_business_survival
  notes:
    en: Share of businesses started in 2022 that were still active in 2025. Small start-up groups in small areas make this
      volatile.
- id: self_employed
  name:
    en: Workers who are self-employed
    cy: Gweithwyr hunangyflogedig
  cy_review: true
  unit: percent of people in work aged 16 to 64
  format: percent
  higher_is_better: null
  strand: prosperous
  national_indicator: null
  source: nomis_aps
  notes:
    en: 'Self-employed people as a share of those in employment, aged 16 to 64, July 2025 to June 2026 (Annual Population
      Survey variable 74). Context only: neither high nor low is clearly better, and rural areas are high. Sample survey with
      wide margins of error.'
- id: flood_exposure
  name:
    en: Residential properties at risk of flooding, per 100 households
    cy: Eiddo preswyl mewn perygl o lifogydd, fesul 100 o aelwydydd
  cy_review: true
  unit: per 100 households
  format: percent
  higher_is_better: false
  strand: resilient
  national_indicator: null
  source: statswales_flood
  notes:
    en: Sum over rivers, sea and surface water, so a property exposed to two sources counts twice. Use for ranking and relative change, not as
      a unique property count.
- id: greenspace_access
  name:
    en: Residential properties within 300m of accessible natural green space
    cy: Eiddo preswyl o fewn 300m i fannau gwyrdd naturiol hygyrch
  cy_review: true
  unit: percent
  format: percent
  higher_is_better: true
  strand: resilient
  national_indicator: null
  source: statswales_wimd2025_la
  notes:
    en: WIMD 2025 indicator. Woodland cover is a separate measure (woodland_cover).
- id: ndvi_green
  name:
    en: Greenness around people's homes (satellite score)
    cy: Gwyrddni o gwmpas cartrefi pobl (sgôr lloeren)
  cy_review: true
  unit: score from 0 to 1
  format: decimal2
  higher_is_better: true
  strand: resilient
  national_indicator: null
  source: statswales_wimd2025_lsoa
  notes:
    en: WIMD 2025 ambient green space (vegetation index, NDVI) for each small area, averaged for the authority weighted by
      Census 2021 residents. The Wales figure is the same weighted average over all of Wales. Computed here because StatsWales
      has no authority value.
- id: woodland_cover
  name:
    en: Land covered by woodland
    cy: Tir dan goetir
  cy_review: true
  unit: percent of land area
  format: percent
  higher_is_better: true
  strand: resilient
  national_indicator: null
  source: fc_nfi_gb_2024
  notes:
    en: Forestry Commission National Forest Inventory GB 2024 map, woodland category only (includes felled areas and young
      trees awaiting restocking, as the inventory does). Woodland polygons were clipped exactly to each council's boundary
      at the high water mark and divided by its area. The map records woods of about half a hectare or more, so small copses,
      hedgerows and street trees are not counted. Wales value is the summed woodland area over the summed council area, 312,300
      ha or 15.0 percent, matching Forestry Statistics 2025 (313,000 ha, 15 percent).
- id: ancient_woodland
  name:
    en: Land covered by ancient woodland
    cy: Tir dan goetir hynafol
  cy_review: true
  unit: percent of land area
  format: percent
  higher_is_better: true
  strand: resilient
  national_indicator: null
  source: nrw_ancient_woodland
  notes:
    en: Woods that have stood since at least 1600, from the Ancient Woodland Inventory 2021. Computed as the area of inventory
      polygons inside each authority divided by its land area (local authority boundaries at the high water mark). Counts
      ancient semi-natural woodland and replanted ancient sites together. Separate from the woodland cover measure.
- id: sssi_land
  name:
    en: Land protected as a Site of Special Scientific Interest
    cy: Tir a warchodir fel Safle o Ddiddordeb Gwyddonol Arbennig
  cy_review: true
  unit: percent of land area
  format: percent
  higher_is_better: true
  strand: resilient
  national_indicator: null
  source: nrw_sssi
  notes:
    en: All 1,088 SSSIs in the NRW layer, merged where they overlap and clipped to each council's land at the high water mark,
      so the intertidal and estuary parts of coastal sites are left out (226,100 ha of the 267,800 ha designated). A designation,
      not a measure of the sites' condition. Wales value is the summed protected area over the summed council area.
- id: protected_landscape
  name:
    en: Land in a National Park or National Landscape
    cy: Tir mewn Parc Cenedlaethol neu Dirwedd Genedlaethol
  cy_review: true
  unit: percent of land area
  format: percent
  higher_is_better: true
  strand: resilient
  national_indicator: null
  source: nrw_protected_landscapes
  notes:
    en: The three National Parks and the five National Landscapes (the new name for Areas of Outstanding Natural Beauty) in
      Wales, merged and clipped to each council's boundary at the high water mark. The English half of the Wye Valley falls
      outside Wales and is dropped. National Parks cover 19.5 percent of Wales and National Landscapes 4.8 percent, 24.3 percent
      together. Nine councils have none or almost none, which is true but leaves a flat bottom on the map. A landscape designation,
      not a measure of nature's health.
- id: river_good_status
  name:
    en: River length in good health
    cy: Hyd afonydd mewn cyflwr da
  cy_review: true
  unit: percent of river length
  format: percent
  higher_is_better: true
  strand: resilient
  national_indicator: null
  source: nrw_wfd_rivers_2021
  notes:
    en: Share of the length of river water bodies inside each council at good or high overall status under the Water Framework
      Directive, Cycle 3 baseline classification (assessed 2021, published 2023). Status is judged for a whole water body,
      which can cross council lines, so this is a length share, not a council assessment. Councils with little river length
      (Cardiff 45 km, Blaenau Gwent 40 km, Merthyr Tydfil 51 km, Torfaen 53 km, Newport 54 km) all score 0 because each of
      their rivers is moderate or worse. Wales value is by length (44.7 percent); by count of water bodies it is 43.9 percent
      (315 of 717). The 2024 interim classification is not used because its layer states no licence.
- id: no2_pop
  name:
    en: Nitrogen dioxide in the air (traffic fumes)
    cy: Nitrogen deuocsid yn yr aer (mygdarth traffig)
  cy_review: true
  unit: micrograms per cubic metre
  format: decimal1
  higher_is_better: false
  strand: resilient
  national_indicator: null
  source: statswales_air_quality
  notes:
    en: Yearly average for 2024, modelled on a 1 km grid and averaged across the people who live in each authority. Modelled,
      not measured at one spot. Defra is the data provider.
- id: pm25_pop
  name:
    en: Tiny dust particles in the air (PM2.5)
    cy: Gronynnau llwch bach yn yr aer (PM2.5)
  cy_review: true
  unit: micrograms per cubic metre
  format: decimal1
  higher_is_better: false
  strand: resilient
  national_indicator: null
  source: statswales_air_quality
  notes:
    en: Yearly average for 2024, modelled on a 1 km grid and averaged across the people who live in each authority. Modelled,
      not measured at one spot. Defra is the data provider.
- id: noise_exposed
  name:
    en: People living with road, rail or industry noise
    cy: Pobl sy'n byw gyda sŵn ffyrdd, rheilffyrdd neu ddiwydiant
  cy_review: true
  unit: percent of residents
  format: percent
  higher_is_better: false
  strand: resilient
  national_indicator: null
  source: statswales_wimd2025_lsoa
  notes:
    en: WIMD 2025, from strategic noise mapping that covers main roads, railways and large towns only. Weighted by Census
      2021 residents from small areas, so the authority and Wales figures are shares of people. Computed here because StatsWales
      has no authority value.
- id: life_exp
  name:
    en: Life expectancy at birth
    cy: Disgwyliad oes adeg geni
  cy_review: true
  unit: years
  format: years
  higher_is_better: true
  strand: healthier
  national_indicator: null
  source: ons_life_expectancy_local
  notes:
    en: 2022 to 2024. Simple mean of male and female. Healthy life expectancy is a separate measure (healthy_life_exp).
- id: healthy_life_exp
  name:
    en: Healthy life expectancy at birth
    cy: Disgwyliad oes iach adeg geni
  cy_review: true
  unit: years
  format: years
  higher_is_better: true
  strand: healthier
  national_indicator: null
  source: ons_hle_local
  notes:
    en: 2022 to 2024. Years a baby born now can expect to live in good health. Simple mean of the male and female figures,
      as for life_exp (also used for the Wales value). ONS uses a modelled method for local health because survey samples
      have shrunk, and the 95 percent confidence ranges are wide in small areas.
- id: premature_deaths
  name:
    en: Deaths before age 75
    cy: Marwolaethau cyn 75 oed
  cy_review: true
  unit: per 100,000 people
  format: integer
  higher_is_better: false
  strand: healthier
  national_indicator: null
  source: statswales_wimd2025_la
  notes:
    en: WIMD 2025, deaths registered 2015 to 2024. Rate per 100,000 people, indirectly standardised for age and sex so areas
      with older populations are not penalised.
- id: bad_health
  name:
    en: Residents in bad or very bad health
    cy: Trigolion mewn iechyd gwael neu wael iawn
  cy_review: true
  unit: percent of residents
  format: percent
  higher_is_better: false
  strand: healthier
  national_indicator: null
  source: nomis_census_ts037
  notes:
    en: Census 2021, self-reported general health. Strongly shaped by how old the population is.
- id: disabled_limited_lot
  name:
    en: Residents whose daily activities are limited a lot by a health problem
    cy: Trigolion y mae problem iechyd yn cyfyngu llawer ar eu gweithgareddau dyddiol
  cy_review: true
  unit: percent of residents
  format: percent
  higher_is_better: false
  strand: healthier
  national_indicator: null
  source: nomis_census_ts038
  notes:
    en: Census 2021, disabled under the Equality Act with day-to-day activities limited a lot. Strongly shaped by age; overlaps
      bad_health.
- id: gp_chronic
  name:
    en: People with a long-term condition on GP records
    cy: Pobl sydd â chyflwr hirdymor ar gofnodion meddyg teulu
  cy_review: true
  unit: percent of people
  format: percent
  higher_is_better: false
  strand: healthier
  national_indicator: null
  source: statswales_wimd2025_la
  notes:
    en: WIMD 2025 (GP records). Shaped by age and by how conditions are recorded.
- id: gp_mental_health
  name:
    en: People with a mental health condition on GP records
    cy: Pobl sydd â chyflwr iechyd meddwl ar gofnodion meddyg teulu
  cy_review: true
  unit: percent of people
  format: percent
  higher_is_better: false
  strand: healthier
  national_indicator: null
  source: statswales_wimd2025_la
  notes:
    en: WIMD 2025 (GP records). Partly reflects how often people see a GP and how GPs record, not only how many people are
      unwell.
- id: cancer_incidence
  name:
    en: New cancer cases
    cy: Achosion newydd o ganser
  cy_review: true
  unit: per 100,000 people
  format: integer
  higher_is_better: false
  strand: healthier
  national_indicator: null
  source: statswales_wimd2025_la
  notes:
    en: WIMD 2025, rate per 100,000 people. Partly reflects age and how much screening finds.
- id: low_birth_weight
  name:
    en: Babies born at low birth weight
    cy: Babanod a anwyd â phwysau geni isel
  cy_review: true
  unit: percent of single live births
  format: percent
  higher_is_better: false
  strand: healthier
  national_indicator: null
  source: statswales_wimd2025_la
  notes:
    en: WIMD 2025, single live births under 2.5 kg, years pooled. Small numbers in small areas.
- id: immunised_age4
  name:
    en: Children fully immunised by their fourth birthday
    cy: Plant wedi'u imiwneiddio'n llawn erbyn eu pedwerydd pen-blwydd
  cy_review: true
  unit: percent of children
  format: percent
  higher_is_better: true
  strand: healthier
  national_indicator: null
  source: statswales_immunisation
  notes:
    en: School year 2025-26, all areas (Flying Start and other areas combined). Welsh Government figures built from NHS immunisation
      records.
- id: suicide_rate
  name:
    en: Suicide rate
    cy: Cyfradd hunanladdiad
  cy_review: true
  unit: per 100,000 people
  format: decimal1
  higher_is_better: false
  strand: healthier
  national_indicator: null
  source: ons_suicides_la
  notes:
    en: 'Deaths registered 2023 to 2025, age-standardised rate for all ages and both sexes. ONS marks rates from small counts
      as less reliable. Sensitive topic: the owner may prefer to leave it out of the game.'
- id: drug_deaths
  name:
    en: Deaths from drug poisoning
    cy: Marwolaethau o wenwyno gan gyffuriau
  cy_review: true
  unit: per 100,000 people
  format: decimal1
  higher_is_better: false
  strand: healthier
  national_indicator: null
  source: ons_drug_deaths_la
  notes:
    en: 'Deaths registered 2023 to 2025, age-standardised rate, all drug poisoning (the drug misuse subset is hidden for Anglesey
      so is not used). Sensitive topic: the owner may prefer to leave it out of the game.'
- id: unpaid_care_20h
  name:
    en: Residents giving 20 or more hours of unpaid care a week
    cy: Trigolion sy'n rhoi 20 awr neu fwy o ofal di-dâl yr wythnos
  cy_review: true
  unit: percent of residents aged 5+
  format: percent
  higher_is_better: null
  strand: healthier
  national_indicator: null
  source: nomis_census_ts039
  notes:
    en: 'Census 2021, residents aged 5 and over. Context with no direction: caring is valuable but also a sign of need and
      pressure.'
- id: age65
  name:
    en: Share aged 65 and over
    cy: Cyfran 65 oed a throsodd
  cy_review: true
  unit: percent of residents
  format: percent
  higher_is_better: false
  strand: healthier
  national_indicator: null
  source: nomis_mye
  notes:
    en: Mid-2025. Feeds care_pressure in the game.
- id: deprivation
  name:
    en: Small areas in the most deprived fifth of Wales
    cy: Ardaloedd bach yn y bumed rhan fwyaf difreintiedig o Gymru
  cy_review: true
  unit: percent of LSOAs
  format: percent
  higher_is_better: false
  strand: equal
  national_indicator: null
  source: wimd_2025
  notes:
    en: WIMD 2025 overall rank, 1917 LSOAs. Wales value is 20 by construction.
- id: deprivation_10
  name:
    en: Small areas in the most deprived tenth of Wales
    cy: Ardaloedd bach yn y ddegfed ran fwyaf difreintiedig o Gymru
  cy_review: true
  unit: percent of LSOAs
  format: percent
  higher_is_better: false
  strand: equal
  national_indicator: null
  source: wimd_2025
  notes:
    en: WIMD 2025 decile 1. Wales value is 10 by construction.
- id: income_deprivation
  name:
    en: People on a very low income
    cy: Pobl ar incwm isel iawn
  cy_review: true
  unit: percent of people
  format: percent
  higher_is_better: false
  strand: equal
  national_indicator: null
  source: statswales_wimd2025_la
  notes:
    en: WIMD 2025 indicator, people in income deprivation (in households on means tested benefits or tax credits, below a
      low income line). Source years vary by benefit but are mostly 2023 to 2024.
- id: child_low_income
  name:
    en: Children in low income families
    cy: Plant mewn teuluoedd incwm isel
  cy_review: true
  unit: percent of children under 16
  format: percent
  higher_is_better: false
  strand: equal
  national_indicator: null
  source: dwp_children_low_income
  notes:
    en: Children under 16 in relative low income families, before housing costs, financial year ending 2025. Local figures
      are modelled from a national survey, so small gaps between areas are not reliable. The Wales value is the DWP figure
      for Wales.
- id: older_income_deprivation
  name:
    en: Older people on a very low income
    cy: Pobl hŷn ar incwm isel iawn
  cy_review: true
  unit: percent of older people
  format: percent
  higher_is_better: false
  strand: equal
  national_indicator: null
  source: statswales_wimd2025_la
  notes:
    en: WIMD 2025 indicator, older people in income deprivation (people aged 60 and over on means tested benefits such as
      Pension Credit). Not everyone who is entitled claims Pension Credit, so the true figure is likely higher.
- id: free_school_meals
  name:
    en: Pupils who can get free school meals
    cy: Disgyblion sy'n gymwys i gael prydau ysgol am ddim
  cy_review: true
  unit: percent of pupils
  format: percent
  higher_is_better: false
  strand: equal
  national_indicator: null
  source: statswales_fsm
  notes:
    en: Pupils eligible for free school meals on the means test (a household income test), 2025/26 school year. Free meals
      for all primary pupils do not change this figure, but fewer families may be applying for the means test now.
- id: hh_deprived_2plus
  name:
    en: Households short in two or more ways
    cy: Aelwydydd dan anfantais mewn dwy ffordd neu fwy
  cy_review: true
  unit: percent of households
  format: percent
  higher_is_better: false
  strand: equal
  national_indicator: null
  source: nomis_census_ts011
  notes:
    en: Census 2021. A household is short in a way if no one has a school qualification at level 2, or someone is out of work
      through illness or disability, or someone has bad health or a disability, or the home is overcrowded, shared or has
      no central heating. This counts households short in two, three or four of those ways.
- id: low_pay_hourly
  name:
    en: Hourly pay of the lowest paid fifth of workers
    cy: Cyflog yr awr y bumed ran isaf o weithwyr
  cy_review: true
  unit: GBP per hour
  format: decimal2
  higher_is_better: true
  strand: equal
  national_indicator: null
  source: nomis_ashe
  notes:
    en: ASHE 2026, 20th percentile of gross hourly pay for full-time workers by place of residence. One in five full-time
      workers earns less than this. Part-time workers are not included. Sample based, so small differences between areas are
      not reliable.
- id: poor_housing
  name:
    en: Poor quality housing
    cy: Tai o ansawdd gwael
  cy_review: true
  unit: percent of residential properties
  format: percent
  higher_is_better: false
  strand: equal
  national_indicator: null
  source: statswales_wimd2025_la
  notes:
    en: WIMD 2025 indicator. Stands in for housing quality / EPC band, which has no open LA table.
- id: daf_payments
  name:
    en: Emergency cash grants paid
    cy: Grantiau arian brys a dalwyd
  cy_review: true
  unit: payments per 1,000 people
