- id: fc_nfi_gb_2024
  title: National Forest Inventory GB 2024 woodland map, with local authority boundaries
  publisher: Forestry Commission (Forestry Commission open data hub); boundaries from Welsh Government via DataMapWales
  url: https://data-forestry.opendata.arcgis.com/datasets/5a3efa283e81431b911b5c9872527ca5_0
  api_url: https://services2.arcgis.com/mHXjwgl3OARRqqD4/arcgis/rest/services/National_Forest_Inventory_GB_2024/FeatureServer/0/query
    (CATEGORY='Woodland', outSR 27700); boundaries https://datamap.gov.wales/geoserver/ows (typeNames inspire-wg:localauthorities)
  licence: Open Government Licence v3.0
  licence_url: https://data-forestry.opendata.arcgis.com/datasets/5a3efa283e81431b911b5c9872527ca5_0
  accessed: '2026-11-27'
  notes: The dataset's licence field reads "Use of this data is subject to the Open Government Licence" and asks for the
    attribution "© Forestry Commission copyright. Contains Ordnance Survey data © Crown copyright and database right 2025."
    65,608 woodland polygons that touch Wales (1,530 tagged England near the border) were fetched in British National
    Grid and clipped exactly to the 22 council boundaries (mean high water) with shapely. Wales total 312,300 ha against
    313,000 ha in Forestry Statistics 2025.
