- id: statswales_wimd2025_lsoa
  title: WIMD 2025 indicator data for lower layer super output areas (ambient green space, noise)
  publisher: Welsh Government via StatsWales, from NRW and Ordnance Survey data (green space) and strategic noise mapping
  url: https://stats.gov.wales/en-GB/2f8dfe38-bfa8-4f61-bc34-1d84d470a940
  api_url: https://api.stats.gov.wales/v2/2f8dfe38-bfa8-4f61-bc34-1d84d470a940/data
  licence: Open Government Licence v3.0 (Welsh Government, via the gov.wales copyright statement; the StatsWales dataset page states no licence of its own)
  licence_url: https://www.gov.wales/copyright-statement
  accessed: '2026-11-27'
  notes: Source of ndvi_green and noise_exposed. The authority rows in this dataset are empty (Not available) for these indicators, so values are small area (1917 LSOA) values averaged to authority and Wales, weighted by Census 2021 usual residents from Nomis NM_2028_1.
- id: statswales_flytipping
