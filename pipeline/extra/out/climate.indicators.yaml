- id: recycling_rate
  name:
    en: 'Council waste that is recycled, reused or composted'
    cy: 'Gwastraff y cyngor sy''n cael ei ailgylchu, ei ailddefnyddio neu ei gompostio'
  cy_review: true
  unit: 'percent of municipal waste'
  format: percent
  higher_is_better: true
  strand: global
  national_indicator: null
  source: statswales_waste_la
  notes:
    en: '2024-25. Statutory target measure for local authority municipal waste (household and non-household waste the council collects). All authorities are high, so the spread is narrow (about 62 to 74 percent). Wales value as published.'
- id: residual_waste_head
  name:
    en: 'Rubbish per person that is not recycled'
    cy: 'Sbwriel y pen nad yw''n cael ei ailgylchu'
  cy_review: true
  unit: 'kg per person per year'
  format: integer
  higher_is_better: false
  strand: global
  national_indicator: null
  source: statswales_residual_waste
  notes:
    en: '2024-25. Residual household waste (the black bag rubbish sent for disposal) per person, in kilograms a year. Measures producing less waste, where the recycling rate only measures sorting it. Wales value as published.'
- id: plug_in_cars
  name:
    en: 'Privately owned cars that plug in'
    cy: 'Ceir preifat sy''n plygio i mewn'
  cy_review: true
  unit: 'percent of private cars'
  format: percent
  higher_is_better: true
  strand: global
  national_indicator: null
  source: dft_vehicle_licensing
  notes:
    en: 'End of June 2026. Battery electric, plug-in hybrid and range-extended cars as a share of all privately kept licensed cars. Company cars are left out because they are registered at the address of the leasing firm, which inflates places such as Bridgend and Swansea. Wales value as published in the same tables.'
- id: ev_chargers
  name:
    en: 'Public electric car charging points'
    cy: 'Pwyntiau gwefru ceir trydan cyhoeddus'
  cy_review: true
  unit: 'devices per 100,000 people'
  format: integer
  higher_is_better: true
  strand: global
  national_indicator: null
  source: dft_evci
  notes:
    en: '1 October 2026. Publicly available charging devices working at that date, per 100,000 residents (ONS mid-2024 population, as used by DfT). Rural and tourist areas score high because they have few residents per charger. Wales value is the sum of the 22 authorities over their summed population, worked out from the DfT counts and rates.'
- id: ev_chargers_rapid
  name:
    en: 'Rapid public charging points'
    cy: 'Pwyntiau gwefru cyflym cyhoeddus'
  cy_review: true
  unit: 'devices per 100,000 people'
  format: integer
  higher_is_better: true
  strand: global
  national_indicator: null
  source: dft_evci
  notes:
    en: '1 October 2026. Rapid and ultra-rapid chargers (50 kW or more) per 100,000 residents. These are the chargers that fill a battery in the time of a coffee stop, and tend to sit on main roads. Wales value computed as for ev_chargers.'
- id: heat_pumps
  name:
    en: 'Heat pumps per 1,000 homes'
    cy: 'Pympiau gwres fesul 1,000 o gartrefi'
  cy_review: true
  unit: 'heat pump projects per 1,000 dwellings'
  format: decimal1
  higher_is_better: true
  strand: global
  national_indicator: null
  source: statswales_heat_pumps
  notes:
    en: '2024. Heat pump projects in the Welsh Government low carbon energy projects data (domestic and non-domestic, some small ones estimated), divided by the dwelling stock at 31 March 2024. Counts all projects, so a business heat pump adds to the figure. High values in rural Ceredigion and Powys partly reflect homes off the gas grid. Wales value is the published Wales count over the Wales dwelling stock.'
- id: home_energy_efficiency
  name:
    en: 'How well homes keep their heat in'
    cy: 'Pa mor dda mae cartrefi yn cadw eu gwres'
  cy_review: true
  unit: 'average SAP score (0 to 100, higher is better)'
  format: decimal1
  higher_is_better: true
  strand: global
  national_indicator: null
  source: statswales_wimd2025_la
  notes:
    en: 'WIMD 2025 (source data from the early 2020s). Average Standard Assessment Procedure score of residential properties. Modelled for all homes, so it does not depend on which homes have had an energy certificate. Wales value as published.'
- id: gas_use_median
  name:
    en: 'Gas used by a typical home'
    cy: 'Nwy a ddefnyddir gan gartref cyffredin'
  cy_review: true
  unit: 'kWh per gas meter per year'
  format: integer
  higher_is_better: false
  strand: global
  national_indicator: null
  source: desnz_gas_la
  notes:
    en: '2024. Median domestic gas use per meter, corrected for the weather so years compare fairly. Only covers homes on the gas grid, so read it alongside off_gas_grid. Colder, older and larger homes use more. Wales value as published.'
- id: off_gas_grid
  name:
    en: 'Homes not connected to mains gas'
    cy: 'Cartrefi heb eu cysylltu â nwy prif gyflenwad'
  cy_review: true
  unit: 'percent of homes'
  format: percent
  higher_is_better: null
  strand: global
  national_indicator: null
  source: desnz_off_gas_la
  notes:
    en: '2024. Estimated share of homes with no mains gas, from meter counts and address counts. No direction: these homes often burn oil or coal, which is bad for carbon, but they are also the easiest to move straight to heat pumps. High in rural Wales. Wales value as published.'
- id: drive_to_work
  name:
    en: 'Commuters who drive to work'
    cy: 'Cymudwyr sy''n gyrru i''r gwaith'
  cy_review: true
  unit: 'percent of workers who travel to work'
  format: percent
  higher_is_better: false
  strand: global
  national_indicator: null
  source: nomis_census_ts061
  notes:
    en: 'Census 2021 (taken in March 2021 during pandemic restrictions, so ONS advises caution). Usual residents aged 16 and over in work who drive a car or van, as a share of those in work who do not mainly work from home. Wales value computed the same way from the published Wales counts.'
- id: home_transport_emissions
  name:
    en: 'Greenhouse gases from homes and travel, per person'
    cy: 'Nwyon tŷ gwydr o gartrefi a theithio, y pen'
  cy_review: true
  unit: 'tonnes CO2e per person'
  format: decimal1
  higher_is_better: false
  strand: global
  national_indicator: null
  source: desnz_la_ghg
  notes:
    en: '2024. Territorial emissions from the Domestic and Transport sectors only, divided by mid-year population. Leaves out industry, farming and land use, so it avoids the Neath Port Talbot steelworks distortion in emissions_head. Transport includes through-traffic on motorways and trunk roads, so Monmouthshire and Powys read high. Wales value is the sum of the 22 authorities over their population.'
