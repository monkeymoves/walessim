<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carthen: Wales, woven</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Besley:ital,wght@0,400..800;1,400..800&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap&subset=latin-ext" rel="stylesheet">
<style>
/* Carthen: the Welsh blanket. One palette, defined once. */
:root{
  /* dyed yarns of the traditional colour set */
  --madder:#A9342B;
  --madder-bright:#C8473A;
  --mustard:#D0A036;
  --bottle:#1F4D3C;
  --navy:#1B2C47;
  --navy-deep:#132036;
  --oatmeal:#E8DFCB;
  --cream:#F3EDDF;
  --charcoal:#252528;
  --flannel:#2E2E33;
  --flannel-light:#3B3B41;
  --slate:#66717F;
  --heather:#8C5F78;
  --ink:#1E2126;
  --ink-soft:#4A4B4F;
  /* seven strands, seven yarns */
  --s-prosperous:#D9A93C;
  --s-resilient:#5FA57C;
  --s-healthier:#D4594B;
  --s-equal:#B683A3;
  --s-cohesive:#6E9BD0;
  --s-culture:#DD8246;
  --s-global:#57B0AC;
  --display:"Besley", Georgia, serif;
  --text:"Instrument Sans", "Helvetica Neue", sans-serif;
  --leftw:304px;
  --cardw:232px;
  --pad:16px;
}
@media (max-width:1380px){ :root{ --leftw:278px; --cardw:214px; --pad:12px; } }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--navy-deep);color:var(--cream);
  font-family:var(--text);font-size:13px;line-height:1.4;
  display:grid;grid-template-rows:60px 1fr 84px;
  min-width:1240px;min-height:760px;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--mustard);outline-offset:2px}

/* ---------- top bar: charcoal flannel ---------- */
.flannel{
  background-color:var(--flannel);
  background-image:
    repeating-linear-gradient(45deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(-45deg, rgba(0,0,0,.10) 0 1px, transparent 1px 3px);
}
#top{
  display:flex;align-items:stretch;gap:22px;padding:0 var(--pad);
  position:relative;z-index:5;
  border-bottom:1px solid #111;
}
/* selvedge: a narrow woven stripe where the bar meets the cloth */
#top::after{
  content:"";position:absolute;left:0;right:0;bottom:-5px;height:5px;
  background:
    linear-gradient(var(--oatmeal),var(--oatmeal)) 0 1px/100% 1px no-repeat,
    linear-gradient(var(--madder),var(--madder)) 0 3px/100% 1px no-repeat,
    var(--charcoal);
}
.mark{display:flex;align-items:center;gap:10px;padding-right:20px;border-right:1px dashed rgba(232,223,203,.28)}
.mark i{width:26px;height:26px;display:block;background-size:26px 26px;image-rendering:pixelated;outline:1px solid rgba(0,0,0,.5)}
.mark b{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.01em}
.when{display:flex;align-items:center;gap:12px;white-space:nowrap}
.when .year{font-family:var(--display);font-weight:600;font-size:34px;line-height:1;color:var(--cream);font-variant-numeric:lining-nums}
.when .term{font-size:12.5px;line-height:1.35;color:#D9D1BF}
.when .term b{display:block;color:var(--cream);font-weight:600}
#strands{flex:1;display:flex;align-items:center;justify-content:space-between;gap:20px;
  padding-left:18px;border-left:1px dashed rgba(232,223,203,.28);min-width:0}
.strand{flex:1 1 0;min-width:0;cursor:default;padding:4px 0}
.strand .s-name{display:block;font-size:11.5px;font-weight:500;color:#E6DECC;white-space:nowrap}
.strand .s-row{display:flex;align-items:center;gap:9px;margin-top:3px}
.strand .s-val{font-family:var(--display);font-size:14px;line-height:1;font-weight:600;display:flex;align-items:center;gap:3px;color:var(--cream);font-variant-numeric:lining-nums}
.strand svg{display:block}
/* the meter is a length of yarn laid on an unwoven guide thread */
.s-thread{position:relative;height:9px;flex:1}
.s-thread::before{content:"";position:absolute;left:0;right:0;top:4px;border-top:1px dotted rgba(232,223,203,.42)}
.s-thread i{position:absolute;left:0;top:1.5px;height:6px;border-radius:3px;background-color:var(--c);
  background-image:repeating-linear-gradient(115deg, rgba(0,0,0,.26) 0 1.2px, transparent 1.2px 4px);
  box-shadow:0 1px 0 rgba(0,0,0,.45)}
.s-thread i::after{content:"";position:absolute;right:-4px;top:-2px;width:10px;height:10px;border-radius:50%;
  background:var(--c);box-shadow:inset -2px -2px 0 rgba(0,0,0,.25), 0 1px 0 rgba(0,0,0,.45)}
.lang{display:flex;align-items:center;gap:0;align-self:center;border:1px solid rgba(232,223,203,.5);border-radius:2px}
.lang button{background:none;border:0;padding:5px 10px;font-weight:600;font-size:12px;cursor:pointer;color:#D9D1BF}
.lang button[aria-pressed="true"]{background:var(--oatmeal);color:var(--ink)}

/* ---------- stage ---------- */
#stage{position:relative;overflow:hidden;background:var(--navy)}
#cloth,#over{position:absolute;inset:0;width:100%;height:100%;display:block}
#over text{font-family:var(--text)}
#left{position:absolute;left:var(--pad);top:calc(var(--pad) + 5px);bottom:var(--pad);width:var(--leftw);
  display:flex;flex-direction:column;gap:14px;z-index:2}
#right{position:absolute;right:var(--pad);top:calc(var(--pad) + 5px);bottom:var(--pad);
  width:calc(var(--cardw) * 2 + 12px);z-index:2;display:flex;flex-direction:column}

/* woven label: oatmeal cloth with a line of running stitch inside the edge */
.label{
  position:relative;color:var(--ink);
  background-color:var(--oatmeal);
  background-image:
    repeating-linear-gradient(0deg, rgba(70,55,30,.055) 0 1px, transparent 1px 2px),
    repeating-linear-gradient(90deg, rgba(70,55,30,.04) 0 1px, transparent 1px 2px);
  box-shadow:0 2px 0 rgba(0,0,0,.35), 0 0 0 1px rgba(0,0,0,.35);
}
.label::before{content:"";position:absolute;inset:5px;border:1px dashed rgba(37,37,40,.42);pointer-events:none}

/* place panel */
#place{padding:18px 20px 16px;margin-top:auto;display:flex;flex-direction:column}
#place .kicker{font-size:11.5px;color:var(--ink-soft);display:flex;align-items:center;gap:7px}
#place .kicker i{width:18px;height:0;border-top:2.5px solid var(--madder);display:block}
#place h2{font-family:var(--display);font-weight:700;font-size:23px;line-height:1.1;margin:7px 0 2px;letter-spacing:-.01em;white-space:nowrap}
#place .other{font-family:var(--display);font-style:italic;font-size:14px;color:var(--ink-soft)}
.figs{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:13px 0 4px;border-top:1px solid rgba(37,37,40,.5);border-bottom:1px solid rgba(37,37,40,.5)}
.fig{padding:9px 0 8px}
.fig + .fig{padding-left:13px;border-left:1px dashed rgba(37,37,40,.45)}
.fig b{font-family:var(--display);font-weight:600;font-size:25px;line-height:1;display:block;font-variant-numeric:lining-nums}
.fig span{font-size:12px;color:var(--ink-soft)}
.unver{font-size:11.5px;color:#5A4A2C;font-style:italic}
#place p.hist{font-size:13.5px;line-height:1.46;margin:11px 0 0;max-width:34em}
.prov{padding-top:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:500;color:var(--ink);
  background:var(--cream);border:1px solid rgba(37,37,40,.55);padding:4px 9px 4px 7px;border-radius:2px;cursor:pointer;text-align:left}
.chip svg{flex:none}
.conf{display:flex;flex-wrap:wrap;align-items:center;gap:3px 8px;font-size:12px;color:var(--ink)}
.conf .knots{display:flex;gap:3px}
.conf .knots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink);display:block}
.conf .knots i.on{background:var(--madder);border-color:var(--madder)}
.conf b{font-weight:600}

/* curveball: the reverse face of the double cloth */
#curve{position:relative;color:var(--cream);background-color:var(--charcoal);
  background-image:
    repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 2px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 1px, transparent 1px 2px);
  box-shadow:0 2px 0 rgba(0,0,0,.45), 0 0 0 1px rgba(0,0,0,.6);
  padding:0 0 14px}
#curve .band{height:36px;background-size:36px 36px;image-rendering:pixelated}
#curve .in{padding:11px 18px 0 20px}
#curve .kicker{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#E2B25A;font-weight:500}
#curve h3{font-family:var(--display);font-weight:600;font-size:17.5px;line-height:1.2;margin:6px 0 9px}
#curve .ripple{display:flex;align-items:center;gap:9px;font-size:12.5px;padding-top:9px;border-top:1px dashed rgba(232,223,203,.4)}

/* hand of cards */
.handhead{display:flex;justify-content:space-between;align-items:baseline;height:26px;padding:0 2px;
  font-size:12px;color:#E6DECC;text-shadow:0 1px 0 rgba(0,0,0,.6)}
.handhead b{font-family:var(--display);font-weight:600;font-size:15px;color:var(--cream)}
#hand{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px;min-height:0}
.card{display:flex;flex-direction:column;min-height:0;position:relative}
.card::before{inset:42px 5px 5px 5px}
.card .band{height:36px;flex:none;background-size:36px 36px;image-rendering:pixelated;border-bottom:1px solid rgba(0,0,0,.35)}
.card .in{padding:15px 16px 13px;display:flex;flex-direction:column;flex:1;min-height:0}
.eff.up{position:relative}
.card .ic{color:var(--ink);position:absolute;right:0;top:1px;opacity:.9}
.card h3{font-family:var(--display);font-weight:650;font-size:17.5px;line-height:1.17;margin:0 0 12px;text-wrap:balance}
.eff{font-size:12.5px;margin-bottom:10px}
.eff .h{color:var(--ink-soft);display:block;margin-bottom:3px}
.eff ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.eff li{display:flex;align-items:center;gap:7px;font-weight:500;line-height:1.3}
.eff li small{font-weight:400;font-size:11.5px;color:var(--ink-soft)}
.sw{flex:none;width:20px;height:6px;border-radius:3px;background-color:var(--c);
  background-image:repeating-linear-gradient(115deg, rgba(0,0,0,.28) 0 1.2px, transparent 1.2px 4px);
  box-shadow:0 0 0 1px rgba(0,0,0,.35)}
/* a strained thread is frayed: broken into short ends */
.sw.fray{background:none;box-shadow:none;height:6px;border-radius:0;
  background-image:linear-gradient(90deg, var(--c) 0 5px, transparent 5px 8px, var(--c) 8px 11px, transparent 11px 14px, var(--c) 14px 20px);
  background-size:20px 3px;background-repeat:no-repeat;background-position:0 1.5px;
  outline:0;filter:drop-shadow(0 0 .6px rgba(0,0,0,.9))}
.sw.plain{--c:var(--ink-soft)}
.eff.down{margin-top:auto}
.card .foot{padding-top:9px;border-top:1px solid rgba(37,37,40,.5);display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.card .foot div{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .foot b{font-weight:600}
.pips{display:inline-flex;gap:3px;align-items:center}
.pips i{width:7px;height:7px;border:1.4px solid var(--ink);display:block}
.pips i.on{background:var(--ink)}
.pips i.out{background:var(--madder);border-color:var(--madder);border-radius:50%}

@media (max-height:850px){
  #curve .band,.card .band{height:24px;background-size:24px 24px}
  .card::before{inset:30px 5px 5px 5px}
  .card .in{padding:11px 14px 10px}
  .card h3{font-size:15.5px;margin-bottom:8px}
  .eff{font-size:12px;margin-bottom:6px}
  .card .foot{font-size:12px;gap:2px;padding-top:6px}
  #place{padding:15px 18px 14px}
  #place p.hist{font-size:13px}
}

/* ---------- bottom: timeline and footer ---------- */
#bottom{position:relative;z-index:5;border-top:1px solid #111;display:flex;flex-direction:column}
#bottom::before{
  content:"";position:absolute;left:0;right:0;top:-6px;height:5px;
  background:
    linear-gradient(var(--madder),var(--madder)) 0 1px/100% 1px no-repeat,
    linear-gradient(var(--oatmeal),var(--oatmeal)) 0 3px/100% 1px no-repeat,
    var(--charcoal);
}
#time{flex:1;display:block;width:100%}
#time text{font-family:var(--text)}
#foot{height:20px;padding:0 var(--pad);font-size:11.5px;color:#C9C1AF;display:flex;justify-content:space-between;align-items:center;
  background:rgba(0,0,0,.28)}

/* tooltip: a small sewn tag */
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--cream);color:var(--ink);font-size:12px;font-weight:500;
  padding:5px 9px;border:1px solid var(--ink);box-shadow:2px 2px 0 rgba(0,0,0,.5);max-width:300px;display:none}
@media (prefers-reduced-motion:no-preference){ .s-thread i{transition:width .35s ease} }
</style>
</head>

var lang = (new URLSearchParams(location.search).get("lang") === "cy") ? "cy" : "en";

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); }

/* ================= carthen pattern tiles ================= */
/* A stepped diamond in a square, the commonest double cloth figure. 12 picks to the repeat. */
function tile(c1,c2,c3){
  var n=12, c=document.createElement("canvas"); c.width=n; c.height=n;
  var g=c.getContext("2d");
  for(var y=0;y<n;y++) for(var x=0;x<n;x++){
    var dx=Math.abs(x-5.5), dy=Math.abs(y-5.5), d=Math.floor(dx+dy), col;
    if(d<=1) col=c3;
    else if(d<=3) col=c1;
    else if(d<=5) col=c2;
    else if(dx>4.6 || dy>4.6) col=((x+y)%2)?c1:c2;
    else col=c1;
    g.fillStyle=col; g.fillRect(x,y,1,1);
  }
  return "url(" + c.toDataURL() + ")";
}

  [v("--madder"), v("--oatmeal"), v("--navy")]

/* ================= map geometry ================= */
var GW=W.width||190, GH=W.height||245, ROWS=W.elevation.rows;
var stage=document.getElementById("stage"), cloth=document.getElementById("cloth"), over=document.getElementById("over");
var M={k:3,ox:0,oy:0,w:0,h:0};
function layout(){
  var r=stage.getBoundingClientRect();
  var L=document.getElementById("left").getBoundingClientRect(), R=document.getElementById("right").getBoundingClientRect();
  M.w=Math.round(r.width); M.h=Math.round(r.height);
  var gapL=L.right-r.left, gapR=R.left-r.left, gap=gapR-gapL;
  M.k=Math.min((M.h-14)/GH, (gap-10)/GW);
  M.ox=gapL+(gap-GW*M.k)/2; M.oy=6+(M.h-12-GH*M.k)/2;
}
function px(x){ return M.ox+x*M.k; } function py(y){ return M.oy+y*M.k; }
function cell(x,y){ x=Math.floor(x); y=Math.floor(y); if(x<0||y<0||x>=GW||y>=GH) return -1; return ROWS[y][x]; }
function cls(x,y){ x=Math.floor(x); y=Math.floor(y); if(x<0||y<0) return -1; if(x>=GW) x=GW-1; if(y>=GH) y=GH-1; return ROWS[y][x]; }
function inRing(x,y,r){ var c=false; for(var i=0,j=r.length-1;i<r.length;j=i++){ var a=r[i],b=r[j]; if((a[1]>y)!==(b[1]>y) && x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0]) c=!c; } return c; }
W.las.forEach(function(l){
  var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  l.rings.forEach(function(r){ r.forEach(function(p){ if(p[0]<x0)x0=p[0]; if(p[0]>x1)x1=p[0]; if(p[1]<y0)y0=p[1]; if(p[1]>y1)y1=p[1]; }); });
  l.bb=[x0,y0,x1,y1];
});
function laAt(x,y){
  for(var i=0;i<W.las.length;i++){ var l=W.las[i], b=l.bb;
    if(x<b[0]||x>b[2]||y<b[1]||y>b[3]) continue;
    for(var j=0;j<l.rings.length;j++) if(inRing(x,y,l.rings[j])) return i; }
  return -1;
}
var SELI = W.las.indexOf(SEL);
function inSel(x,y){ var b=SEL.bb; if(x<b[0]||x>b[2]||y<b[1]||y>b[3]) return false; for(var j=0;j<SEL.rings.length;j++) if(inRing(x,y,SEL.rings[j])) return true; return false; }

/* seams: internal boundaries and the English border, each drawn once */
var SEAMS=null;
function buildSeams(){
  var runs=[];
  W.las.forEach(function(l,li){
    l.rings.forEach(function(r){
      var cur=null;
      for(var i=0;i<r.length-1;i++){
        var a=r[i], b=r[i+1], mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2;
        var dx=b[0]-a[0], dy=b[1]-a[1], n=Math.hypot(dx,dy)||1, nx=-dy/n*0.9, ny=dx/n*0.9;
        var p1=laAt(mx+nx,my+ny), p2=laAt(mx-nx,my-ny);
        var other = p1===li ? p2 : p1, keep=false;
        if(p1!==li && p2!==li){ keep=false; }
        else if(other>=0){ keep = other>li; }
        else { var ox=p1===li?mx-nx*1.6:mx+nx*1.6, oy=p1===li?my-ny*1.6:my+ny*1.6; keep = cell(ox,oy)===-2; }
        if(keep){ if(!cur){ cur=[a]; runs.push(cur); } cur.push(b); } else cur=null;
      }
    });
  });
  SEAMS=runs;
}

/* ================= the cloth ================= */
var YARN_STOPS=[0,30,90,170,260,360,470,620,820];
var YARN=["#D6CFA0","#A8BA78","#789B5B","#4A7550","#A38C48","#8E6079","#66717F","#AEB5BD","#DCDFE2"];
function hex(h){ return [parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)]; }
var YRGB=YARN.map(hex);
function band(e){ for(var i=YARN_STOPS.length-1;i>=0;i--){ if(e>=YARN_STOPS[i]){ if(i===YARN_STOPS.length-1) return i; return i+(e-YARN_STOPS[i])/(YARN_STOPS[i+1]-YARN_STOPS[i]); } } return 0; }
function hash(i,j){ var n=Math.sin(i*127.1+j*311.7)*43758.5453; return n-Math.floor(n); }
function shade(c,f){ return "rgb("+Math.max(0,Math.min(255,c[0]*f|0))+","+Math.max(0,Math.min(255,c[1]*f|0))+","+Math.max(0,Math.min(255,c[2]*f|0))+")"; }
function lift(c,a){ return [c[0]+(255-c[0])*a, c[1]+(255-c[1])*a, c[2]+(255-c[2])*a]; }

function drawCloth(){
  var dpr=Math.max(1,Math.round(window.devicePixelRatio||1));
  cloth.width=M.w*dpr; cloth.height=M.h*dpr;
  var g=cloth.getContext("2d");
  var P=5, p=P*dpr;                      /* thread pitch */
  var B=2;                               /* threads per woven square */
  var cols=Math.ceil(M.w/P)+1, rows=Math.ceil(M.h/P)+1;
  var bc=Math.ceil(cols/B), br=Math.ceil(rows/B);
  /* phase the weave so squares sit on whole km near the map origin */
  var offx=((M.ox%(P*B))+(P*B))%(P*B)-(P*B), offy=((M.oy%(P*B))+(P*B))%(P*B)-(P*B);
  var bk=P*B/M.k;                        /* km per woven square */
  /* per square: mean land height, and class */
  var bE=new Float32Array((bc+1)*(br+1)), bLand=new Uint8Array((bc+1)*(br+1));
  var bi,bj,x,y;
  for(bj=0;bj<=br;bj++) for(bi=0;bi<=bc;bi++){
    var kx0=(offx+bi*P*B-M.ox)/M.k, ky0=(offy+bj*P*B-M.oy)/M.k, s=0,n=0;
    for(y=Math.floor(ky0);y<ky0+bk;y++) for(x=Math.floor(kx0);x<kx0+bk;x++){ var e=cell(x+.5,y+.5); if(e>=0){ s+=e; n++; } }
    bE[bj*(bc+1)+bi]= n? s/n : 0; bLand[bj*(bc+1)+bi]= n?1:0;
  }
  var raw=bE.slice();
  for(bj=1;bj<br;bj++) for(bi=1;bi<bc;bi++){
    var c0=bj*(bc+1)+bi; if(!bLand[c0]) continue;
    var ss=0, nn=0, nb=[c0-1,c0+1,c0-bc-1,c0+bc+1];
    for(var q0=0;q0<4;q0++) if(bLand[nb[q0]]){ ss+=raw[nb[q0]]; nn++; }
    if(nn) bE[c0]=raw[c0]*0.6+ss/nn*0.4;
  }
  /* distance from land in squares, for the shallows */
  var dist=new Uint8Array((bc+1)*(br+1)); dist.fill(9);
  for(var pass=0;pass<4;pass++) for(bj=0;bj<=br;bj++) for(bi=0;bi<=bc;bi++){
    var id=bj*(bc+1)+bi;
    if(bLand[id]){ dist[id]=0; continue; }
    var m=dist[id];
    if(bi>0) m=Math.min(m,dist[id-1]+1); if(bi<bc) m=Math.min(m,dist[id+1]+1);
    if(bj>0) m=Math.min(m,dist[id-bc-1]+1); if(bj<br) m=Math.min(m,dist[id+bc+1]+1);
    dist[id]=m;
  }
  var SEA_WARP=hex("#24406A"), SEA_WEFT=hex("#1A2E4D"), SHAL=hex("#3F6792");
  var OUT_WARP=hex("#3A4352"), OUT_WEFT=hex("#313947");
  g.fillStyle="#1B2C47"; g.fillRect(0,0,cloth.width,cloth.height);
  for(var j=0;j<rows;j++) for(var i=0;i<cols;i++){
    var cx=offx+(i+.5)*P, cy=offy+(j+.5)*P;
    var kx=(cx-M.ox)/M.k, ky=(cy-M.oy)/M.k;
    var e0=cell(kx,ky); if(e0<0) e0=cls(kx,ky);
    bi=Math.floor(i/B); bj=Math.floor(j/B);
    var bid=bj*(bc+1)+bi;
    var warpUp, col, f=1;
    if(e0>=0){
      warpUp=((i+j)&1)===0;
      var eb=bLand[bid]?bE[bid]:e0;
      var t=band(eb);
      var q=warpUp?Math.floor(t+0.25):Math.floor(t+0.75);
      if(q>YRGB.length-1) q=YRGB.length-1;
      col=YRGB[q];
      /* light from the north west gives the hills a little body */
      var eL=(bi>0&&bj>0&&bLand[bid-bc-2])?bE[bid-bc-2]:eb, eR=(bLand[bid+bc+2])?bE[bid+bc+2]:eb;
      f=1+Math.max(-.10,Math.min(.09,(eL-eR)/1100));
      if(inSel(kx,ky)){ col=lift(col,.13); f*=1.10; } else f*=0.94;
      f*=0.975+hash(i,j)*0.05;
    } else if(e0===-2){
      warpUp=((i+j)&1)===0; col=warpUp?OUT_WARP:OUT_WEFT; f=0.96+hash(i,j)*0.08;
    } else {
      warpUp=((i+j)&3)<2;
      col=warpUp?SEA_WARP:SEA_WEFT;
      var dd=dist[bid];
      if(dd<=1) col=[ (col[0]+SHAL[0]*1.4)/2.4, (col[1]+SHAL[1]*1.4)/2.4, (col[2]+SHAL[2]*1.4)/2.4 ];
      else if(dd<=3) col=[ (col[0]*2+SHAL[0])/3, (col[1]*2+SHAL[1])/3, (col[2]*2+SHAL[2])/3 ];
      f=0.97+hash(i,j)*0.06;
    }
    var X=Math.round((offx+i*P)*dpr), Y=Math.round((offy+j*P)*dpr);
    g.fillStyle=shade(col,f); g.fillRect(X,Y,p,p);
    /* thread modelling: dark where it turns under, light along its crown */
    if(warpUp){
      g.fillStyle="rgba(0,0,0,.26)"; g.fillRect(X,Y,dpr,p); g.fillRect(X+p-dpr,Y,dpr,p);
      g.fillStyle="rgba(255,255,255,.10)"; g.fillRect(X+2*dpr,Y,dpr,p);
      g.fillStyle="rgba(0,0,0,.10)"; g.fillRect(X+dpr,Y,p-2*dpr,dpr);
    } else {
      g.fillStyle="rgba(0,0,0,.26)"; g.fillRect(X,Y,p,dpr); g.fillRect(X,Y+p-dpr,p,dpr);
      g.fillStyle="rgba(255,255,255,.10)"; g.fillRect(X,Y+2*dpr,p,dpr);
      g.fillStyle="rgba(0,0,0,.10)"; g.fillRect(X,Y+dpr,dpr,p-2*dpr);
    }
  }
}

var TIPS=[[129.4,205.6],[135.4,204.4],[130.6,212.6],[140.2,198.4],[134.6,199.6],[146.6,194.6],[151.6,188.4]];
var meas=document.createElement("canvas").getContext("2d");
function tw(s,font){ meas.font=font; return meas.measureText(s).width; }
function ringPath(r){ var d=""; for(var i=0;i<r.length;i++) d+=(i?"L":"M")+px(r[i][0]).toFixed(1)+" "+py(r[i][1]).toFixed(1); return d; }

function renderOver(){

  h+='<defs><clipPath id="outsel"><path clip-rule="evenodd" d="M0 0H'+M.w+'V'+M.h+'H0Z '+selD+'"/></clipPath>'+
     '<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter></defs>';

  var sd=SEAMS.map(function(r){ return ringPath(r); }).join(" ");
  h+='<path d="'+sd+'" fill="none" stroke="#0d1420" stroke-opacity=".55" stroke-width="2.6" stroke-linejoin="round"/>';
  h+='<path d="'+sd+'" fill="none" stroke="'+cream+'" stroke-opacity=".9" stroke-width="1.15" stroke-dasharray="3.4 2.6" stroke-linejoin="round"/>';
  /* selected place: raised weave, shadow outside, blanket stitch edge */
  h+='<g clip-path="url(#outsel)"><path d="'+selD+'" transform="translate(2.5 3.5)" fill="none" stroke="#05080e" stroke-opacity=".8" stroke-width="6" filter="url(#soft)"/></g>';
  h+='<path d="'+selD+'" fill="none" stroke="#3a0d09" stroke-width="4" stroke-linejoin="round"/>';
  h+='<path d="'+selD+'" fill="none" stroke="'+madder+'" stroke-width="2.4" stroke-linejoin="round"/>';
  h+='<path d="'+selD+'" fill="none" stroke="'+cream+'" stroke-width="2.4" stroke-dasharray="1.2 5.2" stroke-linejoin="round" stroke-opacity=".95"/>';

  /* pull the thread: from the place label to the place */
  var pl=document.getElementById("place").getBoundingClientRect(), st=stage.getBoundingClientRect();
  var tx0=pl.right-st.left-1, ty0=Math.min(pl.bottom-st.top-34, py(231));
  var south=SEL.rings[0].reduce(function(a,b){ return b[1]>a[1]?b:a; });
  var tx1=px(south[0]), ty1=py(south[1]);
  var thr='M'+tx0+' '+ty0+' C'+(tx0+px(60)-px(0))+' '+py(247)+', '+px(104)+' '+py(252)+', '+px(126)+' '+py(240)+' S'+(tx1+2)+' '+py(south[1]+9)+', '+tx1+' '+ty1;
  h+='<path d="'+thr+'" fill="none" stroke="#05080e" stroke-opacity=".5" stroke-width="3" transform="translate(1 2)"/>';
  h+='<path d="'+thr+'" fill="none" stroke="'+madder+'" stroke-width="1.9" stroke-linecap="round"/>';
  h+='<path d="'+thr+'" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width=".6" stroke-dasharray="2 3"/>';
  h+='<circle cx="'+tx1+'" cy="'+ty1+'" r="3.1" fill="'+madder+'" stroke="#3a0d09" stroke-width="1"/>';
  h+='<circle cx="'+(tx0+1)+'" cy="'+ty0+'" r="3.4" fill="'+madder+'" stroke="#3a0d09" stroke-width="1"/>';

  /* sea names, embroidered in italic */
  var seaF='italic 500 13px Besley';
  [["irish",22,50],["cardigan",40,97]].forEach(function(s){
    h+='<text x="'+px(s[1])+'" y="'+py(s[2])+'" text-anchor="middle" style="font:'+seaF+';font-family:var(--display)" fill="#A9C0DD" letter-spacing=".06em">'+esc(T.seas[s[0]])+'</text>';
  });

  /* marks, with boxes kept for label placement */
  var boxes=[], marks="";
  function block(x,y,r){ boxes.push([x-r,y-r,x+r,y+r]); }
  TIPS.forEach(function(t,i){ marks+=slub(px(t[0]),py(t[1]),i+2,T.tipName+": "+T.lg.tip); block(px(t[0]),py(t[1]),5); });
  W.sites.forEach(function(s){ marks+=glyph(s.kind,px(s.x),py(s.y),mustard,s[lang]+" ("+T.kinds[s.kind]+")"); block(px(s.x),py(s.y),5.5); });
  W.peaks.forEach(function(s){ marks+=glyph("peak",px(s.x),py(s.y),cream,s[lang]+" ("+T.kinds.peak+")"); block(px(s.x),py(s.y),5); });
  W.towns.forEach(function(t){
    var X=px(t.x).toFixed(1), Y=py(t.y).toFixed(1);
    if(t.kind==="city"){
      marks+='<g transform="translate('+X+' '+Y+')" data-tip="'+esc(t[lang])+'"><rect x="-4.2" y="-4.2" width="8.4" height="8.4" fill="#10151d"/><rect x="-3" y="-3" width="6" height="6" fill="'+cream+'"/><path d="M-3 -3 L3 3 M3 -3 L-3 3" stroke="'+v("--madder")+'" stroke-width="1.3"/></g>';
      block(+X,+Y,5);
    } else {
      marks+='<g transform="translate('+X+' '+Y+')" data-tip="'+esc(t[lang])+'"><circle r="3.5" fill="#10151d"/><circle r="2.3" fill="'+cream+'"/><circle cx="-.6" cy="-.6" r=".8" fill="#fff"/></g>';
      block(+X,+Y,4);
    }
  });
  var hard=boxes.length;
  SEL.rings.forEach(function(r){ for(var i=0;i<r.length;i+=2){ var X=px(r[i][0]), Y=py(r[i][1]); boxes.push([X-2.5,Y-2.5,X+2.5,Y+2.5,1]); } });
  boxes.push([tx1-5,ty1-4,tx1+5,py(south[1]+8)]);
  /* legend zone is kept clear */
  var lgx=px(4), lgy=py(108);
  boxes.push([lgx-4,lgy-12,lgx+178,lgy+96]);

  /* labels: try positions round the mark, keep the first that is clear */
  var labels="";
  var mapL=px(0)-6, mapR=px(GW)+6;
  function place(name,x,y,font,size,fill,off,free){
    var w=tw(name,font)+2, hh=size;
    var c=[[off,hh*.36,"start"],[-off,hh*.36,"end"],[0,-off-1,"middle"],[0,off+hh*.8,"middle"],[off-1,-off+2,"start"],[off-1,off+hh*.6,"start"],[-off+1,-off+2,"end"],[-off+1,off+hh*.6,"end"],[off+6,-off-3,"start"],[off+6,off+hh,"start"],[-off-6,-off-3,"end"],[-off-6,off+hh,"end"],[0,-off-11,"middle"],[0,off+hh*.8+10,"middle"]];
    for(var i=0;i<c.length;i++){
      var ax=x+c[i][0], ay=y+c[i][1];
      var x0=c[i][2]==="start"?ax:c[i][2]==="end"?ax-w:ax-w/2, bx=[x0-1,ay-hh*.82,x0+w+1,ay+hh*.22];
      if(bx[0]<mapL||bx[2]>mapR||bx[1]<2||bx[3]>M.h-2) continue;
      var hit=false;
      for(var b=0;b<boxes.length;b++){ var q=boxes[b]; if(free&&q[4]) continue; if(bx[0]<q[2]&&bx[2]>q[0]&&bx[1]<q[3]&&bx[3]>q[1]){ hit=true; break; } }
      if(hit) continue;
      boxes.push(bx);
      labels+='<text x="'+ax.toFixed(1)+'" y="'+ay.toFixed(1)+'" text-anchor="'+c[i][2]+'" style="font:'+font+'" fill="'+fill+'" stroke="#0e1520" stroke-width="3" stroke-linejoin="round" paint-order="stroke">'+esc(name)+'</text>';
      return true;
    }
    return false;
  }
  var fam='"Instrument Sans", sans-serif';
  var pri=["Tonypandy","Merthyr Tydfil","Ebbw Vale"];
  var towns=W.towns.slice().sort(function(a,b){
    function r(t){ return pri.indexOf(t.en)>=0?0:t.kind==="city"?1:2; } return r(a)-r(b); });
  towns.forEach(function(t){
    var city=t.kind==="city";
    place(t[lang],px(t.x),py(t.y), (city?"600 12.5px ":"500 11px ")+fam, city?12.5:11, cream, city?7.5:6, pri.indexOf(t.en)>=0);
  });
  W.peaks.forEach(function(p){ place(p[lang],px(p.x),py(p.y),'italic 500 11px Besley, serif',11,"#F3EDDF",7); });

  /* legend, stitched straight onto the sea */
  var lg='<g transform="translate('+lgx.toFixed(1)+' '+lgy.toFixed(1)+')" style="font:500 11px '+esc(fam)+'" fill="#DCE5F0">';
  var rowsL=[
    [slub(8,-4,3,null), T.lg.tip],
    [glyph("coal",3,-4,mustard,null)+glyph("heritage",15,-4,mustard,null), T.lg.site],
    ['<g transform="translate(8 -4)"><rect x="-4.2" y="-4.2" width="8.4" height="8.4" fill="#10151d"/><rect x="-3" y="-3" width="6" height="6" fill="'+cream+'"/><path d="M-3 -3 L3 3 M3 -3 L-3 3" stroke="'+v("--madder")+'" stroke-width="1.3"/></g><g transform="translate(20 -4)"><circle r="3.5" fill="#10151d"/><circle r="2.3" fill="'+cream+'"/></g>', T.lg.city+", "+T.lg.town.toLowerCase()],
    ['<path d="M0 -4 H22" stroke="#0d1420" stroke-width="2.6"/><path d="M0 -4 H22" stroke="'+cream+'" stroke-width="1.15" stroke-dasharray="3.4 2.6"/>', T.lg.seam],
    ['<path d="M0 -4 H22" stroke="'+madder+'" stroke-width="2.6"/><path d="M0 -4 H22" stroke="'+cream+'" stroke-width="2.6" stroke-dasharray="1.2 5.2"/>', T.lg.sel]
  ];
  rowsL.forEach(function(r,i){ lg+='<g transform="translate(0 '+(i*18)+')">'+r[0]+'<text x="31" y="0">'+esc(r[1])+'</text></g>'; });
  lg+='</g>';
  over.innerHTML = h + marks + labels + lg;
}

/* ================= timeline: woven past, bare warp for the future ================= */
function renderTime(){
  var svg=document.getElementById("time"), r=svg.getBoundingClientRect(), w=Math.round(r.width), hgt=Math.round(r.height);
  svg.setAttribute("viewBox","0 0 "+w+" "+hgt);
  var x0=40, x1=w-56, y0=22, bh=20;
  function X(yr){ return x0+(yr-1780)/(2100-1780)*(x1-x0); }
  var cream=v("--cream"), madder=v("--madder-bright"), mustard=v("--mustard");
  var h='<defs>'+
    '<pattern id="wPast" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#59606B"/><path d="M0 0h3v3H0zM3 3h3v3H3z" fill="#6E7682"/><path d="M0 0v6M3 0v6" stroke="#000" stroke-opacity=".22" stroke-width=".8"/></pattern>'+
    '<pattern id="wNow" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#2F6B52"/><path d="M0 0h3v3H0zM3 3h3v3H3z" fill="#458A6C"/><path d="M0 0v6M3 0v6" stroke="#000" stroke-opacity=".22" stroke-width=".8"/></pattern>'+
    '<pattern id="wWarp" width="4" height="6" patternUnits="userSpaceOnUse"><path d="M1.5 0v6" stroke="'+v("--oatmeal")+'" stroke-opacity=".62" stroke-width="1.1"/></pattern>'+
    '</defs>';
  /* cloth so far */
  h+='<rect x="'+X(1780)+'" y="'+y0+'" width="'+(X(2000)-X(1780))+'" height="'+bh+'" fill="url(#wPast)"/>';
  h+='<rect x="'+X(2000)+'" y="'+y0+'" width="'+(X(2031)-X(2000))+'" height="'+bh+'" fill="url(#wNow)"/>';
  /* not yet woven */
  h+='<rect x="'+X(2031)+'" y="'+y0+'" width="'+(X(2100)-X(2031))+'" height="'+bh+'" fill="url(#wWarp)"/>';
  h+='<path d="M'+X(1780)+' '+(y0-.5)+'H'+X(2100)+'M'+X(1780)+' '+(y0+bh+.5)+'H'+X(2100)+'" stroke="'+v("--oatmeal")+'" stroke-opacity=".55" stroke-width="1"/>';
  h+='<path d="M'+X(2000)+' '+y0+'v'+bh+'" stroke="#111" stroke-width="1.5"/>';
  /* era names */
  var eraX=[X(1780)+10, X(2000)+8, X(2056)], eraFill=[cream,cream,cream];
  T.eras.forEach(function(e,i){
    h+='<text x="'+eraX[i]+'" y="'+(y0+14.5)+'" fill="'+eraFill[i]+'" stroke="#1d1d20" stroke-width="3" paint-order="stroke" style="font:600 13px Besley, serif">'+esc(e[0])+
       (e[1]&&i!==1?'<tspan style="font:400 11.5px \'Instrument Sans\', sans-serif" dx="7">'+esc(e[1])+'</tspan>':'')+'</text>';
  });
  /* year ticks */
  for(var yr=1780;yr<=2100;yr+=10){
    var major=(yr===1780||yr%50===0);
    h+='<path d="M'+X(yr).toFixed(1)+' '+(y0+bh+2)+'v'+(major?6:3)+'" stroke="'+cream+'" stroke-opacity="'+(major?.8:.4)+'" stroke-width="1"/>';
    if(major && yr!==2050 && yr!==2100) h+='<text x="'+X(yr).toFixed(1)+'" y="'+(y0+bh+19)+'" text-anchor="middle" fill="#D9D1BF" style="font:500 11px \'Instrument Sans\', sans-serif">'+yr+'</text>';
  }
  /* generation boundaries: a bar of madder stitches every 25 years from 2025 */
  [2025,2050,2075,2100].forEach(function(g){
    h+='<path d="M'+X(g).toFixed(1)+' '+(y0-5)+'v'+(bh+10)+'" stroke="'+madder+'" stroke-width="2.6" stroke-dasharray="3 2"/>';
    h+='<text x="'+X(g).toFixed(1)+'" y="'+(y0+bh+19)+'" text-anchor="middle" fill="#F2A99E" style="font:600 11px \'Instrument Sans\', sans-serif">'+g+'</text>';
  });
  /* current generation bracket */
  h+='<path d="M'+X(2025)+' '+(y0-8)+'H'+X(2050)+'" stroke="'+mustard+'" stroke-width="2"/>';
  h+='<text x="'+(X(2050)+8)+'" y="'+(y0-5)+'" fill="#E9C873" style="font:500 11px \'Instrument Sans\', sans-serif">'+esc(T.gen)+'</text>';
  h+='<path d="M'+X(2025)+' '+(y0-11)+'v3M'+X(2050)+' '+(y0-11)+'v3" stroke="'+mustard+'" stroke-width="2"/>';
  /* the shuttle sits at the fell of the cloth: now */
  var sx=X(2031);
  h+='<path d="M'+sx+' '+(y0-3)+'v'+(bh+6)+'" stroke="'+cream+'" stroke-width="2"/>';
  h+='<path d="M'+(sx-15)+' '+(y0+bh/2)+' Q'+sx+' '+(y0+bh/2-8)+' '+(sx+15)+' '+(y0+bh/2)+' Q'+sx+' '+(y0+bh/2+8)+' '+(sx-15)+' '+(y0+bh/2)+'Z" fill="'+cream+'" stroke="#111" stroke-width="1"/>';
  h+='<rect x="'+(sx-6)+'" y="'+(y0+bh/2-2)+'" width="12" height="4" rx="1" fill="'+v("--madder")+'"/>';
  var lab=T.now+" 2031", lw=tw(lab,'600 12px "Instrument Sans"')+14;
  h+='<rect x="'+(sx-lw/2)+'" y="1" width="'+lw+'" height="17" fill="'+cream+'"/><text x="'+sx+'" y="13.5" text-anchor="middle" fill="#1E2126" style="font:600 12px \'Instrument Sans\', sans-serif">'+esc(lab)+'</text>';
  svg.innerHTML=h;
  document.getElementById("foot").innerHTML='<span>'+esc(T.foot)+'</span><span>'+esc(T.footR)+'</span>';
}

/* ================= wiring ================= */
function renderAll(redrawCloth){
  T=D[lang];
  document.documentElement.lang=lang; document.title=T.doc;
  renderTop(); renderLeft(); renderHand();
  var k0=M.k, ox0=M.ox, w0=M.w, h0=M.h;
  layout();
  if(redrawCloth || k0!==M.k || ox0!==M.ox || w0!==M.w || h0!==M.h) drawCloth();
  renderOver(); renderTime();
}
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-lang]"); if(!b) return;
  lang=b.getAttribute("data-lang");
  var u=new URL(location.href); if(lang==="cy") u.searchParams.set("lang","cy"); else u.searchParams.delete("lang");
  try{ history.replaceState(null,"",u); }catch(err){}
  renderAll(false);
  var nb=document.querySelector('[data-lang="'+lang+'"]'); if(nb) nb.focus();
});
var tip=document.getElementById("tip");
function showTip(el,x,y){ tip.textContent=el.getAttribute("data-tip"); tip.style.display="block";
  var w=tip.offsetWidth; tip.style.left=Math.max(6,Math.min(window.innerWidth-w-6,x+12))+"px"; tip.style.top=(y+16)+"px"; }
document.addEventListener("mousemove",function(e){ var el=e.target.closest&&e.target.closest("[data-tip]"); if(el) showTip(el,e.clientX,e.clientY); else tip.style.display="none"; });
document.addEventListener("focusin",function(e){ var el=e.target.closest&&e.target.closest("[data-tip]"); if(el){ var r=el.getBoundingClientRect(); showTip(el,r.left,r.bottom-8); } });
document.addEventListener("focusout",function(){ tip.style.display="none"; });
var rt; window.addEventListener("resize",function(){ clearTimeout(rt); rt=setTimeout(function(){ renderAll(true); },120); });

buildSeams();
renderAll(true);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ renderAll(false); });
})();
</script>
