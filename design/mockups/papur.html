<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Papur: Wales relief model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap&subset=latin-ext" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="data/wales.js"></script>
<style>
/* PAPUR: a cut-paper relief model of Wales on a studio table.
   Every colour is a sheet of paper stock, defined once here. */
:root{
  --board:#D8D9D3;        /* mount board, the studio table */
  --board-deep:#C9CAC3;
  --paper:#FAFAF6;        /* card stock for game pieces */
  --paper-edge:#D2D2CA;   /* visible thickness of card */
  --ink:#1F2A30;          /* slate ink */
  --ink-2:#4E5B63;        /* secondary ink, AA on paper */
  --ink-3:#6B767C;
  --rule:#C9CBC4;
  --thread:#B0262C;       /* the red thread: selection and sources */
  --thread-dark:#7E1A1F;
  --slate:#39454D;        /* curveball stock, a sheet of slate */
  --slate-2:#4A5760;
  --amber:#C98A2B;        /* raised risk */
  --sea-0:#7D96A0; --sea-1:#8EA7AF; --sea-2:#A0B7BC; --sea-3:#B3C7C8; --sea-4:#C5D5D3; --sea-5:#D4E0DC;
  --context:#ECECE6;      /* England, plain unpainted card as in an architect's model */
  --past:#DCD6CA; --present:#F7F7F2; --future:#D9E2E4;
  /* the seven strands, coloured from the land */
  --s-pro:#B48A1E; --s-res:#5A7B41; --s-hea:#2F7575; --s-equ:#82628A; --s-coh:#A0602F; --s-cul:#2F5E86; --s-glo:#5E8597;
  --serif:"Newsreader", Georgia, serif;
  --sans:"Familjen Grotesk", "Helvetica Neue", sans-serif;
  --grain:none;
  --grain-light:none;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--board);
  background-image:var(--grain-light);
  color:var(--ink);
  font-family:var(--sans);
  font-size:14px;
  line-height:1.35;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--thread);outline-offset:2px}

.app{
  height:100vh;min-height:760px;
  display:grid;
  grid-template-rows:auto 1fr auto auto;
  gap:0;
}

/* ---------- top bar ---------- */
.topbar{
  display:grid;
  grid-template-columns:auto 1fr auto;
  align-items:center;
  gap:22px;
  padding:10px 20px 10px 22px;
}
.when{display:flex;align-items:center;gap:14px}
.year{
  font-family:var(--serif);font-weight:500;
  font-size:40px;line-height:1;letter-spacing:-.01em;
  font-variant-numeric:lining-nums;
}
.termgen{display:flex;flex-direction:column;gap:1px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.termgen b{color:var(--ink);font-weight:600}

.strands{
  list-style:none;margin:0;padding:0;
  display:grid;grid-template-columns:repeat(7,minmax(0,1fr));
  gap:6px;
}
.meter{
  position:relative;
  background:var(--paper);background-image:var(--grain);background-blend-mode:multiply;
  border-radius:2px;
  padding:6px 8px 7px;
  box-shadow:0 0 0 1px rgba(40,45,40,.08), 1px 1.5px 0 var(--paper-edge), 2px 4px 6px -3px rgba(30,35,30,.35);
  cursor:default;
  min-width:0;
}
.m-head{display:flex;align-items:center;justify-content:space-between;gap:4px}
.m-name{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-arrow{flex:none;display:flex;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink-2)}
.m-arrow svg{display:block}
.m-bar{display:flex;gap:2px;margin-top:5px;height:9px;align-items:flex-end}
.m-bar b{flex:1;height:100%;border-radius:1px;background:transparent;box-shadow:inset 0 0 0 1px var(--rule)}
.m-bar b.on{background:var(--c);box-shadow:inset 0 -1px 0 rgba(0,0,0,.18), .5px 1px 0 rgba(0,0,0,.18)}
.m-bar b.on:nth-child(n){transform:translateY(-1px)}
.tip{
  position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%);
  width:220px;z-index:50;
  background:var(--ink);color:#F3F4F1;
  font-size:12.5px;line-height:1.35;padding:8px 10px;border-radius:2px;
  pointer-events:none;opacity:0;transition:opacity .12s;
}
.tip strong{display:block;font-family:var(--serif);font-weight:500;font-size:14.5px;margin-bottom:2px}
.meter:hover .tip,.meter:focus .tip{opacity:1}

.lang{
  display:flex;padding:3px;border-radius:2px;
  background:var(--board-deep);
  box-shadow:inset 1px 1px 2px rgba(0,0,0,.18);
}
.lang button{
  border:0;background:transparent;cursor:pointer;
  font-weight:600;font-size:13px;letter-spacing:.04em;
  padding:6px 11px;border-radius:1px;color:var(--ink-2);
}
.lang button[aria-pressed="true"]{
  background:var(--paper);color:var(--ink);
  box-shadow:1px 1.5px 0 var(--paper-edge), 1px 3px 4px -2px rgba(0,0,0,.3);
}

/* ---------- table ---------- */
.table{
  display:grid;
  grid-template-columns:1fr var(--side-w);
  gap:14px;
  padding:0 20px 0 20px;
  min-height:0;
  --side-w:clamp(372px,30vw,440px);
}
.stage{
  position:relative;min-height:0;overflow:hidden;
  border-radius:3px;
  background:var(--sea-0);
  box-shadow:inset 0 0 0 1px rgba(20,30,35,.25), inset 2px 3px 8px rgba(10,20,30,.3), 0 1px 0 rgba(255,255,255,.6);
}
.stage canvas,.stage svg.overlay{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage svg.overlay{pointer-events:none}
.stage svg.overlay .hit{pointer-events:auto}

/* paper pieces share one material */
.piece{
  background:var(--paper);background-image:var(--grain);background-blend-mode:multiply;
  border-radius:2px;
  box-shadow:0 0 0 1px rgba(40,45,40,.07), 1px 1.5px 0 var(--paper-edge), 2px 2.5px 0 #BFC0B8, 3px 8px 14px -6px rgba(25,35,35,.45);
}

.key{
  position:absolute;left:14px;top:14px;z-index:2;
  width:212px;padding:11px 12px 12px;
  font-size:12px;color:var(--ink-2);
}
.key ul{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.key li{display:flex;align-items:center;gap:8px;line-height:1.2}
.key li svg{flex:none}
.key .k-height{margin-top:10px;padding-top:9px;border-top:1px solid var(--rule)}
.key .k-height span{display:block;margin-bottom:4px}
.key .k-scale{display:flex;justify-content:space-between;font-size:11px;margin-top:2px;font-variant-numeric:tabular-nums}

.place{
  position:absolute;left:14px;bottom:14px;z-index:3;
  width:var(--place-w,272px);
  padding:14px 16px 14px;
}
.place::before{ /* the thread is pinned into the card here */
  content:"";position:absolute;right:-5px;top:var(--pin-y,40%);
  width:9px;height:9px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#E2585C,var(--thread) 55%,var(--thread-dark));
  box-shadow:1px 1.5px 2px rgba(0,0,0,.35);
}
.p-eyebrow{font-size:12px;color:var(--ink-2);margin:0 0 3px}
.p-name{font-family:var(--serif);font-weight:500;font-size:27px;line-height:1.05;margin:0;letter-spacing:-.005em}
.p-alt{display:flex;align-items:baseline;gap:6px;margin-top:4px;font-family:var(--serif);font-style:italic;font-size:15px;color:var(--ink-2)}
.p-alt abbr{font-family:var(--sans);font-style:normal;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-decoration:none;color:var(--ink-3);border:1px solid var(--rule);padding:0 4px;border-radius:2px}
.p-figs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 2px;padding-top:10px;border-top:1px solid var(--rule)}
.p-fig b{display:block;font-family:var(--serif);font-weight:500;font-size:25px;line-height:1;font-variant-numeric:lining-nums}
.p-fig span{font-size:12px;color:var(--ink-2)}
.p-approx{font-size:11.5px;font-style:italic;color:var(--ink-3);margin:4px 0 10px}
.p-hist{font-family:var(--serif);font-size:14.5px;line-height:1.42;margin:0 0 12px;color:var(--ink)}
.p-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip-src{
  display:inline-flex;align-items:center;gap:6px;
  border:0;background:#F3EDEA;cursor:pointer;
  box-shadow:inset 0 0 0 1px rgba(176,38,44,.35);
  font-size:12px;padding:4px 8px 4px 6px;border-radius:2px;color:var(--ink);
}
.chip-src em{font-style:normal;color:var(--thread-dark);font-weight:600}
.conf{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);padding:4px 2px}
.conf .bars{display:flex;gap:2px;align-items:flex-end}
.conf .bars i{display:block;width:4px;background:var(--rule)}
.conf .bars i.on{background:var(--ink)}

/* ---------- side: curveball and hand ---------- */
.side{display:flex;flex-direction:column;min-height:0;gap:10px}

.curve{position:relative;filter:drop-shadow(2px 3px 0 rgba(20,25,30,.25)) drop-shadow(3px 8px 10px rgba(20,25,30,.3));transform:rotate(-.6deg);margin:2px 4px 0 2px}
.curve .sheet{
  background:var(--slate);
  background-image:repeating-linear-gradient(-62deg, rgba(255,255,255,.045) 0 1px, transparent 1px 7px), var(--grain);
  background-blend-mode:normal, multiply;
  color:#EEF1F0;
  padding:18px 16px 13px 16px;
  clip-path:polygon(0% 7px,3% 3px,7% 6px,12% 2px,18% 5px,24% 1px,31% 6px,37% 3px,44% 5px,50% 1px,57% 5px,63% 2px,70% 6px,76% 2px,83% 5px,89% 1px,94% 5px,100% 3px,100% 100%,0% 100%);
  border-radius:0 0 2px 2px;
}
.cv-kick{display:flex;align-items:center;gap:7px;font-size:12px;color:#C9D2D4}
.cv-title{font-family:var(--serif);font-weight:500;font-size:20px;line-height:1.15;margin:6px 0 9px}
.cv-ripple{display:flex;align-items:center;gap:8px;font-size:13px;margin:0;padding-top:9px;border-top:1px solid rgba(255,255,255,.16)}
.cv-ripple .lab{font-size:11px;font-weight:600;letter-spacing:.04em;color:#20262A;background:var(--amber);padding:2px 6px;border-radius:1px}

.hand-h{font-family:var(--serif);font-weight:500;font-style:italic;font-size:16px;margin:4px 2px -2px;color:var(--ink-2)}
.hand{
  flex:1;min-height:0;
  display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:12px 12px;
  padding:0 2px 4px 0;
}
.card{filter:drop-shadow(1px 1.5px 0 var(--paper-edge)) drop-shadow(1px 1px 0 #BDBEB6) drop-shadow(2px 7px 8px rgba(25,35,35,.28));min-height:0}
.card .sheet{
  height:100%;
  background:var(--paper);background-image:var(--grain);background-blend-mode:multiply;
  clip-path:polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 0 100%);
  padding:11px 12px 10px;
  display:flex;flex-direction:column;gap:7px;
  position:relative;
}
.card .sheet::after{ /* the cut corner folds a little */
  content:"";position:absolute;right:0;top:0;width:16px;height:16px;
  background:linear-gradient(225deg, transparent 50%, #E4E4DC 50%, #D6D6CE);
}
.c-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding-right:12px}
.c-icon{width:34px;height:34px;flex:none}
.c-cost{text-align:right;font-size:11.5px;color:var(--ink-2);line-height:1.15}
.c-cost b{font-family:var(--serif);font-weight:500;font-size:17px;color:var(--ink);font-variant-numeric:lining-nums;margin-right:3px}
.coins{display:flex;gap:2px;justify-content:flex-end;margin-bottom:3px}
.coins i{width:7px;height:7px;border-radius:50%;background:#B9BAB2;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.coins i.on{background:var(--ink)}
.c-title{font-family:var(--serif);font-weight:500;font-size:17px;line-height:1.12;margin:0}
.c-row{display:flex;flex-wrap:wrap;align-items:center;gap:3px}
.c-row .c-lab{margin-right:3px}
.c-lab{font-size:11px;color:var(--ink-2);display:flex;align-items:center;gap:4px}
.c-lab svg{flex:none}
.chips{display:contents}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;line-height:1.2;padding:2px 6px 2px 4px;border-radius:1px;background:#EEEFEA;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.chip i{width:7px;height:7px;border-radius:1px;background:var(--c);flex:none}
.chip.strain{background:transparent;box-shadow:inset 0 0 0 1px var(--rule);color:var(--ink-2)}
.chip.strain i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.chip.note{background:transparent;box-shadow:none;padding-left:0;color:var(--ink-2);font-style:italic}
.c-delay{margin-top:auto;display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink);padding-top:7px;border-top:1px dashed var(--rule)}

/* ---------- timeline paper strip ---------- */
.timeline{padding:12px 20px 0}
.strip{
  position:relative;height:56px;
  filter:drop-shadow(1px 1.5px 0 var(--paper-edge)) drop-shadow(2px 5px 6px rgba(25,35,35,.25));
}
.strip .band{position:absolute;top:0;height:40px;background-image:var(--grain);background-blend-mode:multiply}
.strip .band.past{background-color:var(--past);
  background-image:repeating-linear-gradient(90deg, rgba(0,0,0,.0) 0 22px, rgba(0,0,0,.055) 22px 23px, rgba(255,255,255,.35) 23px 24px, rgba(0,0,0,0) 24px 46px), var(--grain);}
.strip .band.present{background-color:var(--present)}
.strip .band.future{background-color:var(--future)}
.era{position:absolute;top:5px;display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.era b{font-family:var(--serif);font-weight:500;font-style:italic;font-size:17px}
.era span{font-size:12px;color:var(--ink-2)}
.tick{position:absolute;top:28px;height:12px;width:1px;background:rgba(31,42,48,.45)}
.tick.small{top:34px;height:6px;background:rgba(31,42,48,.3)}
.tlab{position:absolute;top:42px;font-size:11.5px;color:var(--ink-2);transform:translateX(-50%);font-variant-numeric:tabular-nums}
.fold{position:absolute;top:0;height:40px;width:2px;background:linear-gradient(90deg, rgba(0,0,0,.2), rgba(255,255,255,.7))}
.fold-lab{position:absolute;top:24px;font-size:10.5px;color:var(--ink-2);white-space:nowrap;padding-left:5px}
.now{position:absolute;top:-4px;height:48px;width:2px;background:var(--thread);box-shadow:1px 0 0 rgba(0,0,0,.15)}
.now::before{content:"";position:absolute;left:-4px;top:-3px;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#E2585C,var(--thread) 55%,var(--thread-dark));box-shadow:1px 1.5px 2px rgba(0,0,0,.35)}
.now-lab{position:absolute;top:8px;left:6px;font-size:12px;font-weight:700;color:var(--thread-dark);white-space:nowrap;background:var(--future);padding:0 4px}

.foot{display:flex;justify-content:space-between;gap:20px;padding:2px 20px 8px;font-size:11.5px;color:var(--ink-2)}

@media (min-height:860px){
  .c-title{font-size:19px}
  .chip{font-size:12px;padding:3px 7px 3px 5px}
  .card .sheet{gap:9px;padding:13px 14px 11px}
  .c-lab{font-size:11.5px}
  .c-delay{font-size:12px}
  .c-icon{width:40px;height:40px}
}
/* smaller table */
@media (max-height:840px){
  .year{font-size:34px}
  .topbar{padding:8px 16px 8px 18px;gap:16px}
  .table{padding:0 16px;gap:12px}
  .timeline{padding:10px 16px 0}
  .foot{padding:2px 16px 6px}
  .card .sheet{padding:9px 10px 8px;gap:5px}
  .c-title{font-size:15.5px}
  .c-icon{width:28px;height:28px}
  .c-cost b{font-size:15px}
  .chip{font-size:11px;padding:1px 5px 1px 4px}
  .c-delay{padding-top:5px;font-size:11px}
  .cv-title{font-size:18px;margin:5px 0 7px}
  .curve .sheet{padding:15px 14px 11px}
  .place{--place-w:252px;padding:12px 14px}
  .p-name{font-size:24px}
  .p-hist{font-size:13.5px;margin-bottom:10px}
  .p-fig b{font-size:22px}
  .key{width:196px;padding:9px 10px 10px;font-size:11.5px}
  .key ul{gap:3px}
  .key .k-height{margin-top:7px;padding-top:7px}
  .c-top{padding-right:10px}
}
@media (max-width:1340px){
  .table{--side-w:368px}
  .m-name{font-size:11.5px}
  .meter{padding:5px 6px 6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="when">
      <div class="year">2031</div>
      <div class="termgen"><b id="t-term"></b><span id="t-gen"></span></div>
    </div>
    <ul class="strands" id="strands"></ul>
    <div class="lang" role="group" id="lang">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="cy">CY</button>
    </div>
  </header>

  <main class="table">
    <section class="stage" id="stage">
      <canvas id="map"></canvas>
      <svg class="overlay" id="overlay" xmlns="http://www.w3.org/2000/svg"></svg>
      <aside class="key piece" id="key"></aside>
      <aside class="place piece" id="place"></aside>
    </section>
    <section class="side">
      <article class="curve" id="curve"></article>
      <h2 class="hand-h" id="hand-h"></h2>
      <div class="hand" id="hand"></div>
    </section>
  </main>

  <footer class="timeline"><div class="strip" id="strip"></div></footer>
  <div class="foot"><span id="t-foot"></span><span id="t-credit"></span></div>
</div>

<script>
/* ============ dictionaries: every visible string lives here ============ */
const DICT = {
  en: {
    htmlLang: "en",
    term: "Term 2 of 5",
    gen: "Generation 2025 to 2050",
    langGroup: "Language",
    levelTip: (l, d) => `Level ${l} of 10, ${d > 0 ? "up " + d : d < 0 ? "down " + (-d) : "no change"} since last term`,
    strands: {
      pro: ["Prosperous", "A prosperous Wales"],
      res: ["Resilient", "A resilient Wales"],
      hea: ["Healthier", "A healthier Wales"],
      equ: ["More equal", "A more equal Wales"],
      coh: ["Cohesive", "A Wales of cohesive communities"],
      cul: ["Culture", "A Wales of vibrant culture and thriving Welsh language"],
      glo: ["Global", "A globally responsible Wales"],
    },
    mapLabel: "Paper relief model of Wales",
    key: { city: "City", town: "Town", site: "Industry or heritage", tip: "Coal tip, a lasting liability", risk: "Tip risk raised by the storms", peak: "Peak", border: "Council boundary", height: "Height above sea, metres" },
    regions: { eryri: "Eryri", cambria: "Cambrian Mountains", bannau: "Bannau Brycheiniog", irish: "Irish Sea", bay: "Cardigan Bay", severn: "Bristol Channel", england: "England" },
    place: {
      eyebrow: "Selected place",
      pop: "people", welsh: "speak Welsh",
      approx: "approx., unverified",
      hist: "Steam coal made the Rhondda one of the most intensively mined places on earth after the 1850s; the last deep pits closed between 1990 and 2008, and the tips stayed.",
      source: "Census 2021, ONS", pull: "Pull the thread",
      conf: "Medium confidence",
    },
    curve: { kick: "From the horizon scan", title: "Climate instability: a wet, stormy decade", ripple: "Ripple", rippleText: "Raises coal tip risk" },
    hand: "Your hand",
    card: { plus: "Strengthens", minus: "Strains", perTerm: "per term", payout: n => `Pays out in ${n} term${n > 1 ? "s" : ""}`, shortTerm: "short term", highCost: "high cost", little: "Little, but needs partners" },
    cards: {
      peat: "Restore upland peat",
      tips: "Make coal tips safe",
      energy: "Community-owned energy",
      child: "Welsh-medium childcare",
    },
    eras: { past: ["Ddoe", "the past"], present: ["Heddiw", "the present"], future: ["Yfory", "the future"] },
    genBoundary: "Generation boundary",
    foot: "Mockup. Illustrative values. A thinking tool, not a forecast.",
    credit: "Boundaries ONS (OGL). Terrain AWS Terrain Tiles at 1 km.",
  },
  cy: {
    htmlLang: "cy",
    term: "Tymor 2 o 5",
    gen: "Cenhedlaeth 2025 i 2050",
    langGroup: "Iaith",
    levelTip: (l, d) => `Lefel ${l} o 10, ${d > 0 ? "i fyny " + d : d < 0 ? "i lawr " + (-d) : "dim newid"} ers y tymor diwethaf`,
    strands: {
      pro: ["Llewyrchus", "Cymru lewyrchus"],
      res: ["Cydnerth", "Cymru gydnerth"],
      hea: ["Iachach", "Cymru iachach"],

/* ============ grain: one sheet of paper fibre, reused everywhere ============ */
function makeGrain(size, lo, hi, fibres) {
  const c = document.createElement("canvas"); c.width = c.height = size;
  const g = c.getContext("2d"); const id = g.createImageData(size, size);
  for (let i = 0; i < size * size; i++) {
    const v = lo + Math.random() * (hi - lo);
    id.data[i * 4] = v; id.data[i * 4 + 1] = v; id.data[i * 4 + 2] = v - 2; id.data[i * 4 + 3] = 255;
  }
  g.putImageData(id, 0, 0);
  g.lineCap = "round";
  for (let i = 0; i < fibres; i++) {
    const x = Math.random() * size, y = Math.random() * size, a = Math.random() * Math.PI * 2, l = 4 + Math.random() * 12;
    g.strokeStyle = `rgba(${Math.random() < .5 ? "110,100,90" : "255,255,255"},${.12 + Math.random() * .14})`;
    g.lineWidth = .5 + Math.random() * .6;
    g.beginPath(); g.moveTo(x, y);
    g.quadraticCurveTo(x + Math.cos(a + .5) * l * .5, y + Math.sin(a + .5) * l * .5, x + Math.cos(a) * l, y + Math.sin(a) * l);

/* ============ terrain preparation (once) ============ */
const WD = window.WALES, NX = WD.width, NY = WD.height, ROWS = WD.elevation.rows;
const LEVELS = [45, 110, 180, 250, 320, 390, 460, 530, 610, 700, 800];
/* paper stocks from the land seen from above in late autumn:

const LAND = ["#C3CC9F", "#B3BF8E", "#A3B17F", "#94A373", "#A2A170", "#B39C67", "#A9855A", "#93745C", "#7F6A62", "#7A7672", "#959799", "#B4B6B6"];
const SEA_T = [30, 17, 9, 4, 1.6];
const SEA_C = ["#8EA7AF", "#9DB4BA", "#AEC3C6", "#BFD0D0", "#CEDCD8"];
const PADL = 170, PADR = 70, PADT = 40, PADB = 40;

const prep = (() => {
  // 1. elevation with England filled from the nearest Welsh cell, sea pushed below zero
  const n = NX * NY, el = new Float32Array(n), known = new Uint8Array(n);
  const q = [];
  for (let y = 0; y < NY; y++) for (let x = 0; x < NX; x++) {
    const v = ROWS[y][x], i = y * NX + x;
    if (v >= 0) { el[i] = v; known[i] = 1; q.push(i); } else if (v === -1) { el[i] = -40; known[i] = 2; }
  }
  for (let h = 0; h < q.length; h++) {
    const i = q[h], x = i % NX, y = (i / NX) | 0;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const xx = x + dx, yy = y + dy; if (xx < 0 || yy < 0 || xx >= NX || yy >= NY) continue;
      const j = yy * NX + xx; if (known[j]) continue; known[j] = 1; el[j] = el[i] * .97; q.push(j);
    }
  }
  // 2. upsample 2x and blur so the paper edges run smooth
  const U = 2, UW = NX * U, UH = NY * U, up = new Float64Array(UW * UH);
  for (let Y = 0; Y < UH; Y++) for (let X = 0; X < UW; X++) {
    let gx = (X + .5) / U - .5, gy = (Y + .5) / U - .5;
    gx = Math.max(0, Math.min(NX - 1.001, gx)); gy = Math.max(0, Math.min(NY - 1.001, gy));
    const x0 = gx | 0, y0 = gy | 0, fx = gx - x0, fy = gy - y0;
    const a = el[y0 * NX + x0], b = el[y0 * NX + x0 + 1], c = el[(y0 + 1) * NX + x0], d = el[(y0 + 1) * NX + x0 + 1];
    up[Y * UW + X] = a * (1 - fx) * (1 - fy) + b * fx * (1 - fy) + c * (1 - fx) * fy + d * fx * fy;
  }
  d3.blur2({ data: up, width: UW, height: UH }, 2.4);
  const cont = d3.contours().size([UW, UH]);
  const bands = LEVELS.map(t => cont.contour(up, t));

  // 3. padded land/sea grid for the offshore sheets and the plain England card
  const PW = NX + PADL + PADR, PH = NY + PADT + PADB;
  const cls = (x, y) => { // 0 sea, 1 wales, 2 england; edges are extended outward
    const cx = Math.max(0, Math.min(NX - 1, x - PADL)), cy = Math.max(0, Math.min(NY - 1, y - PADT));
    const v = ROWS[cy][cx]; return v === -1 ? 0 : v === -2 ? 2 : 1;
  };
  const dist = new Float64Array(PW * PH), eng = new Float64Array(PW * PH), C = new Uint8Array(PW * PH);
  for (let y = 0; y < PH; y++) for (let x = 0; x < PW; x++) { const c = cls(x, y); C[y * PW + x] = c; dist[y * PW + x] = c ? 0 : 1e9; }
  const R2 = Math.SQRT2;
  for (let y = 0; y < PH; y++) for (let x = 0; x < PW; x++) {
    const i = y * PW + x; let v = dist[i];
    if (x > 0) v = Math.min(v, dist[i - 1] + 1);
    if (y > 0) { v = Math.min(v, dist[i - PW] + 1); if (x > 0) v = Math.min(v, dist[i - PW - 1] + R2); if (x < PW - 1) v = Math.min(v, dist[i - PW + 1] + R2); }
    dist[i] = v;
  }
  for (let y = PH - 1; y >= 0; y--) for (let x = PW - 1; x >= 0; x--) {
    const i = y * PW + x; let v = dist[i];
    if (x < PW - 1) v = Math.min(v, dist[i + 1] + 1);
    if (y < PH - 1) { v = Math.min(v, dist[i + PW] + 1); if (x < PW - 1) v = Math.min(v, dist[i + PW + 1] + R2); if (x > 0) v = Math.min(v, dist[i + PW - 1] + R2); }
    dist[i] = v;
  }
  const neg = Float64Array.from(dist, v => -v);
  d3.blur2({ data: neg, width: PW, height: PH }, 1.6);
  const pc = d3.contours().size([PW, PH]);
  const sea = SEA_T.map(t => pc.contour(neg, -t));
  // England: -2 cells, plus a margin tucked under the Welsh border so no gap shows
  for (let y = 0; y < PH; y++) for (let x = 0; x < PW; x++) {
    let v = 0;
    if (C[y * PW + x] === 2) v = 1;
    else if (C[y * PW + x] === 1) {
      for (let dy = -3; dy <= 3 && !v; dy++) for (let dx = -3; dx <= 3; dx++) {
        const xx = x + dx, yy = y + dy; if (xx >= 0 && yy >= 0 && xx < PW && yy < PH && C[yy * PW + xx] === 2) { v = 1; break; }
      }

  d3.blur2({ data: eng, width: PW, height: PH }, .8);
  const england = pc.contour(eng, .5);
  return { bands, sea, england, U };
})();

function centroid(ring) {
  let a = 0, cx = 0, cy = 0;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const f = ring[j][0] * ring[i][1] - ring[i][0] * ring[j][1]; a += f; cx += (ring[j][0] + ring[i][0]) * f; cy += (ring[j][1] + ring[i][1]) * f;

function computeView() {
  const r = stage.getBoundingClientRect(), W = r.width, H = r.height;

  ctx.translate(-1.6, -1.8); ctx.strokeStyle = "rgba(40,30,20,.16)"; ctx.lineWidth = 1.4; ctx.stroke(path);

  const sel = ringsPath(SEL.rings);
  const lx = -3.2 * k, ly = -4.8 * k;
  ctx.save(); ctx.translate(lx, ly);
  ctx.shadowColor = "rgba(15,20,20,.6)"; ctx.shadowBlur = 12 * k; ctx.shadowOffsetX = 5 * k; ctx.shadowOffsetY = 7 * k;
  ctx.fillStyle = LAND[3]; ctx.fill(sel); ctx.shadowColor = "transparent";
  ctx.save(); ctx.clip(sel); ctx.drawImage(tc, 0, 0, W, H);
  ctx.fillStyle = "rgba(255,250,240,.16)"; ctx.fillRect(0, 0, W, H); ctx.restore();
  ctx.lineJoin = "round";
  ctx.shadowColor = "rgba(60,10,10,.45)"; ctx.shadowBlur = 2; ctx.shadowOffsetX = .8; ctx.shadowOffsetY = 1.2;
  ctx.strokeStyle = "#B0262C"; ctx.lineWidth = 2.4; ctx.stroke(sel);
  ctx.shadowColor = "transparent";
  ctx.strokeStyle = "rgba(110,15,20,.7)"; ctx.lineWidth = 2.4; ctx.setLineDash([1.3, 2.1]); ctx.stroke(sel);
  ctx.strokeStyle = "rgba(255,150,150,.55)"; ctx.lineWidth = .6; ctx.setLineDash([2, 1.4]); ctx.stroke(sel);
  ctx.restore();
  VIEW.lift = [lx, ly];
}

  "Tonypandy": [-8, 8, "end"], "Ebbw Vale": [5, -8, "start"], "Newtown": [7, 4, "start"], "Caernarfon": [-7, 4, "end"],

};
const SITE_HEAD = { // where the pin head sits, relative to its foot

  "Pontcysyllte Aqueduct": [-9, 6], "Gwynt y Môr wind farm": [0, 9], "Llyn Celyn (Tryweryn)": [7, 9],
};
const PEAK_LBL = { "Snowdon": [7, 10, "start"], "Pen y Fan": [-7, 9, "end"], "Cadair Idris": [-7, 8, "end"], "Plynlimon": [7, 5, "start"] };

function siteGlyph(kind) {
  const s = 'stroke="#1F2A30" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"';
  switch (kind) {
    case "coal": return `<path d="M-3 3.2 L0 -3 L3 3.2 M-1.9 1 H1.9" ${s}/><circle cx="0" cy="-3" r="1.2" ${s}/>`;
    case "slate": return `<path d="M-3.4 -1.6 L2.6 -2.8 M-3 .6 L3 -.6 M-2.6 2.8 L3.4 1.6" ${s}/>`;
    case "copper": return `<path d="M0 -3.4 L3.2 2.6 H-3.2Z" fill="#A9643A" stroke="#1F2A30" stroke-width=".8"/>`;
    case "steel": return `<path d="M-3 -3 H3 M-3 3 H3 M0 -3 V3" ${s} stroke-width="1.3"/>`;
    case "energy": return `<path d="M0 0 L0 -3.6 M0 0 L3.1 1.8 M0 0 L-3.1 1.8" ${s}/><circle r=".9" fill="#1F2A30"/>`;
    case "heritage": return `<path d="M-3.2 3 V-.6 A3.2 3.2 0 0 1 3.2 -.6 V3 M-1.2 3 V.4 A1.2 1.2 0 0 1 1.2 .4 V3" ${s}/>`;
    case "water": return `<path d="M-3.4 -1 q1.7 -1.6 3.4 0 t3.4 0 M-3.4 2 q1.7 -1.6 3.4 0 t3.4 0" ${s}/>`;
  }
  return "";
}
function tent(x, y, w, h, city) {
  // a tiny folded paper house: lit face, shaded face, crisp ink edge
  const a = w / 2, r = h * .42;
  return `<g transform="translate(${x.toFixed(1)},${y.toFixed(1)})" filter="url(#sh)">
    <path d="M${-a} ${h / 2} V${-h / 2 + r} L0 ${-h / 2} L0 ${h / 2}Z" fill="#FFFFFF"/>
    <path d="M0 ${-h / 2} L${a} ${-h / 2 + r} V${h / 2} H0Z" fill="${city ? "#1F2A30" : "#C2C3BB"}"/>
    <path d="M${-a} ${h / 2} V${-h / 2 + r} L0 ${-h / 2} L${a} ${-h / 2 + r} V${h / 2}Z" fill="none" stroke="#1F2A30" stroke-width=".7" stroke-linejoin="round"/></g>`;
}
function tipMark(x, y, sz) {
  // stacked rough discs of black sugar paper: a stepped cone of spoil
  const r = 6 * sz * Math.max(.8, VIEW.s / 3);
  const cols = ["#1F1C1A", "#342F2B", "#4B443E", "#655C54", "#81776D"];
  let g = `<g transform="translate(${x.toFixed(1)},${y.toFixed(1)})" filter="url(#rough)">`;
  for (let i = 0; i < 5; i++) {
    const rr = r * (1 - i * .19);
    g += `<ellipse cx="${(-i * 1.05).toFixed(1)}" cy="${(-i * 1.5).toFixed(1)}" rx="${rr.toFixed(2)}" ry="${(rr * .78).toFixed(2)}" fill="${cols[i]}" stroke="${i ? "rgba(140,130,120,.35)" : "#141211"}" stroke-width="${i ? .5 : .7}"/>`;
  }
  return g + `</g>`;
}
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");

function drawOverlay() {
  const { W, H, s } = VIEW, D = L();
  ovl.setAttribute("viewBox", `0 0 ${W} ${H}`);
  let o = `<defs>
    <filter id="sh" x="-50%" y="-50%" width="220%" height="220%"><feDropShadow dx="1.1" dy="1.5" stdDeviation=".8" flood-color="#20261F" flood-opacity=".5"/></filter>
    <filter id="rough" x="-60%" y="-60%" width="240%" height="240%">
      <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.1" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feDropShadow in="d" dx="1.6" dy="2.2" stdDeviation="1.1" flood-color="#120F0C" flood-opacity=".6"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx=".8" dy="1.4" stdDeviation="1" flood-color="#3A0A0C" flood-opacity=".45"/></filter>
  </defs>`;

  // region and sea names, set in quiet italics
  const lab = (x, y, txt, cls) => { const [px, py] = P(x, y); return `<text class="${cls}" x="${px.toFixed(1)}" y="${py.toFixed(1)}">${esc(txt)}</text>`; };
  o += `<g class="regions">${lab(103, 70, D.regions.eryri, "rg")}${lab(122, 131, D.regions.cambria, "rg")}${lab(110, 170, D.regions.bannau, "rg")}</g>`;
  o += `<g class="seas">${lab(14, 34, D.regions.irish, "sea")}${lab(52, 110, D.regions.bay, "sea")}${lab(104, 232, D.regions.severn, "sea")}${lab(187, 95, D.regions.england, "eng")}</g>`;

  // the red thread from the selected place to its card
  const pl = document.getElementById("place"), sr = stage.getBoundingClientRect(), pr = pl.getBoundingClientRect();
  const [sx0, sy0] = P(SEL_ANCHOR[0], SEL_ANCHOR[1]); const sx = sx0 + VIEW.lift[0], sy = sy0 + VIEW.lift[1];
  const ex = pr.right - sr.left + 1, ey = pr.top - sr.top + pr.height * .34;
  pl.style.setProperty("--pin-y", `calc(${(pr.height * .34).toFixed(0)}px - 4px)`);
  const mx = (sx + ex) / 2, my = Math.max(sy, ey) + 46;
  const thread = `M${sx.toFixed(1)},${sy.toFixed(1)} Q${mx.toFixed(1)},${my.toFixed(1)} ${ex.toFixed(1)},${ey.toFixed(1)}`;
  o += `<g filter="url(#soft)"><path d="${thread}" fill="none" stroke="#B0262C" stroke-width="1.8" stroke-linecap="round"/>
    <path d="${thread}" fill="none" stroke="#6E1418" stroke-width="1.8" stroke-dasharray="1.2 2.2" opacity=".7"/></g>`;

  // coal tips with their raised-risk rings (the curveball's ripple)
  TIP_GROUPS.forEach(([x, y, r]) => { const [px, py] = P(x, y); o += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${(r * s).toFixed(1)}" fill="rgba(201,138,43,.13)" stroke="#C98A2B" stroke-width="1.3" stroke-dasharray="3 2.4"/>`; });
  TIPS.forEach(([x, y, z]) => { const [px, py] = P(x, y); o += tipMark(px, py, z); });

  // peaks
  WD.peaks.forEach(p => {
    const [px, py] = P(p.x, p.y), [dx, dy, a] = PEAK_LBL[p.en] || [7, 4, "start"];
    o += `<path d="M${px - 3.6} ${py + 2.6} L${px} ${py - 3.6} L${px + 3.6} ${py + 2.6}Z" fill="#1F2A30" stroke="#FBFBF8" stroke-width=".8" filter="url(#sh)"/>`;
    o += `<text class="pk" x="${(px + dx).toFixed(1)}" y="${(py + dy).toFixed(1)}" text-anchor="${a}">${esc(nm(p))}</text>`;
  });

  // sites: model pins with a small paper head
  WD.sites.forEach(t => {
    const [px, py] = P(t.x, t.y), [hx, hy] = SITE_HEAD[t.en] || [0, -10];
    o += `<g class="hit"><title>${esc(nm(t))}</title><line x1="${px.toFixed(1)}" y1="${py.toFixed(1)}" x2="${(px + hx).toFixed(1)}" y2="${(py + hy).toFixed(1)}" stroke="#3A4247" stroke-width=".9"/>
      <circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="1.1" fill="#3A4247"/>
      <g transform="translate(${(px + hx).toFixed(1)},${(py + hy).toFixed(1)})" filter="url(#sh)"><circle r="6.2" fill="#FBFBF8" stroke="#1F2A30" stroke-width=".7"/>${siteGlyph(t.kind)}</g></g>`;
  });

  // towns: folded paper tents with neat labels
  WD.towns.forEach(t => {
    const [px, py] = P(t.x, t.y), city = t.kind === "city";
    o += tent(px, py, city ? 11 : 8, city ? 9 : 7, city);
  });
  WD.towns.forEach(t => {
    const [px, py] = P(t.x, t.y), city = t.kind === "city", [dx, dy, a] = TOWN_LBL[t.en] || [7, 4, "start"];
    o += `<text class="${city ? "tn city" : "tn"}" x="${(px + dx).toFixed(1)}" y="${(py + dy).toFixed(1)}" text-anchor="${a}">${esc(nm(t))}</text>`;
  });
  // knot where the thread meets the lifted sheet
  o += `<circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="3.4" fill="#B0262C" stroke="#6E1418" stroke-width=".8" filter="url(#soft)"/>`;

  ovl.innerHTML = `<style>
    text{font-family:"Familjen Grotesk",sans-serif;paint-order:stroke;stroke-linejoin:round}
    .tn{font-size:11.5px;font-weight:500;fill:#1F2A30;stroke:rgba(246,246,240,.88);stroke-width:3px}
    .tn.city{font-size:13px;font-weight:700}
    .pk{font-family:"Newsreader",serif;font-style:italic;font-size:12.5px;fill:#2A2522;stroke:rgba(240,238,230,.8);stroke-width:2.6px}
    .rg{font-family:"Newsreader",serif;font-style:italic;font-size:${Math.max(13, s * 5.2).toFixed(1)}px;letter-spacing:.06em;fill:rgba(40,35,30,.62);stroke:rgba(236,232,220,.45);stroke-width:2.4px;text-anchor:middle}
    .sea{font-family:"Newsreader",serif;font-style:italic;font-size:${Math.max(14, s * 5.6).toFixed(1)}px;letter-spacing:.12em;fill:rgba(32,62,74,.72);text-anchor:middle}
    .eng{font-family:"Familjen Grotesk",sans-serif;font-size:12px;letter-spacing:.2em;fill:rgba(60,64,60,.55);text-anchor:middle}
  </style>` + o;
}

    ${sw(`<ellipse cx="0" cy="1" rx="6" ry="5" fill="#2B2724"/><ellipse cx="-.7" cy="-.2" rx="4.5" ry="3.8" fill="#3B3532"/><ellipse cx="-1.4" cy="-1.4" rx="3" ry="2.6" fill="#4D4540"/>`, D.tip)}

  </ul>

function renderTimeline() {
  const D = L();
  const tx = y => y <= 2000 ? (y - 1780) / 220 * .40 : y <= 2025 ? .40 + (y - 2000) / 25 * .15 : .55 + (y - 2025) / 75 * .45;
  const pc = y => (tx(y) * 100).toFixed(3) + "%";
  let h = "";
  h += `<div class="band past" style="left:0;width:${pc(2000)}"></div>`;
  h += `<div class="band present" style="left:${pc(2000)};width:${(15).toFixed(3)}%"></div>`;
  h += `<div class="band future" style="left:${pc(2025)};right:0"></div>`;
  const era = (k, y0, y1) => `<div class="era" style="left:${((tx(y0) + tx(y1)) * 50).toFixed(2)}%;transform:translateX(-50%)"><b>${esc(D.eras[k][0])}</b><span>${esc(D.eras[k][1])}</span></div>`;
  h += era("past", 1780, 2000) + era("present", 2000, 2025) + era("future", 2025, 2100);
  [1800, 1850, 1900, 1950].forEach(y => { h += `<div class="tick" style="left:${pc(y)}"></div><div class="tlab" style="left:${pc(y)}">${y}</div>`; });
  for (let y = 1780; y < 2000; y += 10) if (y % 50) h += `<div class="tick small" style="left:${pc(y)}"></div>`;
  for (let y = 2005; y < 2025; y += 5) h += `<div class="tick small" style="left:${pc(y)}"></div>`;
  h += `<div class="tick" style="left:${pc(2000)}"></div><div class="tlab" style="left:${pc(2000)}">2000</div>`;
  h += `<div class="tlab" style="left:0;transform:none">1780</div>`;
  for (let y = 2030; y < 2100; y += 5) if (y % 25) h += `<div class="tick small" style="left:${pc(y)}"></div>`;
  [2025, 2050, 2075].forEach(y => { h += `<div class="fold" style="left:calc(${pc(y)} - 1px)"></div><div class="tlab" style="left:${pc(y)}">${y}</div>`; });
  h += `<div class="tlab" style="left:auto;right:0;transform:none">2100</div>`;
  h += `<div class="fold-lab" style="left:${pc(2050)}">${esc(D.genBoundary)}</div>`;
  h += `<div class="now" style="left:calc(${pc(2031)} - 1px)"><span class="now-lab">2031</span></div>`;
  document.getElementById("strip").innerHTML = h;
  document.getElementById("t-foot").textContent = D.foot;
  document.getElementById("t-credit").textContent = D.credit;
}

document.getElementById("lang").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || b.dataset.lang === lang) return;
  lang = b.dataset.lang;
  const u = new URL(location.href); u.searchParams.set("lang", lang); history.replaceState(null, "", u);
  renderAll();
});
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { drawMap(); drawOverlay(); }, 80); });

Promise.all([
  document.fonts.load('500 12px "Familjen Grotesk"'), document.fonts.load('italic 13px "Newsreader"'), document.fonts.load('500 20px "Newsreader"'),
]).catch(() => {}).finally(renderAll);
</script>
