<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Papur v2: one decision, two scales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap&subset=latin-ext" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="data/wales.js"></script>
<script src="data/rhondda.js"></script>
<style>
/* PAPUR v2. Real things are paper. The player's choices are thread. */
:root{
  --board:#D8D9D3; --board-deep:#C9CAC3;
  --paper:#FAFAF6; --paper-2:#EEEEE7; --paper-edge:#D2D2CA;
  --ink:#1F2A30; --ink-2:#4E5B63; --ink-3:#6B767C; --rule:#C9CBC4;
  --thread:#B0262C; --thread-dark:#7E1A1F;          /* red thread: provenance, pull the thread */
  --stitch:#2C4E95; --stitch-hi:#D9E2F4;             /* carthen yarn: what the player has done */
  --slate:#39454D;
  --amber:#C98A2B;
  --sea-0:#7D96A0;
  /* carthen colour set, used only as woven trim */
  --oat:#E6E0CF; --bottle:#2F5B45; --mustard:#C49A2C; --navy:#2B3F63; --madder:#9C3B30; --charcoal:#2E3236;
  --past:#DCD6CA; --present:#F7F7F2; --future:#D9E2E4;
  --s-pro:#B48A1E; --s-res:#5A7B41; --s-hea:#2F7575; --s-equ:#82628A; --s-coh:#A0602F; --s-cul:#2F5E86; --s-glo:#5E8597;
  --serif:"Newsreader", Georgia, serif;
  --sans:"Familjen Grotesk", "Helvetica Neue", sans-serif;
  --grain:none; --grain-light:none; --weave-a:none; --weave-b:none; --weave-c:none; --weave-d:none;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--board);background-image:var(--grain-light);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.35;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--thread);outline-offset:2px}
.app{height:100vh;min-height:760px;display:grid;grid-template-rows:auto 1fr auto auto}

/* ---------- top bar ---------- */
.topbar{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:16px;padding:9px 20px 9px 22px}
.when{display:flex;align-items:center;gap:12px}
.year{font-family:var(--serif);font-weight:500;font-size:40px;line-height:1;letter-spacing:-.01em}
.termgen{display:flex;flex-direction:column;gap:1px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.termgen b{color:var(--ink);font-weight:600}
.strands{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.meter{position:relative;background:var(--paper);background-image:var(--grain);background-blend-mode:multiply;border-radius:2px;padding:6px 8px 7px;
  box-shadow:0 0 0 1px rgba(40,45,40,.08),1px 1.5px 0 var(--paper-edge),2px 4px 6px -3px rgba(30,35,30,.35);min-width:0;cursor:default}
.meter.pullable{cursor:pointer;box-shadow:0 0 0 1.5px var(--thread),1px 1.5px 0 var(--paper-edge),2px 4px 6px -3px rgba(30,35,30,.35)}
.meter.pullable::after{content:"";position:absolute;right:-4px;bottom:-4px;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#E2585C,var(--thread) 55%,var(--thread-dark));box-shadow:1px 1px 2px rgba(0,0,0,.35)}
.m-head{display:flex;align-items:center;justify-content:space-between;gap:4px}
.m-name{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-arrow{flex:none;display:flex;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink-2)}
/* the strand: woven yarn pips laid on an unwoven guide thread */
.m-yarn{position:relative;display:flex;gap:2px;margin-top:6px;height:8px;align-items:center}
.m-yarn::before{content:"";position:absolute;left:0;right:0;top:3.5px;border-top:1px dotted rgba(31,42,48,.35)}
.m-yarn b{position:relative;flex:1;height:6px;border-radius:3px;background:var(--paper);box-shadow:inset 0 0 0 1px rgba(31,42,48,.2)}
.m-yarn b.on{background-color:var(--c);background-image:repeating-linear-gradient(115deg,rgba(0,0,0,.28) 0 1.2px,transparent 1.2px 3.6px),linear-gradient(rgba(255,255,255,.25),transparent 60%);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.m-yarn b.new{animation:stitchIn .9s cubic-bezier(.2,.8,.2,1) both;outline:1.5px solid var(--thread);outline-offset:1px}
@keyframes stitchIn{0%{transform:scaleX(0);opacity:0}60%{transform:scaleX(1.25);opacity:1}100%{transform:scaleX(1)}}
.tip{position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%);width:230px;z-index:60;background:var(--ink);color:#F3F4F1;font-size:12.5px;line-height:1.35;padding:8px 10px;border-radius:2px;pointer-events:none;opacity:0;transition:opacity .12s}
.tip strong{display:block;font-family:var(--serif);font-weight:500;font-size:14.5px;margin-bottom:2px}
body.tracing .meter .tip{display:none}
.meter:hover .tip,.meter:focus .tip,.trust:hover .tip,.trust:focus .tip{opacity:1}
/* trust: a separate gauge, not an eighth strand */
.trust{position:relative;display:flex;align-items:center;gap:8px;padding:5px 10px 5px 8px;background:var(--slate);color:#EEF1F0;border-radius:2px;box-shadow:1px 1.5px 0 #262F35,2px 4px 6px -3px rgba(30,35,30,.5);cursor:default}
.trust .t-txt{display:flex;flex-direction:column;line-height:1.15}
.trust .t-txt b{font-size:12.5px;font-weight:600}
.trust .t-txt span{font-size:11.5px;color:#C9D2D4}
.trust svg{display:block}
.trust .tip{width:240px}
.lang{display:flex;padding:3px;border-radius:2px;background:var(--board-deep);box-shadow:inset 1px 1px 2px rgba(0,0,0,.18)}
.lang button{border:0;background:transparent;cursor:pointer;font-weight:600;font-size:13px;letter-spacing:.04em;padding:6px 11px;border-radius:1px;color:var(--ink-2)}
.lang button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:1px 1.5px 0 var(--paper-edge),1px 3px 4px -2px rgba(0,0,0,.3)}

/* ---------- table ---------- */
.table{display:grid;grid-template-columns:1fr var(--side-w);gap:14px;padding:0 20px;min-height:0;--side-w:clamp(372px,30vw,440px)}
.stage{position:relative;min-height:0;overflow:hidden;border-radius:3px;background:var(--sea-0);
  box-shadow:inset 0 0 0 1px rgba(20,30,35,.25),inset 2px 3px 8px rgba(10,20,30,.3),0 1px 0 rgba(255,255,255,.6);perspective:1800px}
.view{position:absolute;inset:0}
.view.off{visibility:hidden;pointer-events:none}
.view canvas,.view svg.overlay{position:absolute;inset:0;width:100%;height:100%;display:block}
.view svg.overlay{pointer-events:none}
.view svg.overlay .hit{pointer-events:auto;cursor:pointer}
#vRh{background:#B7BFA0}
.fold{position:absolute;inset:0;z-index:20;pointer-events:none;transform-style:preserve-3d}
.fold .half{position:absolute;top:0;bottom:0;overflow:hidden;backface-visibility:hidden;transform-style:preserve-3d;box-shadow:0 0 30px rgba(0,0,0,.25)}
.fold .inner{position:absolute;top:0}
.fold .inner canvas,.fold .inner svg{position:absolute;inset:0;display:block}
.fold .shade{position:absolute;inset:0;opacity:0}
.fold .half.l .shade{background:linear-gradient(90deg,rgba(255,255,255,.15),rgba(20,25,25,.55))}
.fold .half.r .shade{background:linear-gradient(90deg,rgba(20,25,25,.55),rgba(255,255,255,.1))}

.piece{background:var(--paper);background-image:var(--grain);background-blend-mode:multiply;border-radius:2px;
  box-shadow:0 0 0 1px rgba(40,45,40,.07),1px 1.5px 0 var(--paper-edge),2px 2.5px 0 #BFC0B8,3px 8px 14px -6px rgba(25,35,35,.45)}

/* Wales view pieces */
.curve{position:absolute;left:14px;top:14px;z-index:3;width:var(--place-w,272px);filter:drop-shadow(2px 3px 0 rgba(20,25,30,.25)) drop-shadow(3px 8px 10px rgba(20,25,30,.3));transform:rotate(-.6deg)}
.curve .sheet{background:var(--slate);background-image:repeating-linear-gradient(-62deg,rgba(255,255,255,.045) 0 1px,transparent 1px 7px),var(--grain);background-blend-mode:normal,multiply;color:#EEF1F0;padding:17px 15px 12px;
  clip-path:polygon(0% 7px,3% 3px,7% 6px,12% 2px,18% 5px,24% 1px,31% 6px,37% 3px,44% 5px,50% 1px,57% 5px,63% 2px,70% 6px,76% 2px,83% 5px,89% 1px,94% 5px,100% 3px,100% 100%,0% 100%)}
.cv-kick{display:flex;align-items:center;gap:7px;font-size:12px;color:#C9D2D4}
.cv-title{font-family:var(--serif);font-weight:500;font-size:19px;line-height:1.15;margin:6px 0 8px}
.cv-ripple{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:0;padding-top:8px;border-top:1px solid rgba(255,255,255,.16)}
.cv-ripple .lab{font-size:11px;font-weight:600;letter-spacing:.04em;color:#20262A;background:var(--amber);padding:2px 6px;border-radius:1px}
.place{position:absolute;left:14px;bottom:14px;z-index:3;width:var(--place-w,272px);padding:13px 15px}
.place::before{content:"";position:absolute;right:-5px;top:var(--pin-y,40%);width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#E2585C,var(--thread) 55%,var(--thread-dark));box-shadow:1px 1.5px 2px rgba(0,0,0,.35)}
.p-eyebrow{font-size:12px;color:var(--ink-2);margin:0 0 3px}
.p-name{font-family:var(--serif);font-weight:500;font-size:25px;line-height:1.05;margin:0}
.p-alt{display:flex;align-items:baseline;gap:6px;margin-top:3px;font-family:var(--serif);font-style:italic;font-size:14.5px;color:var(--ink-2)}
abbr.lg{font-family:var(--sans);font-style:normal;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-decoration:none;color:var(--ink-3);border:1px solid var(--rule);padding:0 4px;border-radius:2px}
.p-figs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 2px;padding-top:9px;border-top:1px solid var(--rule)}
.p-fig b{display:block;font-family:var(--serif);font-weight:500;font-size:23px;line-height:1}
.p-fig span{font-size:12px;color:var(--ink-2)}
.p-approx{font-size:11.5px;font-style:italic;color:var(--ink-3);margin:3px 0 8px}
.p-hist{font-family:var(--serif);font-size:14px;line-height:1.4;margin:0 0 10px}
.p-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip-src{display:inline-flex;align-items:center;gap:6px;border:0;background:#F3EDEA;box-shadow:inset 0 0 0 1px rgba(176,38,44,.35);font-size:12px;padding:4px 8px 4px 6px;border-radius:2px;color:var(--ink)}
.chip-src em{font-style:normal;color:var(--thread-dark);font-weight:600}
.conf{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);padding:3px 2px}
.conf .bars{display:flex;gap:2px;align-items:flex-end}
.conf .bars i{display:block;width:4px;background:var(--rule)}
.conf .bars i.on{background:var(--ink)}
.keytab{position:absolute;right:12px;top:12px;z-index:4}
.keytab > button{border:0;cursor:pointer;font-size:12px;font-weight:600;padding:5px 10px}
.keybox{position:absolute;right:0;top:34px;width:220px;padding:10px 12px;font-size:12px;color:var(--ink-2);display:none}
.keytab.open .keybox{display:block}
.keybox ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.keybox li,.rkey li{display:flex;align-items:center;gap:8px;line-height:1.2}
.keybox li svg,.rkey li svg{flex:none}

/* Rhondda view pieces */
.rcol{position:absolute;left:12px;top:12px;bottom:12px;width:var(--rcol-w,206px);z-index:3;display:flex;flex-direction:column;gap:10px}
.hist{padding:11px 12px}
.hist h2{font-family:var(--serif);font-weight:500;font-size:20px;line-height:1.1;margin:0}
.hist .alt{font-family:var(--serif);font-style:italic;font-size:13.5px;color:var(--ink-2);margin-top:2px}
.hist p{font-family:var(--serif);font-size:13.5px;line-height:1.38;margin:8px 0 0}
.hist .check{font-family:var(--sans);font-size:11px;font-weight:600;color:var(--thread-dark);background:#F3EDEA;padding:1px 5px;border-radius:1px;margin-left:3px;white-space:nowrap}
.peak{margin-top:8px;display:flex;align-items:flex-end;gap:8px}
.peak svg{display:block;flex:1}
.rkey{padding:10px 12px;font-size:11.5px;color:var(--ink-2);margin-top:auto}
.rkey ul{list-style:none;margin:0;padding:0;display:grid;gap:3px}
.zoomer{position:absolute;right:12px;top:12px;z-index:4;display:flex;flex-direction:column}
.zoomer button{width:30px;height:30px;border:0;cursor:pointer;font-size:17px;font-weight:600;display:grid;place-items:center}
.zoomer button + button{margin-top:6px}
.below{position:absolute;z-index:6;width:286px;padding:12px 13px 11px;font-size:12.5px}
.below[hidden]{display:none}
.b-head{display:flex;gap:9px;align-items:flex-start}
.b-no{flex:none;width:22px;height:22px;display:grid;place-items:center;font-weight:700;font-size:12px;background:var(--ink);color:var(--paper);border-radius:1px}
.b-head h3{font-family:var(--serif);font-weight:500;font-size:18px;line-height:1.1;margin:0}
.b-src{font-size:11.5px;color:var(--ink-2);margin:2px 0 0}
.x{margin-left:auto;border:0;background:none;cursor:pointer;font-size:16px;line-height:1;padding:2px 4px;color:var(--ink-2)}
.b-risk{display:flex;gap:6px;align-items:center;font-size:12px;margin:8px 0 6px;padding:4px 7px;background:#F6EEDD;box-shadow:inset 0 0 0 1px rgba(201,138,43,.5);border-radius:1px}
.below dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:6px 0 8px}
.below dt{color:var(--ink-2);font-size:11.5px;white-space:nowrap}
.below dd{margin:0;font-size:12.5px}
.below dd b{font-family:var(--serif);font-weight:500;font-size:17px;line-height:1}
.below dd.none{color:var(--ink-3)}
.b-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding-top:8px;border-top:1px dashed var(--rule)}
.link{white-space:nowrap;border:0;background:none;padding:0;cursor:pointer;color:var(--thread-dark);font-weight:600;font-size:12px;text-decoration:underline;text-underline-offset:2px}
.btn{white-space:nowrap;border:0;cursor:pointer;font-weight:600;font-size:12.5px;padding:7px 11px;border-radius:2px;background:var(--stitch);color:#fff;box-shadow:1px 1.5px 0 #1B3264}
.btn.ghost{background:var(--paper-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.rule{position:absolute;z-index:7;width:350px;padding:14px 16px 13px;font-size:12.5px}
.rule[hidden]{display:none}
.rule h3{font-family:var(--serif);font-weight:500;font-size:19px;margin:0 0 6px}
.rule .plain{font-family:var(--serif);font-size:14.5px;line-height:1.4;margin:0 0 8px}
.rule .param{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin:6px 0;font-size:12.5px}
.rule input[type=range]{width:100%;accent-color:var(--ink)}
.rule output{font-weight:700;font-variant-numeric:tabular-nums;min-width:54px;text-align:right}
.rule h4{font-size:11.5px;font-weight:600;color:var(--ink-2);margin:10px 0 4px}
.rule ul{margin:0;padding-left:16px;display:grid;gap:3px;color:var(--ink-2);font-size:12px}
.rule .badge{display:inline-flex;align-items:center;gap:6px;margin-top:9px;font-size:12px;font-weight:600;padding:4px 8px;background:#F3EDEA;box-shadow:inset 0 0 0 1px rgba(176,38,44,.35);border-radius:1px}

/* ---------- side ---------- */
.side{position:relative;min-height:0}
.panel{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;min-height:0}
.panel.off{visibility:hidden;pointer-events:none}
.voice{position:relative;padding:11px 14px 10px 18px}
.voice::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background-image:var(--weave-b);background-size:12px 12px;image-rendering:pixelated;border-radius:2px 0 0 2px}
.voice q{display:block;font-family:var(--serif);font-style:italic;font-size:15px;line-height:1.35;quotes:"\201C" "\201D"}
.voice .who{display:flex;justify-content:space-between;gap:8px;margin-top:5px;font-size:12px;color:var(--ink-2)}
.voice .who b{color:var(--ink);font-weight:600}
.hand-h{display:flex;align-items:baseline;justify-content:space-between;margin:2px 2px -2px}
.hand-h h2{font-family:var(--serif);font-weight:500;font-style:italic;font-size:16px;margin:0;color:var(--ink-2)}
.hand-h span{font-size:12px;color:var(--ink-2)}
.hand{flex:1;min-height:0;display:grid;grid-template-rows:repeat(4,1fr);gap:9px}
/* railway tickets on Papur stock */
.ticket{position:relative;min-height:0;filter:drop-shadow(1px 1.5px 0 var(--paper-edge)) drop-shadow(1px 1px 0 #BDBEB6) drop-shadow(2px 6px 7px rgba(25,35,35,.26))}
.ticket .sheet{height:100%;display:grid;grid-template-columns:70px 1fr;background:var(--paper);background-image:var(--grain);background-blend-mode:multiply;
  -webkit-mask:radial-gradient(circle 7px at 0 0,#0000 98%,#000) top left/51% 51% no-repeat,radial-gradient(circle 7px at 100% 0,#0000 98%,#000) top right/51% 51% no-repeat,radial-gradient(circle 7px at 0 100%,#0000 98%,#000) bottom left/51% 51% no-repeat,radial-gradient(circle 7px at 100% 100%,#0000 98%,#000) bottom right/51% 51% no-repeat;
  mask:radial-gradient(circle 7px at 0 0,#0000 98%,#000) top left/51% 51% no-repeat,radial-gradient(circle 7px at 100% 0,#0000 98%,#000) top right/51% 51% no-repeat,radial-gradient(circle 7px at 0 100%,#0000 98%,#000) bottom left/51% 51% no-repeat,radial-gradient(circle 7px at 100% 100%,#0000 98%,#000) bottom right/51% 51% no-repeat}
.stub{position:relative;background:var(--paper-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding-left:9px}
.stub::before{content:"";position:absolute;left:0;top:0;bottom:0;width:9px;background-image:var(--wv);background-size:12px 12px;image-rendering:pixelated}
.stub::after{content:"";position:absolute;right:-1px;top:6px;bottom:6px;border-right:2px dotted #A9AAA2}
.stub svg{width:36px;height:36px}
.stub .no{font-size:10.5px;font-weight:600;letter-spacing:.04em;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tbody{padding:8px 12px 8px 12px;display:flex;flex-direction:column;gap:5px;min-width:0}
.t-title{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.t-title h3{font-family:var(--serif);font-weight:500;font-size:17px;line-height:1.1;margin:0}
.t-alt{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink-2);margin-top:-4px}
.effects{display:flex;flex-wrap:wrap;gap:3px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;line-height:1.2;padding:2px 6px 2px 4px;border-radius:1px;background:#EEEFEA;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.chip i{width:10px;height:5px;border-radius:2.5px;background-color:var(--c);background-image:repeating-linear-gradient(115deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);flex:none}
.chip.strain{background:transparent;box-shadow:inset 0 0 0 1px var(--rule);color:var(--ink-2)}
.chip.strain i{background:transparent;box-shadow:inset 0 0 0 1.2px var(--c);background-image:none}
.chip.note{background:transparent;box-shadow:inset 0 0 0 1px var(--rule);border-style:dashed;color:var(--ink-2);font-style:italic}
.tmeta{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-2)}
.pips{display:inline-flex;gap:3px;vertical-align:middle;margin-left:4px}
.pips b{width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.3px var(--ink-2)}
.pips b.on{background:var(--ink);box-shadow:none}
.play{border:0;cursor:pointer;font-size:12px;font-weight:600;padding:3px 9px;border-radius:2px;background:var(--ink);color:var(--paper)}
.ticket.playable{cursor:pointer}
.ticket.playable:hover{transform:translateY(-2px)}
.ticket.playable{transition:transform .15s}
.ticket.spent .sheet{filter:saturate(.3)}
.ticket.spent .tbody > *:not(.stamp){opacity:.5}
.stamp{position:absolute;right:14px;top:50%;transform:translateY(-50%) rotate(-8deg);border:2px solid var(--thread);color:var(--thread);font-weight:700;font-size:12px;letter-spacing:.06em;padding:3px 8px;border-radius:2px;background:rgba(250,250,246,.8)}
.punch{position:absolute;left:58px;top:12px;width:11px;height:11px;border-radius:50%;background:var(--board);box-shadow:inset 1px 1px 2px rgba(0,0,0,.45)}

/* decision panel */
.d-ticket{display:grid;grid-template-columns:62px 1fr;min-height:66px}
.d-ticket .tbody{justify-content:center;gap:2px}
.d-ticket h3{font-family:var(--serif);font-weight:500;font-size:18px;margin:0}
.d-ticket p{margin:0;font-size:12.5px;color:var(--ink-2)}
.tokens{display:flex;align-items:center;gap:10px;padding:2px 4px}
.tokens .spools{display:flex;gap:6px}
.tokens span{font-size:12.5px;color:var(--ink-2)}
.d-list{flex:1;min-height:0;overflow:auto;padding:6px 0 4px}
.d-list table{width:100%;border-collapse:collapse;font-size:12px}
.d-list th{font-size:10.5px;font-weight:600;color:var(--ink-2);text-align:left;padding:0 6px 4px;border-bottom:1px solid var(--rule);white-space:nowrap}
.d-list th.n,.d-list td.n{text-align:right}
.d-list td{padding:3px 6px;border-bottom:1px solid rgba(201,203,196,.55);white-space:nowrap}
.d-list tr.row{cursor:pointer}
.d-list tr.row:hover td{background:rgba(31,42,48,.04)}
.d-list tr.sel td{background:rgba(31,42,48,.08)}
.d-list .no{display:inline-grid;place-items:center;width:17px;height:16px;font-weight:700;font-size:10.5px;background:var(--ink);color:var(--paper);border-radius:1px}
.d-list tr.stitched .no{background:var(--stitch)}
.d-list .nm{max-width:146px;overflow:hidden;text-overflow:ellipsis;display:block}
.d-list .bar{display:inline-block;height:5px;background:var(--ink-3);vertical-align:middle;margin-left:5px;border-radius:1px}
.flags{display:inline-flex;gap:3px}
.flags i{display:inline-grid;place-items:center;width:16px;height:15px;font-style:normal;font-size:9.5px;font-weight:700;border-radius:1px;background:#E7E8E2;color:var(--ink-3)}
.flags i.on{background:var(--ink);color:var(--paper)}
.flags i.fl.on{background:#4F7F95}
.flags i.dep.on{background:var(--s-equ)}
.d-foot{display:flex;flex-direction:column;gap:8px;padding:9px 12px 10px}
.d-foot .row2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.d-legend{font-size:11px;color:var(--ink-2);padding:6px 8px 0;display:flex;flex-wrap:wrap;gap:3px 9px}
.d-legend b{display:inline-grid;place-items:center;min-width:14px;height:13px;font-size:9.5px;background:var(--ink);color:var(--paper);border-radius:1px;margin-right:3px;padding:0 2px}
.d-foot .msg{font-size:12px;color:var(--ink-2);min-height:16px}

/* the trace: pulled thread */
.trace{position:absolute;left:14px;top:14px;z-index:8;width:340px;padding:13px 15px 12px 26px;max-height:calc(100% - 28px);overflow:auto}
.trace[hidden]{display:none}
.trace h3{font-family:var(--serif);font-weight:500;font-size:19px;margin:0 0 2px}
.trace .sub{font-size:12px;color:var(--ink-2);margin:0 0 8px}
.trace section{position:relative;padding:6px 0 8px;border-top:1px solid var(--rule)}
.trace section h4{font-size:11px;font-weight:600;color:var(--ink-2);margin:0 0 3px}
.trace section p,.trace section li{font-size:12.5px;margin:0}
.trace section ul{margin:0;padding-left:15px;display:grid;gap:3px}
.trace .knot{position:absolute;left:-17px;top:9px;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#E2585C,var(--thread) 55%,var(--thread-dark))}
.trace .note{font-size:11.5px;font-style:italic;color:var(--ink-3);margin-top:6px}
svg.threadlayer{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:9}

/* timeline */
.timeline{padding:12px 20px 0}
.strip{position:relative;height:56px;filter:drop-shadow(1px 1.5px 0 var(--paper-edge)) drop-shadow(2px 5px 6px rgba(25,35,35,.25))}
.strip .band{position:absolute;top:0;height:40px;background-image:var(--grain);background-blend-mode:multiply}
.strip .band.past{background-color:var(--past);background-image:repeating-linear-gradient(90deg,transparent 0 22px,rgba(0,0,0,.055) 22px 23px,rgba(255,255,255,.35) 23px 24px,transparent 24px 46px),var(--grain)}
.strip .band.present{background-color:var(--present)}
.strip .band.future{background-color:var(--future)}
.era{position:absolute;top:5px;display:flex;align-items:baseline;gap:6px;white-space:nowrap;transform:translateX(-50%)}
.era b{font-family:var(--serif);font-weight:500;font-style:italic;font-size:17px}
.era span{font-size:12px;color:var(--ink-2)}
.tick{position:absolute;top:28px;height:12px;width:1px;background:rgba(31,42,48,.45)}
.tick.small{top:34px;height:6px;background:rgba(31,42,48,.3)}
.tlab{position:absolute;top:42px;font-size:11.5px;color:var(--ink-2);transform:translateX(-50%);font-variant-numeric:tabular-nums}
.fold-c{position:absolute;top:0;height:40px;width:2px;background:linear-gradient(90deg,rgba(0,0,0,.2),rgba(255,255,255,.7))}
.fold-lab{position:absolute;top:24px;font-size:10.5px;color:var(--ink-2);white-space:nowrap;padding-left:5px}
.now{position:absolute;top:-4px;height:48px;width:2px;background:var(--thread)}
.now::before{content:"";position:absolute;left:-4px;top:-3px;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#E2585C,var(--thread) 55%,var(--thread-dark));box-shadow:1px 1.5px 2px rgba(0,0,0,.35)}
.now-lab{position:absolute;top:8px;left:6px;font-size:12px;font-weight:700;color:var(--thread-dark);white-space:nowrap;background:var(--future);padding:0 4px}
.tstitch{position:absolute;top:20px;width:14px;height:14px}
.foot{display:flex;justify-content:space-between;gap:20px;padding:2px 20px 8px;font-size:11.5px;color:var(--ink-2)}

@media (max-height:840px){
  .year{font-size:34px}
  .topbar{padding:7px 16px 7px 18px;gap:12px}
  .table{padding:0 16px;gap:12px}
  .timeline{padding:10px 16px 0}
  .foot{padding:2px 16px 6px}
  .curve,.place{--place-w:250px}
  .cv-title{font-size:17px;margin:5px 0 6px}
  .curve .sheet{padding:14px 13px 10px}
  .place{padding:11px 13px}
  .p-name{font-size:22px}
  .p-hist{font-size:13px;margin-bottom:8px}
  .p-fig b{font-size:20px}
  .t-title h3{font-size:15px}
  .stub svg{width:30px;height:30px}
  .tbody{padding:6px 10px;gap:3px}
  .chip{font-size:11px;padding:1px 5px 1px 4px}
  .voice q{font-size:13.5px}
  .voice{padding:8px 12px 8px 17px}
  .rcol{--rcol-w:190px}
  .hist p{font-size:12.5px}
  .hist h2{font-size:18px}
  .d-list td{padding:2px 5px}
  .below{width:270px;padding:10px 11px}
}
@media (max-width:1340px){
  .table{--side-w:368px}
  .m-name{font-size:11.5px}
  .meter{padding:5px 6px 6px}
  .trust .t-txt span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

  const pc = y => (tx(y) * 100).toFixed(3) + "%";
  let h = `<div class="band past" style="left:0;width:${pc(2000)}"></div><div class="band present" style="left:${pc(2000)};width:15%"></div><div class="band future" style="left:${pc(2025)};right:0"></div>`;
  const era = (k, a, b) => `<div class="era" style="left:${((tx(a) + tx(b)) * 50).toFixed(2)}%"><b>${esc(D.eras[k][0])}</b><span>${esc(D.eras[k][1])}</span></div>`;
  h += era("past", 1780, 2000) + era("present", 2000, 2025) + era("future", 2025, 2100);
  [1800, 1850, 1900, 1950, 2000].forEach(y => { h += `<div class="tick" style="left:${pc(y)}"></div><div class="tlab" style="left:${pc(y)}">${y}</div>`; });
  for (let y = 1780; y < 2000; y += 10) if (y % 50) h += `<div class="tick small" style="left:${pc(y)}"></div>`;
  for (let y = 2005; y < 2025; y += 5) h += `<div class="tick small" style="left:${pc(y)}"></div>`;
  h += `<div class="tlab" style="left:0;transform:none">1780</div>`;
  for (let y = 2030; y < 2100; y += 5) if (y % 25) h += `<div class="tick small" style="left:${pc(y)}"></div>`;
  [2025, 2050, 2075].forEach(y => { h += `<div class="fold-c" style="left:calc(${pc(y)} - 1px)"></div><div class="tlab" style="left:${pc(y)}">${y}</div>`; });
  h += `<div class="tlab" style="left:auto;right:0;transform:none">2100</div><div class="fold-lab" style="left:${pc(2050)}">${esc(D.genBoundary)}</div>`;
  if (S.played) h += `<svg class="tstitch" style="left:calc(${pc(2033)} - 7px)" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 3L11 11M11 3L3 11" stroke="#14244A" stroke-width="3" stroke-linecap="round"/><path d="M3 3L11 11M11 3L3 11" stroke="#4A6FBF" stroke-width="1.6" stroke-linecap="round"/></svg>`;
  h += `<div class="now" style="left:calc(${pc(2031)} - 1px)"><span class="now-lab">2031</span></div>`;
  document.getElementById("strip").innerHTML = h;
  document.getElementById("t-foot").textContent = D.foot;
  document.getElementById("t-credit").textContent = D.credit;
}

/* ===================================================================
   Interaction
   =================================================================== */
function selectTip(i) { S.sel = S.sel === i ? null : i; if (S.sel != null && S.zoom > 1.4) S.centre = [TIPS[i].x, TIPS[i].y]; refreshRh(S.zoom > 1.4); }
function toggleToken(i) {
  const k = S.tokens.indexOf(i);
  if (k >= 0) S.tokens.splice(k, 1);
  else if (S.tokens.length >= 3) { const m = document.getElementById("dmsg"); if (m) m.textContent = L().decide.full; return; }
  else S.tokens.push(i);
  refreshRh();
}
function openRule(on) { S.rule = on; renderRule(); }
function refreshRh(redraw) {
  if (redraw) drawRhondda(); else { drawBelowLayer(); drawRhOverlay(); }
  renderDecide(); renderBelow(); renderRule();
}
document.getElementById("zoomer").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.z === "in") { S.zoom = 2.6; S.centre = S.sel != null ? [TIPS[S.sel].x, TIPS[S.sel].y] : [131.8, 206.6]; }
  else { S.zoom = 1; S.centre = null; }
  refreshRh(true);
});
// drag to pan when zoomed in; the cached sheet slides, then is redrawn where it lands
(() => { let d = null; const v = document.getElementById("vRh");
  v.addEventListener("pointerdown", e => { if (S.zoom <= 1 || e.target.closest(".hit,.piece,button,aside")) return; d = { x: e.clientX, y: e.clientY, c: S.centre.slice() }; v.setPointerCapture(e.pointerId); });
  v.addEventListener("pointermove", e => { if (!d) return; const dx = e.clientX - d.x, dy = e.clientY - d.y; ["cRh", "cBelow", "oRh"].forEach(id => document.getElementById(id).style.transform = `translate(${dx}px,${dy}px)`); });
  v.addEventListener("pointerup", e => { if (!d) return; const dx = e.clientX - d.x, dy = e.clientY - d.y; ["cRh", "cBelow", "oRh"].forEach(id => document.getElementById(id).style.transform = ""); if (Math.hypot(dx, dy) > 3) { S.centre = [d.c[0] - dx / VR.s, d.c[1] - dy / VR.s]; refreshRh(true); } d = null; });
})();
document.getElementById("keybtn").addEventListener("click", () => document.getElementById("keytab").classList.toggle("open"));

const reduced = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function snapshotHalves() {
  // two halves of the national sheet, creased through the Rhondda
  const W = VW.W, H = VW.H, [cx] = projW(FOLD_AT[0], FOLD_AT[1]);
  const layer = document.createElement("div"); layer.className = "fold";
  const src = document.getElementById("cWales"), ov = document.getElementById("oWales");
  const halves = ["l", "r"].map(side => {
    const half = document.createElement("div"); half.className = "half " + side;
    if (side === "l") { half.style.left = "0"; half.style.width = cx + "px"; half.style.transformOrigin = "100% 50%"; }
    else { half.style.left = cx + "px"; half.style.right = "0"; half.style.transformOrigin = "0 50%"; }
    const inner = document.createElement("div"); inner.className = "inner"; inner.style.width = W + "px"; inner.style.height = H + "px"; inner.style.left = (side === "l" ? 0 : -cx) + "px";
    const c = document.createElement("canvas"); c.width = src.width; c.height = src.height; c.style.width = W + "px"; c.style.height = H + "px"; c.getContext("2d").drawImage(src, 0, 0);
    inner.appendChild(c); const o2 = ov.cloneNode(true); o2.removeAttribute("id"); o2.style.width = W + "px"; o2.style.height = H + "px"; inner.appendChild(o2);
    const sh = document.createElement("div"); sh.className = "shade";
    half.appendChild(inner); half.appendChild(sh); layer.appendChild(half); return half;
  });
  stage.appendChild(layer);
  return { layer, halves, origin: projW(FOLD_AT[0], FOLD_AT[1]) };
}
function swapSide(toDecide) {
  const a = document.getElementById("pHand"), b = document.getElementById("pDecide");
  (toDecide ? a : b).classList.add("off"); (toDecide ? b : a).classList.remove("off");
  if (!reduced()) (toDecide ? b : a).animate([{ opacity: 0, transform: "translateY(8px)" }, { opacity: 1, transform: "none" }], { duration: 380, easing: "ease-out" });
}
function foldDown() {
  if (S.busy || S.played) return; S.busy = true;
  closeTrace();
  S.view = "rhondda"; S.sel = null; S.rule = false; S.zoom = 1; S.centre = null;
  const vW = document.getElementById("vWales"), vR = document.getElementById("vRh");
  vR.classList.remove("off"); renderRhPieces(); drawRhondda(); renderDecide(); renderBelow(); renderRule();
  swapSide(true);
  if (reduced()) { vW.classList.add("off"); S.busy = false; return; }
  const { layer, halves, origin } = snapshotHalves();
  vW.classList.add("off");
  layer.style.transformOrigin = `${origin[0]}px ${origin[1]}px`;
  const E = "cubic-bezier(.55,0,.25,1)";
  layer.animate([{ transform: "scale(1)" }, { transform: "scale(2.6)" }], { duration: 1200, easing: E, fill: "forwards" });
  halves[0].animate([{ transform: "rotateY(0deg)", opacity: 1 }, { transform: "rotateY(0deg)", opacity: 1, offset: .12 }, { transform: "rotateY(80deg)", opacity: 1, offset: .8 }, { transform: "rotateY(100deg)", opacity: 0 }], { duration: 1200, easing: E, fill: "forwards" });
  halves[1].animate([{ transform: "rotateY(0deg)", opacity: 1 }, { transform: "rotateY(0deg)", opacity: 1, offset: .12 }, { transform: "rotateY(-80deg)", opacity: 1, offset: .8 }, { transform: "rotateY(-100deg)", opacity: 0 }], { duration: 1200, easing: E, fill: "forwards" });
  halves.forEach(h => h.querySelector(".shade").animate([{ opacity: 0 }, { opacity: .9 }], { duration: 1100, easing: "ease-in", fill: "forwards" }));
  vR.animate([{ opacity: 0, transform: "translateY(-16px) scale(1.035)" }, { opacity: 1, transform: "none" }], { duration: 820, delay: 420, easing: "cubic-bezier(.2,.75,.25,1)", fill: "backwards" });
  setTimeout(() => { layer.remove(); S.busy = false; }, 1260);
}
function foldUp(confirmed) {
  if (S.busy) return; S.busy = true;
  if (confirmed) {
    S.played = true; S.newPips = ["res", "hea"];
    STRANDS.find(s => s.id === "res").lvl += 1; STRANDS.find(s => s.id === "hea").lvl += 1;
    STRANDS.find(s => s.id === "res").d = 1; STRANDS.find(s => s.id === "hea").d = 1;
  } else S.tokens = [];
  S.view = "wales"; S.sel = null; S.rule = false;
  const vW = document.getElementById("vWales"), vR = document.getElementById("vRh");
  vW.classList.remove("off"); drawWales(); drawWalesOverlay(); renderHand(); renderTimeline();
  document.getElementById("below").hidden = true; document.getElementById("rule").hidden = true;
  swapSide(false);
  const finish = () => { vR.classList.add("off"); S.busy = false;
    if (confirmed) { renderTop(); setTimeout(() => { S.trust = 55; S.newPips = []; renderTop(); wireStrands(); }, 1100); wireStrands(); } };
  if (reduced()) { finish(); return; }
  const { layer, halves, origin } = snapshotHalves();
  vW.classList.add("off");
  layer.style.transformOrigin = `${origin[0]}px ${origin[1]}px`;
  const E = "cubic-bezier(.45,0,.2,1)";
  vR.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateY(-18px) scale(.96)" }], { duration: 520, easing: "ease-in", fill: "forwards" });
  layer.animate([{ transform: "scale(2.6)" }, { transform: "scale(1)" }], { duration: 1150, easing: E, fill: "forwards" });
  halves[0].animate([{ transform: "rotateY(100deg)", opacity: 0 }, { transform: "rotateY(80deg)", opacity: 1, offset: .2 }, { transform: "rotateY(0deg)", opacity: 1 }], { duration: 1150, easing: E, fill: "forwards" });
  halves[1].animate([{ transform: "rotateY(-100deg)", opacity: 0 }, { transform: "rotateY(-80deg)", opacity: 1, offset: .2 }, { transform: "rotateY(0deg)", opacity: 1 }], { duration: 1150, easing: E, fill: "forwards" });
  halves.forEach(h => h.querySelector(".shade").animate([{ opacity: .9 }, { opacity: 0 }], { duration: 1150, easing: "ease-out", fill: "forwards" }));
  setTimeout(() => { vW.classList.remove("off"); layer.remove(); vR.getAnimations().forEach(a => a.cancel()); finish(); }, 1180);
}

/* ===================================================================
   Pull the thread: the trace
   =================================================================== */
function wireStrands() {
  document.querySelectorAll(".meter.pullable").forEach(m => { m.onclick = () => S.trace ? closeTrace() : openTrace(); m.onkeydown = e => { if (e.key === "Enter") openTrace(); }; });
}
function openTrace() {
  S.trace = true; document.body.classList.add("tracing"); renderTrace();
}
function closeTrace() { S.trace = false; document.body.classList.remove("tracing"); document.getElementById("trace").hidden = true; document.getElementById("threadlayer").innerHTML = ""; }
function renderTrace() {
  if (!S.trace) return;
  const D = L(), T = D.trace, Bd = D.below, el = document.getElementById("trace");
  const tips = S.tokens.map(i => TIPS[i]);
  el.innerHTML = `<div style="display:flex;align-items:flex-start"><div><h3>${esc(T.title)}</h3><p class="sub">${esc(T.sub)}</p></div><button class="x" type="button" aria-label="close" id="traceX">&#215;</button></div>
    <section data-k="strand"><span class="knot"></span><h4>${esc(T.strand)}</h4><p>${esc(T.strandTxt)}</p></section>
    <section data-k="card"><span class="knot"></span><h4>${esc(T.card)}</h4><p>${esc(T.cardTxt)}</p></section>
    <section data-k="tips"><span class="knot"></span><h4>${esc(T.tips)}</h4><ul>${tips.map(t => `<li><b>${t.n}. ${esc(tipName(t))}</b><br><span style="color:var(--ink-2)">${esc(T.line(fmtHa(t.B.resHa), t.B.bld, t.B.schools.length, t.B.rail.size || t.B.stations.length))}${t.B.flood ? ", " + esc(Bd.zone(t.B.flood)) : ""}${t.B.lsoaMin ? ", WIMD " + t.B.lsoaMin.wimdRank : ""}</span></li>`).join("")}</ul></section>
    <section data-k="rule"><span class="knot"></span><h4>${esc(T.rule)}</h4><p>${esc(T.ruleTxt(S.D))}</p><ul style="margin-top:4px">${D.rule.src.slice(0, 5).map(s => `<li style="font-size:11.5px;color:var(--ink-2)">${esc(s)}</li>`).join("")}</ul></section>
    <p class="note">${esc(T.note)}</p>`;
  el.hidden = false;
  document.getElementById("traceX").onclick = closeTrace;
  requestAnimationFrame(drawThread);
}
function drawThread() {
  const lay = document.getElementById("threadlayer"); if (!S.trace) { lay.innerHTML = ""; return; }
  const r = e => e.getBoundingClientRect();
  const m = document.querySelector('.meter[data-strand="res"]'), kn = [...document.querySelectorAll("#trace .knot")].map(r);
  const tk = document.querySelector('.ticket[data-card="tips"]');
  if (!m || !kn.length || !tk) return;
  const mr = r(m), tr = r(tk), sl = r(document.getElementById("trace")), c = k => [k.left + k.width / 2, k.top + k.height / 2];
  const kp = kn.map(c), mx = mr.left + mr.width / 2, my = mr.bottom, ex = sl.left - 7;
  // down from the strand, along the gap above the table, then down the slip's edge through each knot
  let d = `M${mx},${my} C${mx},${my + 10} ${mx - 20},${sl.top - 6} ${mx - 60},${sl.top - 6} L${ex + 20},${sl.top - 6} Q${ex},${sl.top - 6} ${ex},${sl.top + 14} L${ex},${kp[0][1] - 10} Q${ex},${kp[0][1]} ${kp[0][0]},${kp[0][1]}`;
  for (let i = 1; i < kp.length; i++) { const a = kp[i - 1], b = kp[i]; d += ` C${a[0] - 16},${a[1] + 18} ${b[0] - 16},${b[1] - 18} ${b[0]},${b[1]}`; }
  // branches leave from the slip's right edge: card to the spent ticket, tips to the stitched ring on the map
  const sec = k => r(document.querySelector(`#trace section[data-k="${k}"]`));
  const cs = sec("card"), ts = sec("tips");
  const k2 = [sl.right, cs.top + 12], k3 = [sl.right, ts.top + 12];
  const ring = document.querySelector("#oWales .stitch"); let br2 = "";
  if (ring) { const rr = r(ring), rx = rr.left + rr.width / 2, ry = rr.top + rr.height / 2; br2 = `M${k3[0]},${k3[1]} C${k3[0] + 140},${k3[1]} ${rx - 60},${ry - 90} ${rx},${ry}`; }
  const tx = tr.left + 6, ty = tr.top + tr.height / 2;
  const br1 = `M${k2[0]},${k2[1]} C${k2[0] + 220},${k2[1] - 20} ${tx - 180},${ty} ${tx},${ty}`;
  const th = p => `<path d="${p}" fill="none" stroke="#B0262C" stroke-width="2" stroke-linecap="round"/><path d="${p}" fill="none" stroke="#6E1418" stroke-width="2" stroke-dasharray="1.2 2.4" opacity=".7"/>`;
  lay.innerHTML = `<g style="filter:drop-shadow(1px 1.5px 1px rgba(60,10,12,.4))">${th(d)}${th(br1)}${br2 ? th(br2) : ""}<circle cx="${tx}" cy="${ty}" r="4" fill="#B0262C"/><circle cx="${k2[0]}" cy="${k2[1]}" r="3.5" fill="#B0262C"/><circle cx="${k3[0]}" cy="${k3[1]}" r="3.5" fill="#B0262C"/></g>`;
}

/* ===================================================================
   Boot
   =================================================================== */
function renderAll() {
  renderTop(); renderWalesPieces(); renderHand(); renderTimeline();
  drawWales(); drawWalesOverlay(); wireStrands();
  if (S.view === "rhondda") { renderRhPieces(); drawRhondda(); renderDecide(); renderBelow(); renderRule(); }
  if (S.trace) renderTrace();
}
document.getElementById("lang").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || b.dataset.lang === lang) return;
  lang = b.dataset.lang; const u = new URL(location.href); u.searchParams.set("lang", lang); history.replaceState(null, "", u); renderAll();
});
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { WCACHE = null; RCACHE.clear(); renderAll(); if (S.view === "wales") setTimeout(warmRhondda, 60); if (S.trace) requestAnimationFrame(drawThread); }, 100); });
Promise.all([document.fonts.load('500 12px "Familjen Grotesk"'), document.fonts.load('italic 13px "Newsreader"'), document.fonts.load('500 20px "Newsreader"')])
  .catch(() => {}).finally(() => { renderAll(); setTimeout(warmRhondda, 60); });
</script>
